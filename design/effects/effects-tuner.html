<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Effects tuner — /portfolio</title>
  <!--
    The effect stack, on sliders, over the REAL /portfolio in an iframe — the
    same trick design/type-tuner.html uses, and for the same reason: that page
    builds its whole DOM from content.js at runtime, so anything cloned here
    would be a copy that drifts. Nothing is cloned. Every control writes a custom
    property or an effect token into the live page through the seam effects.js
    exposes as window.portfolioFx, and what you are looking at is the site.

    Serve the repo root (run.bat) and open
        http://localhost:8000/design/effects/effects-tuner.html

    THERE IS NO DEFAULTS TABLE HERE, and that is worth stating because the type
    tuner has one and needs a drift banner to keep it honest. It gets away
    without one because of a property the stack was built with: every row below
    is declared in styles.css as a PLAIN LITERAL — `0.14`, `9px`, `multiply` —
    never a calc, a var or a clamp. getComputedStyle hands a custom property back
    as the tokens it was declared with, so for these rows that text IS the
    default, read from the sheet on load. The one thing that would break it is
    somebody rewriting a row's declaration as an expression; then it would show
    here as a default of NaN rather than as a wrong number quietly shipped.

    PER-THEME ROWS. Eight of them — the film's and the paper's levels stages —
    are declared once in :root and again in :root[data-theme="dark"], because
    this page's two papers are #fff and #000 and one set of numbers cannot serve
    both (see THE LEVELS STAGE in styles.css). They are held, probed and exported
    per theme, exactly as plate-tuner.html holds --plate-opacity, and the export
    puts each half in the right block.
  -->
  <style>
    :root { color-scheme: light dark; --ui: #1a1917; --ui-bg: #fcfbf8; --ui-panel: #f5f2ea; --ui-line: #d6d0c4; --ui-mut: #6f6a5d; --ui-hit: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --ui: #eaeaea; --ui-bg: #161616; --ui-panel: #1e1e1e; --ui-line: #3a3a3a; --ui-mut: #9a9a9a; --ui-hit: #d8a76a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      background: var(--ui-bg); color: var(--ui);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    .top {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ui-line);
    }
    .top strong { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .grow { flex: 1 1 auto; }
    button, select, input[type="text"], input[type="number"], textarea {
      font: inherit; color: var(--ui); background: transparent;
      border: 1px solid var(--ui-line); border-radius: 5px;
    }
    select, input[type="text"], input[type="number"], textarea { background: var(--ui-bg); color-scheme: light dark; }
    button { padding: 0.24rem 0.55rem; cursor: pointer; }
    button:hover { border-color: var(--ui-mut); }
    button[aria-pressed="true"] { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    .badge { padding: 0.1rem 0.4rem; border-radius: 99px; background: var(--ui-hit); color: var(--ui-bg); font-size: 11px; }
    .badge[data-n="0"] { background: transparent; color: var(--ui-mut); }

    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .side { flex: 0 0 24rem; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--ui-line); background: var(--ui-panel); }
    .controls { flex: 1 1 auto; overflow: auto; padding-bottom: 0.8rem; }
    .stage { flex: 1 1 auto; min-width: 0; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 0.8rem; background: var(--ui-bg); }
    iframe { border: 1px solid var(--ui-line); background: #fff; flex: 0 0 auto; }

    /* ---- the effect chips ------------------------------------------------- */
    .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--ui-line); }
    .chip {
      padding: 0.2rem 0.5rem; border: 1px solid var(--ui-line); border-radius: 99px;
      background: transparent; cursor: pointer; font-size: 12px;
    }
    .chip[aria-pressed="true"] { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    /* Ships-on is marked rather than merely defaulted, so "what the site looks
       like to a visitor" is legible at a glance once you have been dragging. */
    .chip[data-ships="1"]::after { content: " ·"; color: var(--ui-hit); }
    .chip[data-ships="1"][aria-pressed="true"]::after { color: var(--ui-bg); }

    /* ---- groups + rows ---------------------------------------------------- */
    .ghead {
      width: 100%; display: flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.7rem; border: 0; border-top: 1px solid var(--ui-line);
      border-radius: 0; background: transparent; text-align: left;
      font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut);
    }
    .ghead .mark { color: var(--ui-hit); }
    /* A group whose effect is off is shown and not hidden: the numbers are still
       the numbers, and hiding them would make the panel jump every time a chip
       is pressed. Dimmed, because dragging one changes nothing you can see. */
    .group[data-live="0"] .rows { opacity: 0.4; }
    .row { display: grid; grid-template-columns: 8.5rem 1fr 4.2rem; gap: 0.4rem; align-items: center; padding: 0.15rem 0.7rem; }
    .row label { color: var(--ui-mut); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.moved label { color: var(--ui-hit); }
    .row input[type="range"] { width: 100%; }
    .row .val { width: 100%; padding: 0.1rem 0.2rem; font-size: 11.5px; text-align: right; }
    .row select { width: 100%; grid-column: 2 / 4; padding: 0.1rem 0.2rem; font-size: 11.5px; }
    .row .theme-note { grid-column: 1 / 4; font-size: 10.5px; color: var(--ui-mut); padding-left: 0.1rem; }

    .out { flex: 0 0 auto; border-top: 1px solid var(--ui-line); }
    .out textarea { width: 100%; height: 11rem; border: 0; border-radius: 0; padding: 0.5rem 0.7rem; resize: vertical; font: 11.5px/1.5 ui-monospace, Consolas, monospace; }
    .warn { margin: 0; padding: 0.45rem 0.7rem; background: rgba(216, 167, 106, 0.16); font-size: 11.5px; }
    .warn:empty { display: none; }
  </style>
</head>
<body>
  <div class="top">
    <strong>Effects</strong>
    <button id="theme" type="button">theme: light</button>
    <label style="color:var(--ui-mut)">frame
      <input id="fw" type="number" value="1440" min="320" max="3840" step="10" style="width:5rem;padding:.15rem .3rem">
      x
      <input id="fh" type="number" value="900" min="320" max="2400" step="10" style="width:5rem;padding:.15rem .3rem">
    </label>
    <button id="fit" type="button">fit</button>
    <span class="grow"></span>
    <span class="badge" id="count" data-n="0">0</span>
    <button id="reset" type="button">reset</button>
    <button id="copy" type="button">copy CSS</button>
  </div>
  <p class="warn" id="warn"></p>
  <div class="wrap">
    <div class="side">
      <div class="chips" id="chips"></div>
      <div class="controls" id="controls"></div>
      <div class="out"><textarea id="export" spellcheck="false" aria-label="CSS export"></textarea></div>
    </div>
    <div class="stage"><iframe id="frame" src="/portfolio/" title="/portfolio"></iframe></div>
  </div>

<script>
(function () {
  "use strict";

  /* ---- the control table --------------------------------------------------
     One entry per custom property the stack exposes, grouped by the effect
     token that makes it do anything. `theme: true` marks the eight that
     styles.css declares once per theme.

     `unit` is what gets written back into the property, and it has to match what
     the sheet declares, not merely parse: `--fx-ascii-cell` is read by
     effects.js through a measured probe and would take a unitless number as
     invalid, while `--fx-film-lift` is a filter argument and must NOT have one. */
  var GROUPS = [
    { token: null, name: "band", rows: [
      { prop: "--fx-y",    label: "foot, up from fold", min: -600, max: 600, step: 1, unit: "px" },
      { prop: "--fx-fade", label: "dissolve at foot",   min: 0, max: 0.6, step: 0.01 }
    ]},
    { token: "film", name: "film — 185XL, one frame", rows: [
      { prop: "--fx-film-strength", label: "strength", min: 0, max: 1, step: 0.01, theme: true },
      { prop: "--fx-film-blend",    label: "blend",    options: BLENDS(), theme: true },
      { prop: "--fx-film-lift",     label: "lift (field)", min: 0, max: 3, step: 0.01, theme: true },
      { prop: "--fx-film-contrast", label: "contrast (bite)", min: 0, max: 8, step: 0.05, theme: true },
      { prop: "--fx-film-invert",   label: "invert", min: 0, max: 1, step: 1, theme: true },
      { prop: "--fx-film-zoom",     label: "zoom", min: 1, max: 2.5, step: 0.01 }
    ]},
    { token: "paper", name: "paper — 349XL, tiled", rows: [
      { prop: "--fx-paper-strength", label: "strength", min: 0, max: 1, step: 0.01, theme: true },
      { prop: "--fx-paper-blend",    label: "blend",    options: BLENDS(), theme: true },
      { prop: "--fx-paper-lift",     label: "lift (field)", min: 0, max: 3, step: 0.01, theme: true },
      { prop: "--fx-paper-contrast", label: "contrast (bite)", min: 0, max: 8, step: 0.05, theme: true },
      { prop: "--fx-paper-invert",   label: "invert", min: 0, max: 1, step: 1 },
      { prop: "--fx-paper-size",     label: "tile size", min: 48, max: 1024, step: 4, unit: "px" }
    ]},
    { token: "chroma", name: "chromatic aberration", rows: [
      { prop: "--fx-chroma-x",     label: "split x", min: -4, max: 4, step: 0.05, unit: "px" },
      { prop: "--fx-chroma-y",     label: "split y", min: -4, max: 4, step: 0.05, unit: "px" },
      { prop: "--fx-chroma-alpha", label: "fringe alpha", min: 0, max: 1, step: 0.01 }
    ]},
    { token: "grain", name: "grain", rows: [
      { prop: "--fx-grain-opacity", label: "opacity", min: 0, max: 0.4, step: 0.005 },
      { prop: "--fx-grain-size",    label: "tile size", min: 40, max: 600, step: 4, unit: "px" },
      { prop: "--fx-grain-fps",     label: "frames/sec", min: 2, max: 30, step: 1 }
    ]},
    { token: "halftone", name: "halftone", rows: [
      { prop: "--fx-halftone-pitch",   label: "pitch", min: 1.5, max: 14, step: 0.1, unit: "px" },
      { prop: "--fx-halftone-dot",     label: "dot size", min: 0.05, max: 0.5, step: 0.01 },
      { prop: "--fx-halftone-angle",   label: "screen angle", min: 0, max: 90, step: 1, unit: "deg" },
      { prop: "--fx-halftone-opacity", label: "opacity", min: 0, max: 1, step: 0.01 },
      { prop: "--fx-halftone-blend",   label: "blend", options: BLENDS() }
    ]},
    { token: "vignette", name: "vignette", rows: [
      { prop: "--fx-vignette-start",    label: "starts at", min: 10, max: 95, step: 1, unit: "%" },
      { prop: "--fx-vignette-strength", label: "strength", min: 0, max: 1, step: 0.01 }
    ]},
    { token: "halation", name: "halation", rows: [
      { prop: "--fx-halation-radius", label: "radius", min: 0, max: 24, step: 0.5, unit: "px" },
      { prop: "--fx-halation-alpha",  label: "alpha", min: 0, max: 1, step: 0.01 }
    ]},
    { token: "ascii", name: "ascii — the three pictures", rows: [
      { prop: "--fx-ascii-cell",     label: "cell", min: 3, max: 24, step: 0.5, unit: "px" },
      { prop: "--fx-ascii-contrast", label: "contrast", min: 0.2, max: 4, step: 0.05 },
      { prop: "--fx-ascii-opacity",  label: "opacity", min: 0, max: 1, step: 0.01 },
      { prop: "--fx-ascii-invert",   label: "invert", min: 0, max: 1, step: 1 }
    ]},
    { token: "crt", name: "crt monitor", rows: [
      { prop: "--fx-scan-pitch",   label: "scanline pitch", min: 1, max: 12, step: 0.5, unit: "px" },
      { prop: "--fx-scan-alpha",   label: "scanline alpha", min: 0, max: 1, step: 0.01 },
      { prop: "--fx-grille-pitch", label: "grille pitch", min: 1, max: 12, step: 0.5, unit: "px" },
      { prop: "--fx-grille-alpha", label: "grille alpha", min: 0, max: 1, step: 0.01 },
      { prop: "--fx-tube-curve",   label: "tube corner", min: 0, max: 6, step: 0.05, unit: "rem" },
      { prop: "--fx-tube-alpha",   label: "tube falloff", min: 0, max: 1, step: 0.01 },
      { prop: "--fx-flicker",      label: "flicker", min: 0, max: 0.3, step: 0.005 },
      { prop: "--fx-roll-height",  label: "roll bar height", min: 2, max: 60, step: 1, unit: "%" },
      { prop: "--fx-roll-alpha",   label: "roll bar alpha", min: 0, max: 0.4, step: 0.005 },
      { prop: "--fx-roll-period",  label: "roll period", min: 1, max: 30, step: 0.5, unit: "s" }
    ]},
    { token: "weave", name: "gate weave", rows: [
      { prop: "--fx-weave-amount", label: "travel", min: 0, max: 20, step: 0.5, unit: "px" },
      { prop: "--fx-weave-period", label: "period", min: 0.1, max: 4, step: 0.05, unit: "s" }
    ]}
  ];

  function BLENDS() {
    return ["normal", "multiply", "screen", "overlay", "soft-light", "hard-light",
            "darken", "lighten", "color-burn", "color-dodge", "difference",
            "exclusion", "luminosity"];
  }

  /* chroma-pictures has no numbers of its own — it is a second decision about
     the same split — so it is a chip with no group, and this is where that is
     written down rather than being an omission in GROUPS. */
  var CHIP_ONLY = ["chroma-pictures"];

  var STORE = "portfolio-effects-tuner";

  var frame = document.getElementById("frame");
  var chipsEl = document.getElementById("chips");
  var controlsEl = document.getElementById("controls");
  var exportEl = document.getElementById("export");
  var countEl = document.getElementById("count");
  var warnEl = document.getElementById("warn");
  var themeBtn = document.getElementById("theme");
  var fwEl = document.getElementById("fw");
  var fhEl = document.getElementById("fh");

  var doc = null, win = null, api = null;
  var theme = "light";
  /* Defaults as the sheet declares them, per theme. Probed once per load. */
  var base = { light: {}, dark: {} };
  /* What has been moved away from those. Rows marked `theme` live under their
     theme's key; everything else under `any`, which is applied in both. */
  var state = { light: {}, dark: {}, any: {}, fx: null };
  var rowEls = {};

  function allRows() {
    var out = [];
    GROUPS.forEach(function (g) { g.rows.forEach(function (r) { out.push(r); }); });
    return out;
  }
  function bucket(row) { return row.theme ? state[theme] : state.any; }
  function defaultOf(row) { return base[row.theme ? theme : "light"][row.prop]; }

  /* ---- boot ------------------------------------------------------------- */

  frame.addEventListener("load", function () {
    doc = frame.contentDocument;
    win = frame.contentWindow;
    api = win.portfolioFx;
    if (!api) {
      warnEl.textContent = "portfolio/effects.js did not run in the frame — nothing here can drive it.";
      return;
    }
    theme = doc.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    probe();
    restore();
    build();
    applyAll();
  });

  /* Both themes' declared values, by flipping the frame's theme under itself and
     reading. Every inline override is cleared first, or a value the tuner set
     last session would be probed back in as though the sheet had declared it. */
  function probe() {
    var root = doc.documentElement;
    var was = root.getAttribute("data-theme");
    api.clearVars();
    ["light", "dark"].forEach(function (t) {
      root.setAttribute("data-theme", t);
      var cs = win.getComputedStyle(root);
      allRows().forEach(function (row) {
        base[t][row.prop] = cs.getPropertyValue(row.prop).trim();
      });
    });
    root.setAttribute("data-theme", was || "light");

    /* The one thing that can rot here. Every row is meant to be declared as a
       plain literal; if one is rewritten as a calc or a var, this is where it
       shows, before any number has been trusted. */
    var bad = allRows().filter(function (row) {
      var v = base.light[row.prop];
      if (!v) return true;
      if (row.options) return row.options.indexOf(v) < 0;
      return !isFinite(parseFloat(v));
    }).map(function (row) { return row.prop; });
    warnEl.textContent = bad.length
      ? "Not readable as plain literals in styles.css — this tuner cannot show " +
        "their defaults: " + bad.join(", ")
      : "";
  }

  function build() {
    /* chips */
    chipsEl.textContent = "";
    api.effects.forEach(function (name) {
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = name;
      b.dataset.fx = name;
      b.dataset.ships = api.shipped.indexOf(name) >= 0 ? "1" : "0";
      b.title = api.shipped.indexOf(name) >= 0 ? "ships on" : "off by default";
      /* applyAll() and not just syncChips(): turning an effect on or off is a
         change like any other, and the count, the export and the dimming of the
         group all have to move with it. Doing the narrow thing here left the
         badge one behind for exactly as long as it took to press a chip. */
      b.addEventListener("click", function () {
        api.toggle(name);
        applyAll();
      });
      chipsEl.appendChild(b);
    });

    /* groups */
    controlsEl.textContent = "";
    GROUPS.forEach(function (g) {
      var wrap = document.createElement("div");
      wrap.className = "group";
      wrap.dataset.token = g.token || "";
      var head = document.createElement("div");
      head.className = "ghead";
      head.textContent = g.name;
      wrap.appendChild(head);
      var rows = document.createElement("div");
      rows.className = "rows";
      g.rows.forEach(function (row) { rows.appendChild(makeRow(row)); });
      wrap.appendChild(rows);
      controlsEl.appendChild(wrap);
    });
    syncChips();
  }

  function makeRow(row) {
    var el = document.createElement("div");
    el.className = "row";
    var lab = document.createElement("label");
    lab.textContent = row.label + (row.theme ? " *" : "");
    if (row.theme) lab.title = row.prop + " — held per theme";
    else lab.title = row.prop;
    el.appendChild(lab);

    if (row.options) {
      var sel = document.createElement("select");
      row.options.forEach(function (o) {
        var opt = document.createElement("option");
        opt.value = opt.textContent = o;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", function () { setRow(row, sel.value); });
      el.appendChild(sel);
      rowEls[row.prop] = { el: el, input: sel };
      return el;
    }

    var range = document.createElement("input");
    range.type = "range";
    range.min = row.min; range.max = row.max; range.step = row.step;
    var num = document.createElement("input");
    num.type = "number";
    num.className = "val";
    num.min = row.min; num.max = row.max; num.step = row.step;
    range.addEventListener("input", function () { setRow(row, range.value); });
    num.addEventListener("change", function () { setRow(row, num.value); });
    el.appendChild(range);
    el.appendChild(num);
    rowEls[row.prop] = { el: el, input: range, num: num };
    return el;
  }

  /* ---- applying ---------------------------------------------------------- */

  function value(row) {
    var b = bucket(row);
    return b[row.prop] !== undefined ? b[row.prop] : defaultOf(row);
  }

  function setRow(row, raw) {
    var v = row.options ? String(raw) : String(parseFloat(raw));
    var b = bucket(row);
    if (v === defaultOf(row) || (!row.options && parseFloat(v) === parseFloat(defaultOf(row)))) {
      delete b[row.prop];
    } else {
      b[row.prop] = v;
    }
    applyAll();
  }

  /* Everything, every time, from a clean slate. The stack is a dozen numbers, so
     the cost of rebuilding all of them on a drag is nothing against the cost of
     an incremental path that can disagree with the state it is meant to mirror —
     and the theme rows make an incremental path genuinely awkward, since
     switching theme has to UNSET whatever the other theme's inline value was. */
  function applyAll() {
    api.clearVars();
    allRows().forEach(function (row) {
      var b = bucket(row);
      if (b[row.prop] === undefined) return;
      api.set(row.prop, b[row.prop] + (row.unit || ""));
    });
    sync();
    save();
    writeExport();
  }

  function sync() {
    allRows().forEach(function (row) {
      var ui = rowEls[row.prop];
      if (!ui) return;
      var v = value(row);
      if (row.options) ui.input.value = v;
      else { ui.input.value = parseFloat(v); ui.num.value = parseFloat(v); }
      ui.el.classList.toggle("moved", bucket(row)[row.prop] !== undefined);
    });
    syncChips();
    countEl.textContent = changeCount();
    countEl.dataset.n = changeCount();
  }

  function syncChips() {
    if (!api) return;
    var live = api.list();
    Array.prototype.forEach.call(chipsEl.children, function (b) {
      b.setAttribute("aria-pressed", live.indexOf(b.dataset.fx) >= 0 ? "true" : "false");
    });
    Array.prototype.forEach.call(controlsEl.children, function (g) {
      var t = g.dataset.token;
      g.dataset.live = (!t || live.indexOf(t) >= 0) ? "1" : "0";
    });
  }

  function changeCount() {
    return Object.keys(state.any).length +
           Object.keys(state.light).length +
           Object.keys(state.dark).length +
           (fxChanged() ? 1 : 0);
  }
  function fxChanged() {
    if (!api) return false;
    return api.list().slice().sort().join(" ") !== api.shipped.slice().sort().join(" ");
  }

  /* ---- theme, frame ------------------------------------------------------ */

  themeBtn.addEventListener("click", function () {
    theme = theme === "light" ? "dark" : "light";
    themeBtn.textContent = "theme: " + theme;
    if (!doc) return;
    doc.documentElement.setAttribute("data-theme", theme);
    /* The frame's own boot script persists the theme, so a reload lands where
       you left it rather than back on light with dark numbers on the sliders. */
    try { win.localStorage.setItem("portfolio-theme", theme); } catch (_) {}
    applyAll();
  });

  function sizeFrame() {
    frame.style.width = (parseInt(fwEl.value, 10) || 1440) + "px";
    frame.style.height = (parseInt(fhEl.value, 10) || 900) + "px";
    save();
  }
  fwEl.addEventListener("change", sizeFrame);
  fhEl.addEventListener("change", sizeFrame);
  document.getElementById("fit").addEventListener("click", function () {
    var stage = document.querySelector(".stage");
    fwEl.value = Math.round(stage.clientWidth - 26);
    fhEl.value = Math.round(stage.clientHeight - 26);
    sizeFrame();
  });

  document.getElementById("reset").addEventListener("click", function () {
    state.light = {}; state.dark = {}; state.any = {};
    if (api) api.reset();
    applyAll();
  });
  document.getElementById("copy").addEventListener("click", function () {
    exportEl.select();
    try { navigator.clipboard.writeText(exportEl.value); } catch (_) { document.execCommand("copy"); }
  });

  /* ---- the export -------------------------------------------------------- */

  /* One exported declaration, with the shipped value noted after it. That note
     is the value the SHEET declares for the block this line is going into,
     which for the eight per-theme rows is not the same number in the two. */
  function decl(row, value, themeKey) {
    var text = "  " + row.prop + ": " + value + ";";
    var pad = Math.max(1, 42 - text.length);
    return text + new Array(pad + 1).join(" ") +
           "/* was " + base[row.theme ? themeKey : "light"][row.prop] + " */";
  }

  /* The non-theme rows go in the :root block only. A per-theme row that has been
     moved on one theme and not the other appears once, which is correct: the
     other theme still ships what it shipped. */
  function block(themeKey, sel) {
    var lines = [];
    allRows().forEach(function (row) {
      var b = row.theme ? state[themeKey] : (themeKey === "light" ? state.any : null);
      if (!b || b[row.prop] === undefined) return;
      lines.push(decl(row, b[row.prop] + (row.unit || ""), themeKey));
    });
    return lines.length ? sel + " {\n" + lines.join("\n") + "\n}\n" : "";
  }

  function writeExport() {
    if (!api) return;
    var out = "/* design/effects/effects-tuner.html — paste into portfolio/styles.css.\n" +
              "   Only what moved, with the shipped value alongside. The two blocks are\n" +
              "   the two halves of THE LEVELS STAGE; keep each in the right one. */\n\n";
    if (fxChanged()) {
      out += "<!-- portfolio/index.html -->\n" +
             '<html lang="en" data-fx="' + api.list().join(" ") + '">\n' +
             "     /* ships: " + api.shipped.join(" ") + " */\n\n";
    }
    var light = block("light", ":root");
    var dark = block("dark", ':root[data-theme="dark"]');
    out += light + (light && dark ? "\n" : "") + dark;
    if (!changeCount()) out += "/* nothing moved */\n";
    exportEl.value = out;
  }

  /* ---- persistence ------------------------------------------------------- */

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        state: { light: state.light, dark: state.dark, any: state.any },
        theme: theme, w: fwEl.value, h: fhEl.value
      }));
    } catch (_) {}
  }
  function restore() {
    var raw = null;
    try { raw = localStorage.getItem(STORE); } catch (_) {}
    if (raw) {
      try {
        var s = JSON.parse(raw);
        state.light = s.state.light || {};
        state.dark = s.state.dark || {};
        state.any = s.state.any || {};
        if (s.w) fwEl.value = s.w;
        if (s.h) fhEl.value = s.h;
      } catch (_) {}
    }
    theme = doc.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    themeBtn.textContent = "theme: " + theme;
    sizeFrame();
  }

  sizeFrame();
})();
</script>
</body>
</html>
