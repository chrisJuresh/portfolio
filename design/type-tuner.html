<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type tuner — /portfolio</title>
  <style>
    :root { color-scheme: light dark; --ui: #1a1917; --ui-bg: #fcfbf8; --ui-panel: #f5f2ea; --ui-line: #d6d0c4; --ui-mut: #6f6a5d; --ui-hit: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --ui: #eaeaea; --ui-bg: #161616; --ui-panel: #1e1e1e; --ui-line: #3a3a3a; --ui-mut: #9a9a9a; --ui-hit: #d8a76a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      background: var(--ui-bg); color: var(--ui);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    /* ---- top bar ---------------------------------------------------------- */
    .top {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ui-line);
    }
    .top strong { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .grow { flex: 1 1 auto; }
    button, input[type="text"], input[type="number"], textarea {
      font: inherit; color: var(--ui); background: transparent;
      border: 1px solid var(--ui-line); border-radius: 5px;
    }
    /* Fields carry a solid background, buttons don't. */
    input[type="text"], input[type="number"], textarea {
      background: var(--ui-bg);
      color-scheme: light dark;
    }
    button { padding: 0.24rem 0.55rem; cursor: pointer; }
    button:hover { border-color: var(--ui-mut); }
    button[aria-pressed="true"] { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    .badge { padding: 0.1rem 0.4rem; border-radius: 99px; background: var(--ui-hit); color: var(--ui-bg); font-size: 11px; }
    .badge[data-n="0"] { background: transparent; color: var(--ui-mut); }
    .dim { width: 3.9rem; padding: 0.18rem 0.25rem; text-align: right; }
    .times { color: var(--ui-mut); }

    /* ---- layout ----------------------------------------------------------- */
    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .side { flex: 0 0 22rem; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--ui-line); background: var(--ui-panel); }
    .controls { flex: 1 1 auto; overflow: auto; padding-bottom: 0.6rem; }

    /* ---- profile slots ---------------------------------------------------- */
    .pwrap { flex: 0 0 auto; padding: 0.5rem 0.7rem 0.55rem; border-bottom: 1px solid var(--ui-line); }
    .phead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem; margin-bottom: 0.35rem; }
    .phead strong { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .phead .hint { font-size: 10px; }
    .phead b { font-weight: 600; color: var(--ui); }
    .profiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.25rem; }
    .slot { display: flex; min-width: 0; }
    .slot button { padding: 0.22rem 0.1rem; font-size: 11px; }
    .slot .load { flex: 1 1 auto; min-width: 0; border-radius: 5px 0 0 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .slot .put  { flex: 0 0 auto; border-left: 0; border-radius: 0 5px 5px 0; padding: 0.22rem 0.28rem; color: var(--ui-mut); }
    .slot .put:hover { color: var(--ui-hit); }
    .slot.empty .load { color: var(--ui-mut); font-style: italic; }
    .slot.on .load { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    /* loaded, then edited since — no longer what the slot holds */
    .slot.on.dirty .load { background: transparent; color: var(--ui-hit); border-color: var(--ui-hit); }
    .slot.on.dirty .load::after { content: " •"; }
    .stage { flex: 1 1 auto; overflow: auto; padding: 0.8rem; }
    iframe { display: block; border: 1px solid var(--ui-line); background: #fff; }

    /* ---- groups + rows ---------------------------------------------------- */
    .ghead {
      width: 100%; display: flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.7rem; border: 0; border-top: 1px solid var(--ui-line);
      border-radius: 0; background: transparent; text-align: left;
      font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut);
    }
    .ghead::before { content: "\25be"; font-size: 10px; }
    .g.shut .ghead::before { content: "\25b8"; }
    .g.shut .gbody { display: none; }
    .gbody { padding: 0.15rem 0.7rem 0.5rem; }

    .row { display: grid; grid-template-columns: 7.6rem 1fr 3.5rem 1rem; align-items: center; gap: 0.3rem; min-height: 1.55rem; }
    .row > label { font-size: 11.5px; color: var(--ui-mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.on > label { color: var(--ui-hit); }
    .row.gone > label { opacity: 0.45; font-style: italic; }
    input[type="range"] { width: 100%; min-width: 0; accent-color: var(--ui-hit); }
    input[type="number"], input[type="text"] { width: 100%; padding: 0.08rem 0.2rem; font-size: 11.5px; }
    .undo { border: 0; padding: 0; width: 1rem; color: var(--ui-mut); visibility: hidden; line-height: 1; }
    .row.on .undo { visibility: visible; }
    .undo:hover { color: var(--ui-hit); }

    .frow { margin: 0.25rem 0; }
    .frow > label { display: block; font-size: 11.5px; color: var(--ui-mut); }
    .frow.on > label { color: var(--ui-hit); }
    .frow input[type="text"] { width: 100%; padding: 0.14rem 0.2rem; font-size: 11.5px; margin-top: 0.1rem; }
    /* Top-aligned, not centred: the list opens inside .pick and grows the row, and
       a centred ↺ would ride down the page with it. */
    .sel { display: flex; gap: 0.25rem; align-items: flex-start; }
    .sel .pick { flex: 1 1 auto; min-width: 0; }
    .sel .undo { margin-top: 0.3rem; }

    /* ---- font picker ------------------------------------------------------- */
    /* Not a <select>: its popup is drawn by the OS, which never reports which
       option the pointer is over, so trying a face would mean choosing it first.
       Here every entry previews the moment the pointer reaches it, and only a
       click is a change — the fastest way to sweep two dozen faces is to run the
       pointer down the list and watch the page.

       The list sits in the panel's own flow rather than floating over it:
       `.controls` scrolls, so an absolutely positioned popup would be clipped by
       it, and a fixed one would sit outside `controls`, where the delegated
       highlight and reveal handlers can't see it. */
    .pick { position: relative; }
    .pick .trigger {
      width: 100%; margin-top: 0.1rem; padding: 0.14rem 0.2rem;
      display: flex; align-items: center; gap: 0.3rem;
      font-size: 11.5px; text-align: left; background: var(--ui-bg);
    }
    .pick .trigger::after { content: "\25be"; margin-left: auto; font-size: 9px; color: var(--ui-mut); }
    .pick.open .trigger::after { content: "\25b4"; }
    .pick .now { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* A hover is not a choice, and the page can't say which it is showing — so the
       trigger says it, in the accent the panel already uses for "this has moved". */
    .pick.peek .now { color: var(--ui-hit); font-style: italic; }

    .menu {
      margin: 0.15rem 0 0.1rem; max-height: 14rem; overflow: auto;
      border: 1px solid var(--ui-line); border-radius: 5px; background: var(--ui-bg);
    }
    .menu[hidden] { display: none; }
    .opt { padding: 0.15rem 0.35rem; font-size: 11.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .opt.at { background: var(--ui-hit); color: var(--ui-bg); }
    .opt.cur::after { content: " \2713"; color: var(--ui-mut); }
    .opt.at.cur::after { color: var(--ui-bg); }

    .selnote, .hint { font-size: 10.5px; color: var(--ui-mut); }
    .selnote { font-family: ui-monospace, Consolas, monospace; }
    /* Set in the face it is reporting, so the absence is legible at a glance. */
    .selnote.absent { font-family: "Comic Sans MS", cursive; color: var(--ui-hit); }
    /* A word wider than its column loses its tail to the clip and looks like the
       cut working, so the note has to carry the accent the panel uses for
       "something here has moved". */
    .selnote.over { color: var(--ui-hit); }
    .warn { margin: 0; padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--ui-line); background: rgba(216, 167, 106, 0.16); font-size: 11.5px; }
    .warn:empty { display: none; }
    .warn code { font-family: ui-monospace, Consolas, monospace; }

    /* ---- export drawer ---------------------------------------------------- */
    .export { flex: 0 0 auto; border-top: 1px solid var(--ui-line); }
    .export > summary { padding: 0.4rem 0.7rem; cursor: pointer; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .ebody { padding: 0 0.7rem 0.6rem; }
    textarea { width: 100%; height: 11rem; padding: 0.4rem; resize: vertical; font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre; }
    .ebtns { display: flex; gap: 0.3rem; align-items: center; margin-top: 0.35rem; }
  </style>
</head>
<body>
  <div class="top">
    <strong>tuning</strong> <span>/portfolio</span>
    <span class="badge" id="count" data-n="0">0</span>
    <button id="undo" type="button" title="undo — Ctrl+Z">↶</button>
    <button id="redo" type="button" title="redo — Ctrl+Shift+Z or Ctrl+Y">↷</button>
    <span class="grow"></span>
    <strong>size</strong><span id="sizes"></span>
    <input type="number" id="fw" class="dim" min="320" max="3840" step="10" title="frame width">
    <span class="times">×</span>
    <input type="number" id="fh" class="dim" min="400" max="3000" step="10" title="frame height">
    <button id="whole" type="button" title="stretch the frame to the full page. Handy for spacing, but vh-based sizes — the photo strip, the page padding — will then answer to this tall frame instead of a real screen.">whole page</button>
    <button id="hilite" type="button" title="outline what a control governs while you hover or focus it">highlight</button>
    <button id="theme" type="button">theme</button>
    <button id="reload" type="button" title="reload the page inside the frame">reload</button>
  </div>

  <p class="warn" id="drift"></p>

  <div class="wrap">
    <aside class="side">
      <div class="pwrap">
        <div class="phead">
          <strong>profiles</strong>
          <span class="hint">click loads · <b>1</b>–<b>5</b> switches · ⤓ saves · dbl-click renames · alt-click clears</span>
        </div>
        <div class="profiles" id="profiles"></div>
      </div>

      <div class="controls" id="controls"></div>

      <details class="export" open>
        <summary>export — paste this to Claude</summary>
        <div class="ebody">
          <textarea id="out" spellcheck="false"></textarea>
          <div class="ebtns">
            <button id="copy" type="button">copy</button>
            <button id="import" type="button" title="paste an earlier export above, then click this">import</button>
            <button id="resetall" type="button">reset all</button>
            <span class="hint" id="status"></span>
          </div>
        </div>
      </details>
    </aside>

    <main class="stage"><iframe id="frame" title="portfolio preview"></iframe></main>
  </div>

<script>
/* =============================================================================
   Type tuner — live typographic controls over the REAL /portfolio page.

   Same idea as type-lab.html (iframe the real page, inject CSS, never clone the
   markup — the page builds its whole DOM from content.js at runtime), but for
   free-form tuning rather than flipping between pre-authored variants.

   The point of the tool is the export: every change comes back out as CSS using
   the same selectors and units as portfolio/styles.css, with the previous value
   in a trailing comment, so it can be pasted into a message and applied to the
   real file without anyone re-deriving what moved.

   DEFAULTS ARE DECLARED, NOT MEASURED, and that is deliberate. Computed style
   only ever reports pixels, so it cannot tell you whether the source said
   0.78rem, 12.48px or 0.052em — and the export is only useful if it speaks the
   file's own units. The cost is that this table can fall out of step with
   styles.css; ROWS below is therefore verified against the live computed values
   on every load, and any drift is reported in the banner rather than silently
   producing a wrong "was" comment. If the banner fires, fix the table.
   ========================================================================== */

/* ---- the type stacks on offer ------------------------------------------- */
/* Two lists, not one: STACKS for the text and DISPLAY for the cut title, which
   ask different questions and share nothing but the machinery. See DISPLAY.

   Two kinds of entry in each.

   The ones marked "(ships)" are the stacks portfolio/styles.css declares today,
   character for character — they are the defaults every font row starts at, so
   they have to stay exact or the export's "was" comment lies.

   Everything else is a candidate: one face to look at, with no serif safety net
   under it. A candidate that this browser cannot render falls to COMIC instead,
   which is the whole point — a missing face resolving quietly to Georgia looks
   like a decision rather than an absence, so Comic Sans is the answer "not this
   one" and the row says so in words beside it.

   That tail is a tuner-only device. buildCSS strips it back to `serif` on the
   way into the export, so no amount of pasting can land it in styles.css; only
   the copy injected into the preview frame carries it.

   Three sources make a candidate resolvable. /fonts holds what this repo serves:
   Vollkorn, Spectral and Source Serif 4, which portfolio/styles.css declares
   itself and so brings into the frame unasked, plus the Latin Modern cuts from
   /fonts/fonts.css. The eight remaining reading faces come from GFONT and the
   twenty-six display faces from DFONT, both fetched into the preview frame only.
   All of it is injected by the frame's load handler. Everything left — Georgia
   Pro, Constantia, Cambria, Sitka's six cuts, Didot, Bodoni MT, the Office
   faces — is a system face, there or not there, and Comic Sans is still how you
   find out which.

   The three self-hosted serifs are deliberately NOT in GFONT. Google would serve
   the whole families; /fonts serves subsets — Source Serif 4 pinned at opsz 14.4,
   onum kept on every face, and only the cuts styles.css asks for. Borrowing them
   would make the preview quietly better than the deployed site, which is the one
   thing this tool must not do. The flip side is honest too: put Spectral on
   --serif-body and `.listing > h2` renders a synthesised bold, because a Spectral
   700 is exactly what /fonts does not ship.

   A face out of GFONT or DFONT renders here and would not render on the deployed
   site: nothing in portfolio/ hosts it. Picking one is a decision to go and host
   it, and the export says as much at the top when a font row names one. */
var COMIC = '"Comic Sans MS", cursive';

/* Sorted by family, 400/700 upright and italic each — the weights and the one
   italic (.intro .lead) the page actually asks for. Faustina has no `opsz` axis
   and Domine no italic; getting either wrong makes the API drop that family from
   the response with a 200 and no other complaint, which reads exactly like the
   face not being installed.

   Vollkorn, Spectral and Source Serif 4 were in this list and have been taken
   out: /fonts serves all three now, and the frame is to use those copies. See
   SELF below. */
var GFONT = "https://fonts.googleapis.com/css2" +
  "?family=Bitter:ital,wght@0,400;0,700;1,400;1,700" +
  "&family=Castoro:ital@0;1" +
  "&family=Domine:wght@400;700" +
  "&family=Faustina:ital,wght@0,400;0,700;1,400;1,700" +
  "&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400;1,7..72,700" +
  "&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700" +
  "&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400;1,6..72,700" +
  "&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700" +
  "&display=swap";

/* The cut title's own request, separate from GFONT for two reasons.

   It asks for less. The word is one weight, upright, at one size, so most of
   these families are named bare — which returns that family's default cut and
   nothing else. Where the family is variable on `wght` the range is asked for
   instead, because the weight row in that group slides through it and a variable
   range is one file rather than six.

   And it asks with more care. The API answers an axis it does not recognise with
   a 200 and the family quietly missing from the sheet, which arrives here looking
   exactly like a face nobody has installed — so a family whose axes aren't known
   for certain is named bare rather than guessed at. Every entry below was checked
   against the live response; if one of them starts reading as Comic Sans on a
   machine that plainly has the others, suspect the axis spec before the machine. */
var DFONT = "https://fonts.googleapis.com/css2" +
  "?family=Abril+Fatface" +
  "&family=Antic+Didone" +
  "&family=Anton" +
  "&family=Bodoni+Moda:opsz,wght@6..96,400..900" +
  "&family=Cinzel:wght@400..900" +
  "&family=Cinzel+Decorative:wght@400;700;900" +
  "&family=Cormorant:wght@300..700" +
  "&family=Cormorant+Garamond:wght@300..700" +
  "&family=DM+Serif+Display" +
  "&family=EB+Garamond:wght@400..800" +
  "&family=Forum" +
  "&family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1" +
  "&family=Gilda+Display" +
  "&family=Instrument+Serif" +
  "&family=Italiana" +
  "&family=Libre+Bodoni:wght@400..700" +
  "&family=Marcellus" +
  "&family=Marcellus+SC" +
  "&family=Old+Standard+TT:wght@400;700" +
  "&family=Playfair+Display:wght@400..900" +
  "&family=Playfair+Display+SC" +
  "&family=Prata" +
  "&family=Rufina:wght@400;700" +
  "&family=Space+Grotesk:wght@300..700" +
  "&family=Yeseva+One" +
  "&family=Young+Serif" +
  "&display=swap";

/* What those two requests cover, as the browser will name it. Used twice: to pull
   each face down before the resolved-face probe measures it, and to flag an
   export that depends on one. */
var HOSTED = ["Bitter", "Castoro", "Domine", "Faustina", "Literata", "Merriweather",
              "Newsreader", "PT Serif"];

var DHOSTED = ["Abril Fatface", "Antic Didone", "Anton", "Bodoni Moda", "Cinzel",
               "Cinzel Decorative", "Cormorant", "Cormorant Garamond", "DM Serif Display",
               "EB Garamond", "Forum", "Fraunces", "Gilda Display", "Instrument Serif",
               "Italiana", "Libre Bodoni", "Marcellus", "Marcellus SC", "Old Standard TT",
               "Playfair Display", "Playfair Display SC", "Prata", "Rufina", "Space Grotesk",
               "Yeseva One", "Young Serif"];

var GOOGLE = HOSTED.concat(DHOSTED);

/* The faces /fonts serves, which the export must NOT flag as borrowed: picking
   one of these is picking something already hosted. Two sources behind them —
   the three serifs come with the portfolio page's own stylesheet, the Latin
   Modern cuts and Friz Quadrata from /fonts/fonts.css — but the frame ends up
   with all eight and the distinction stops mattering here. They are preloaded
   for the same reason GOOGLE is: see loadFace. */
var SELF = ["Vollkorn", "Spectral", "Source Serif 4",
            "Latin Modern Roman", "LM Roman 8", "LM Roman 9", "LM Roman 12",
            "Friz Quadrata Std"];

var STACKS = [
  ["Vollkorn (body, ships)",        'Vollkorn, "Sitka Text", Charter, "Iowan Old Style", Georgia, serif'],
  ["Spectral (labels, ships)",      'Spectral, "Sitka Text", Charter, "Iowan Old Style", Georgia, serif'],
  ["Source Serif 4 (years, ships)", '"Source Serif 4", Georgia, "Iowan Old Style", "Palatino Linotype", serif'],
  ["Georgia (lead, ships)",         'Georgia, "Iowan Old Style", "Palatino Linotype", serif'],

  /* the survey, in the order it was asked for */
  ["Source Serif 4",     '"Source Serif 4", "Source Serif Pro", ' + COMIC],
  ["Literata",           'Literata, ' + COMIC],
  ["Georgia Pro",        '"Georgia Pro", ' + COMIC],
  ["Newsreader",         'Newsreader, ' + COMIC],
  ["Charter",            'Charter, "Bitstream Charter", XCharter, ' + COMIC],
  ["PT Serif",           '"PT Serif", ' + COMIC],
  ["Castoro",            'Castoro, ' + COMIC],
  ["Merriweather",       'Merriweather, ' + COMIC],
  ["Constantia",         'Constantia, ' + COMIC],
  ["Faustina",           'Faustina, ' + COMIC],
  ["Domine",             'Domine, ' + COMIC],
  ["Spectral",           'Spectral, ' + COMIC],
  ["Vollkorn",           'Vollkorn, ' + COMIC],
  ["Bitter",             'Bitter, ' + COMIC],
  ["Cambria",            'Cambria, ' + COMIC],
  ["Sitka Text",         '"Sitka Text", ' + COMIC],

  ["Latin Modern 10",    '"Latin Modern Roman", ' + COMIC],
  ["Latin Modern 9",     '"LM Roman 9", ' + COMIC],
  ["Latin Modern 8",     '"LM Roman 8", ' + COMIC],
  ["Latin Modern 12",    '"LM Roman 12", ' + COMIC],
  ["Palatino",           '"Palatino Linotype", Palatino, "Book Antiqua", ' + COMIC],
  ["Times",              '"Times New Roman", Times, ' + COMIC],

  ["generic serif",      'serif'],
  ["system sans",        'system-ui, "Segoe UI", Roboto, sans-serif']
];

/* The four shipped stacks, by the slot each one holds. Read off STACKS rather
   than written twice, so the picker entry and the row default cannot drift
   apart. The Sitka chain survives as the tail of BODY and LABEL — unreachable
   unless the webfont fails, and kept for exactly that case. */
var BODY  = STACKS[0][1];
var LABEL = STACKS[1][1];
var NUM   = STACKS[2][1];
var LEAD  = STACKS[3][1];

/* ---- the display list, for the cut title only ---------------------------- */
/* A separate survey, because the cut title is a separate problem. The stacks
   above are for reading at 15px down a 27rem column; this one is for a single
   word set the full width of that column and sliced off at 62% of its cap
   height, where the only things that matter are the shapes of eight capitals and
   how they behave when two thirds of each one is gone. A face can be excellent at
   one job and useless at the other, so the two lists share nothing but the Comic
   Sans tell and the `custom…` escape.

   Same rule as above: one face per entry, no safety net, and a stack that falls
   through to Comic Sans is a face this machine hasn't got. Bands rather than one
   long alphabet, because the choice being made here is which REGISTER the word
   belongs to; the faces inside a band are variations on one answer.

   The first entry is what styles.css declares today, character for character —
   the sheet wraps it across two lines, this is the same value on one. */
var FRIZ = '"Friz Quadrata", "Friz Quadrata Std", "ITC Friz Quadrata", "Sitka Banner", Constantia, Georgia, serif';

/* What styles.css declared BEFORE Friz, kept as a row because it is the state
   every --cue-* number would be reverted to if the face were abandoned, and
   because a tool that can only show the current answer cannot show it is an
   answer. Reverting means this stack AND --cue-size 25.32, --cue-track -0.012,
   --cue-cap 4.187rem together — the three are one decision, not three knobs. */
var OGG = '"Ogg Roman", "Ogg", Didot, "Bodoni MT", "Big Caslon", "Sitka Banner", Constantia, Georgia, serif';

var DISPLAY = [
  ["Friz → Sitka Banner (ships)", FRIZ],
  ["Ogg → Sitka Banner (was)",    OGG],

  /* The two retail faces, asked for on their own rather than at the head of a
     fallback chain — which is the only way to find out whether this machine has
     one. The shipped entry above cannot answer that question: it resolves to
     Sitka Banner either way and looks deliberate doing it, so Ogg being absent
     and Ogg being present are indistinguishable from the page. Alone, with the
     Comic Sans tell under it, the row says which.
     Neither can be committed to this repo — Ogg is Sharp Type, Editorial New is
     Pangram Pangram, both licensed per-use. Choosing one means buying a webfont
     licence and self-hosting the woff2 into /fonts; styles.css already carries the
     commented @font-face block for Ogg, waiting for the file. Until then these
     render for whoever has the desktop font installed and for nobody else. */
  ["Ogg (Sharp Type)",     '"Ogg Roman", "Ogg", ' + COMIC],
  ["Editorial New (PP)",   '"PP Editorial New", "Editorial New", ' + COMIC],

  /* Didones and high-contrast display: the register Ogg belongs to. Hairline
     serifs and a vertical axis, which is exactly what a cut rewards — the stems
     survive and the thin parts vanish into the cut rather than muddying it. */
  ["Bodoni Moda",          '"Bodoni Moda", ' + COMIC],
  ["Libre Bodoni",         '"Libre Bodoni", ' + COMIC],
  ["Bodoni MT",            '"Bodoni MT", ' + COMIC],
  ["Bodoni MT Black",      '"Bodoni MT Black", ' + COMIC],
  ["Bodoni MT Condensed",  '"Bodoni MT Condensed", ' + COMIC],
  ["Modern No. 20",        '"Modern No. 20", ' + COMIC],
  ["Didot",                'Didot, ' + COMIC],
  ["Antic Didone",         '"Antic Didone", ' + COMIC],
  ["Playfair Display",     '"Playfair Display", ' + COMIC],
  ["Playfair Display SC",  '"Playfair Display SC", ' + COMIC],
  ["Prata",                'Prata, ' + COMIC],
  ["Rufina",               'Rufina, ' + COMIC],
  ["DM Serif Display",     '"DM Serif Display", ' + COMIC],
  ["Instrument Serif",     '"Instrument Serif", ' + COMIC],

  /* Inscriptional and titling faces — drawn as capitals first, with the lower
     case an afterthought. The one band designed for precisely this job. */
  ["Cinzel",               'Cinzel, ' + COMIC],
  ["Cinzel Decorative",    '"Cinzel Decorative", ' + COMIC],
  ["Trajan Pro",           '"Trajan Pro", ' + COMIC],
  ["Marcellus",            'Marcellus, ' + COMIC],
  ["Marcellus SC",         '"Marcellus SC", ' + COMIC],
  ["Italiana",             'Italiana, ' + COMIC],
  ["Forum",                'Forum, ' + COMIC],
  ["Engravers MT",         '"Engravers MT", ' + COMIC],
  ["Perpetua Titling MT",  '"Perpetua Titling MT", ' + COMIC],
  ["Copperplate Gothic",   '"Copperplate Gothic Light", ' + COMIC],
  ["Friz Quadrata",        '"Friz Quadrata", "Friz Quadrata Std", "ITC Friz Quadrata", ' + COMIC],

  /* Old-style and transitional, set large. Quieter than a Didone and warmer;
     the axis is inclined and the serifs keep their weight through the cut. */
  ["EB Garamond",          '"EB Garamond", ' + COMIC],
  ["Cormorant",            'Cormorant, ' + COMIC],
  ["Cormorant Garamond",   '"Cormorant Garamond", ' + COMIC],
  ["Garamond",             'Garamond, ' + COMIC],
  ["Goudy Old Style",      '"Goudy Old Style", ' + COMIC],
  ["Centaur",              'Centaur, ' + COMIC],
  ["Perpetua",             'Perpetua, ' + COMIC],
  ["Baskerville",          'Baskerville, ' + COMIC],
  ["Baskerville Old Face", '"Baskerville Old Face", ' + COMIC],
  ["Big Caslon",           '"Big Caslon", ' + COMIC],

  ["Abril Fatface",        '"Abril Fatface", ' + COMIC],

  /* Sans, for the one question no serif band can answer: whether the word at the
     foot of the page should be a serif at all. Anton is the poster face — one
     weight, condensed, nothing but ink, and a cut through it is pure stem. Space

  /* Sitka's own optical cuts. Banner is the one the shipped stack lands on for
     every Windows reader, so this is the band that says what most people

  ["Sitka Banner",         '"Sitka Banner", ' + COMIC],

  ["Sitka Subheading",     '"Sitka Subheading", ' + COMIC],

  /* Already on the page somewhere, so nothing new to host. The last question

  ["Constantia",           'Constantia, ' + COMIC],
  ["Cambria",              'Cambria, ' + COMIC],
  ["Georgia Pro",          '"Georgia Pro", ' + COMIC],
  ["Georgia",              'Georgia, ' + COMIC],
  ["Palatino",             '"Palatino Linotype", Palatino, "Book Antiqua", ' + COMIC],

/* ---- what styles.css says today ----------------------------------------- */
/* def: the value as WRITTEN in portfolio/styles.css, in `unit`.
   def:null means the property isn't declared there at all — the row starts at
   whatever the page computes and only enters the export once you move it.
   note: how the property is spelled in the source, where that differs from the
   single declaration this tool emits (shorthands), so it can be applied by hand.

   Every vertical gap below is now a rung of the φ ladder — --space-4xs through
   --space-l on :root — rather than a hand-set literal, so its `def` is the rung's
   value and its `note` names the rung. Worth knowing before pasting an export
   back: the tuner emits a literal, so applying a spacing row as-is takes that gap
   OFF the ladder. Either round the new value to the nearest rung and keep the
   var, or move the rung itself and accept that everything else on it moves too. */
var GROUPS = [
  { name: "Page", rows: [
    { sel: "body",  prop: "font-size",   unit: "px",  def: 15,   min: 11, max: 22, step: 0.25, label: "base size",   hi: ".col" },
    { sel: "body",  prop: "line-height", unit: "",    def: 1.55,                    label: "base leading",           hi: ".col" },
    { sel: ":root", prop: "--col",       unit: "rem", def: 27,   min: 16, max: 44, step: 0.25, label: "column width", hi: ".col" },

    /* The one row here that moves the CV rather than setting it: the whole block
       off the page's centre line. Outline and no tint, like the edge fade — a
       wash of orange over the entire column hides everything being judged. */
    { sel: ".col",  prop: "translate",   unit: "rem", def: null, min: -14, max: 14, step: 0.05,
      label: "shift right", hi: ".col", hiLine: true,
      note: "not declared today — the column is centred by `margin: 0 auto auto`",
      tip: "The whole resume block, off centre: masthead, intro, photo strip, work, education, contact and the toggle all move together, because all of them are .col. Negative moves it left.\n`translate` rather than a margin, deliberately. The layout box stays where it was and only the paint moves, so nothing re-wraps at any offset and the strip's full-bleed and its edge fade travel with the text instead of being re-derived against a new centre — which is what a margin would ask for.\nWhat does NOT move: the cut title (it is .page's own child, not .col's, so PROJECTS stays on the page's own axis) and the two corner pictures, which are painted on body. That is the point of the row — it is for judging the block against the plate and the car — and it is also what a shift takes out of alignment, so watch the title's left edge as well as the column's.\nOn a narrow window there is nothing to shift into: at 27rem the gutter is down to 1.35rem on a phone, and html and body clip overflow-x, so the text simply leaves the screen. Judge this at a real desktop size." }
  ] },

  /* hi: a custom property governs whatever reads it, so these point at the text
     that actually changes rather than at :root, which is the whole page. */
  { name: "Fonts", font: true, rows: [
    { sel: ":root", prop: "--serif-body",  def: BODY,  label: "body — roles, headings, contact", hi: ".listing > h2, .item .line, .item .sub, .contact li" },
    { sel: ":root", prop: "--serif-label", def: LABEL, label: "labels — name, tagline, toggle",   hi: ".name, .tagline, .projects-link, .theme-toggle" },
    { sel: ":root", prop: "--serif-num",   def: NUM,   label: "years — old-style figures", hi: ".item .when" },
    { sel: ":root", prop: "--serif-lead",  def: LEAD,  label: "lead — the italic line", hi: ".intro .lead" }
  ] },

  { name: "Masthead", rows: [
    { sel: ".name",          prop: "font-size",      unit: "rem", def: 0.78, label: "name size" },
    { sel: ".name",          prop: "letter-spacing", unit: "em",  def: 0.06, label: "name tracking" },
    { sel: ".name",          prop: "font-weight",    unit: "",    def: 400, min: 300, max: 700, step: 100, label: "name weight" },
    { sel: ".tagline",       prop: "font-size",      unit: "rem", def: 0.7,  label: "tagline size" },
    { sel: ".tagline",       prop: "letter-spacing", unit: "em",  def: 0.04, label: "tagline tracking" },
    { sel: ".projects-link", prop: "font-size",      unit: "rem", def: 0.7,  label: "link size" },
    { sel: ".projects-link", prop: "letter-spacing", unit: "em",  def: 0.04, label: "link tracking" },
    { sel: ".masthead-meta", prop: "margin-top",     unit: "rem", def: 0.382, label: "gap above meta", note: "written as `var(--space-2xs)`" },
    { sel: ".masthead",      prop: "margin-bottom",  unit: "rem", def: 1.618, label: "space below",    note: "written as `var(--space-m)`" }
  ] },

  { name: "Intro", rows: [
    { sel: ".intro .lead", prop: "font-size",   unit: "rem", def: 0.95, label: "lead size" },
    { sel: ".intro .lead", prop: "line-height", unit: "",    def: 1.5,  label: "lead leading" },
    { sel: ".intro p + p", prop: "font-size",   unit: "rem", def: 0.9,  label: "body size" },
    { sel: ".intro p + p", prop: "margin-top",  unit: "rem", def: 1,    label: "para spacing", note: "written as `margin: var(--space-s) 0 0`" },
    { sel: ".intro p + p", prop: "text-indent", unit: "rem", def: 1.1,  label: "first-line indent" },
    { sel: ".intro",       prop: "margin-bottom", unit: "rem", def: 1.618, label: "space below", note: "written as `var(--space-m)`" }
  ] },

  { name: "Photographs", rows: [
    { sel: ".carousel", prop: "margin-bottom", unit: "rem", def: 0.618, label: "strip → scrollbar", note: "`var(--space-xs)`, as a second `margin-bottom` after the full-bleed shorthand" },
    { sel: ".cbar",     prop: "margin-bottom", unit: "rem", def: 1.618, label: "scrollbar → text", note: "written as `margin: 0 0 var(--space-m)`" }
  ] },

  /* The edge dissolve. Unitless numbers on :root that styles.css assembles into
     the gradient — so what the tuner writes is what the sheet declares, no stop
     list to re-derive. `hi` points at the strip rather than at .veil: the
     highlight paints a background, which on the veil itself would hide the very
     thing being tuned.
     It is two settings, not one. These four are the fade AT REST, with the first
     photograph still sitting at the text edge; the four below are what it has
     become one photograph along, and the page eases between them as the strip
     moves. Neither group can be judged from the other's position — at rest the
     open numbers carry no weight at all, and vice versa — so each declares the
     `strip` it needs and grabbing a slider takes the frame there. */
  { name: "Edge fade — at rest", strip: 0, rows: [
    { sel: ":root", prop: "--fade-x",    unit: "", def: -0.5, min: -1.5, max: 1.5, step: 0.01, label: "start", hi: ".carousel", hiLine: true,
      tip: "Where the fade begins, in photo-widths from the text edge.\n0 = exactly where the column of text ends.\nNegative pulls it left over the photographs, positive pushes it out into the gutter." },
    { sel: ":root", prop: "--fade-span", unit: "", def: 0.51, min: 0.02, max: 2,   step: 0.01, label: "distance", hi: ".carousel", hiLine: true,
      tip: "How far it travels before the paper is solid, in photo-widths.\n1 = a whole photograph." },
    { sel: ":root", prop: "--fade-max",  unit: "", def: 1,    min: 0,    max: 1,   step: 0.01, label: "intensity", hi: ".carousel", hiLine: true,
      tip: "How opaque the paper gets at the far end.\nBelow 1 the photographs never quite disappear." },
    { sel: ":root", prop: "--fade-ease", unit: "", def: 0,    min: -1,   max: 1,   step: 0.01, label: "curve", hi: ".carousel", hiLine: true,
      tip: "Shape of the ramp, via the gradient's two interpolation hints.\n0 = a straight line.\n1 = eased at both ends (flat, then steep, then flat) — a smoothstep.\nNegative inverts it: steepest at the start, so the fade announces itself the moment it leaves the text edge." }
  ] },

  /* The far end of that travel: the same four numbers, as the fade should stand
     with the strip one photograph along and three photographs in view. Reached
     by the time the second one has come to rest in the centre of the screen. */
  { name: "Edge fade — three in view", strip: 1, rows: [
    { sel: ":root", prop: "--fade-x-open",    unit: "", def: 0,    min: -1.5, max: 1.5, step: 0.01, label: "start", hi: ".carousel", hiLine: true,
      tip: "Where the fade begins once the strip has moved, in photo-widths from the text edge.\n0 = exactly where the column of text ends." },
    { sel: ":root", prop: "--fade-span-open", unit: "", def: 0.5,  min: 0.02, max: 2,   step: 0.01, label: "distance", hi: ".carousel", hiLine: true,
      tip: "How far it travels before the paper is solid, in photo-widths.\n1 = a whole photograph." },
    { sel: ":root", prop: "--fade-max-open",  unit: "", def: 1,    min: 0,    max: 1,   step: 0.01, label: "intensity", hi: ".carousel", hiLine: true,
      tip: "How opaque the paper gets at the far end.\nBelow 1 the photographs never quite disappear." },
    { sel: ":root", prop: "--fade-ease-open", unit: "", def: 0,    min: -1,   max: 1,   step: 0.01, label: "curve", hi: ".carousel", hiLine: true,
      tip: "Shape of the ramp, via the gradient's two interpolation hints.\n0 = a straight line.\n1 = eased at both ends (flat, then steep, then flat) — a smoothstep.\nNegative inverts it: steepest at the start." }
  ] },

  { name: "Work & education", rows: [
    { sel: ".listing > h2", prop: "font-size",      unit: "rem", def: 0.85, label: "heading size" },
    { sel: ".listing > h2", prop: "font-weight",    unit: "",    def: 700, min: 300, max: 700, step: 100, label: "heading weight" },
    { sel: ".listing > h2", prop: "letter-spacing", unit: "em",  def: 0.01, label: "heading tracking" },
    { sel: ".listing > h2", prop: "margin-bottom",  unit: "rem", def: 0.236, label: "under heading", note: "written as `margin: 0 0 var(--space-3xs)`" },
    { sel: ".item .line",   prop: "font-size",      unit: "rem", def: 0.9,  label: "org size" },
    { sel: ".item .line",   prop: "gap",            unit: "rem", def: 1,    label: "org → year gap" },
    { sel: ".item .when",   prop: "font-size",      unit: "rem", def: null, label: "year size", note: "not declared today — the year inherits 0.9rem from `.item .line`" },
    { sel: ".item .when",   prop: "letter-spacing", unit: "em",  def: null, label: "year tracking" },
    { sel: ".item .sub",    prop: "font-size",      unit: "rem", def: 0.86, label: "role size" },
    { sel: ".item .sub",    prop: "margin-top",     unit: "rem", def: 0.146, label: "org → role", note: "written as `margin: var(--space-4xs) 0 0`" },
    { sel: ".item",         prop: "margin-bottom",  unit: "rem", def: 0.618, label: "between items", note: "written as `var(--space-xs)`" },
    { sel: ".listing",      prop: "margin-top",     unit: "rem", def: 1,     label: "between sections", note: "written as `var(--space-s)`" }
  ] },

  { name: "Contact & toggle", rows: [
    { sel: ".contact li",         prop: "font-size",     unit: "rem", def: 0.9,  label: "link size" },
    { sel: ".contact li",         prop: "margin-top",    unit: "rem", def: 0.236, label: "between links",   note: "written as `var(--space-3xs)`" },
    { sel: ".contact li.primary", prop: "margin-bottom", unit: "rem", def: 0.618, label: "under the email", note: "written as `var(--space-xs)`" },
    { sel: ".contact-corner",     prop: "column-gap",    unit: "rem", def: 1,    label: "links → toggle" },
    { sel: ".theme-toggle",       prop: "font-size",     unit: "rem", def: 0.9,  label: "toggle size",    note: "lives in the `font: 400 0.9rem/1.55 var(--serif-label)` shorthand" },
    { sel: ".theme-toggle",       prop: "line-height",   unit: "",    def: 1.55, label: "toggle leading", note: "lives in the same `font:` shorthand" }
  ] },

  /* ---- PROJECTS, the cut title -------------------------------------------
     One word in the bottom corner, set to the full width of the column and
     sliced off by the end of the page. It is the only display type on the site,
     the only place a second face is even arguable, and the only element whose
     whole job is the shape of eight capitals — so it gets the entire font model
     rather than a size and a tracking value. Every font property that can change
     those eight shapes is here, each one previewable by hovering it.

     Top to bottom: which face, how big, how much of it survives the cut, then
     everything the face itself can be asked to do.

     The first four live on :root as --cue-* rather than on the element, because
     styles.css assembles them into geometry the element cannot express on its own
     — see the --cue-* block there before moving one. The rest are declarations on
     `.cut-title > a` exactly as the sheet writes them.

     Deliberately absent: --cue-cap-drop, which styles.css says is not a knob but
     a measured Firefox fallback; --cue-gap, which is spacing rather than type; and
     font-variant-position, font-variant-emoji, font-palette and
     font-language-override, none of which can change an uppercase Latin word in a
     monochrome face. -webkit-font-smoothing is out for a different reason: the
     sheet already sets `antialiased` once on body for the whole page, and it is
     non-standard and does nothing outside macOS — a per-title override of it is not
     a typographic decision anyone should be making here.

     Every row highlights as an outline with no tint, like the edge fade: the
     visible slice is 62% of one capital, and a wash of orange behind it hides the
     thing being judged. */
  { name: "PROJECTS — the cut title", rows: [
    { sel: ":root", prop: "--serif-display", kind: "font", stacks: DISPLAY, def: FRIZ,
      label: "display face", hi: ".cut-title > a", hiLine: true,
      tip: "Its own list, not the body one: fifty-odd faces judged on eight capitals with two thirds of each one cut away, which is a different question from what reads well at 15px.\nFriz Quadrata is what the stylesheet names and what every number below is derived for. It is a commercial Adobe/ITC cut with no webfont licence, so it is NOT served: a reader without it installed gets the tail of the stack, which ends at Sitka Banner. This tool sees it because /fonts/fonts.css declares it locally." },

    { sel: ":root", prop: "--cue-size", unit: "cqw", def: 22.95, min: 6, max: 60, step: 0.01,
      label: "word size", hi: ".cut-title > a", hiLine: true,
      tip: "The word's size as a fraction of the column's own width, in cqw against .cut-title — one proportion at every window size instead of a size that suits one of them.\nIt is the one number in this group that is face-specific, and it is DERIVED, not eyeballed: 100 / (the advance of PROJECTS in em at the tracking below). Friz sets it in 4.1973em + 8 tracking steps = 4.3573em, so 100/4.3573 = 22.95 and the word's box is exactly the measure. The same arithmetic returns 25.33 for Sitka Banner at -0.012em. Re-derive it after any change of face or tracking; do not nudge it." },

    { sel: ":root", prop: "--cue-show", unit: "", def: 0.62, min: 0.2, max: 1.4, step: 0.01,
      label: "shown of the cap", hi: ".cut-title > a", hiLine: true,
      tip: "How much of the word survives the cut, as a fraction of its CAP HEIGHT — read as `1cap` from whichever face resolved, so the same fraction of letter shows in any face at any size.\n0.62 is set by the letters that die first, not by taste: R stops reading as P once its bowl has closed (~0.55 in a Didone, 0.49 in Georgia). Above ~0.75 it stops reading as cut and starts reading as a word with an odd baseline; below ~0.55 PROJECTS goes.\nThe J half of that rule is moot in Friz, whose J descends 0.349 cap below the baseline — outside the cap slab the clip box is, so cut, it is a bare stem at every value and the word reads PRO|ECTS. That is the face, not a number to tune." },

    { sel: ":root", prop: "--cue-track", unit: "em", def: 0.02, min: -0.08, max: 0.2, step: 0.001,
      label: "tracking", hi: ".cut-title > a", hiLine: true,
      tip: "Two forces pull opposite ways: display caps this large want the tracking drawn in, and a string of capitals wants it opened out. Which wins is a question about the face.\nPositive here because Friz's caps are fitted tight and its wedge arms overhang their own advance — T measures negative sidebearings on BOTH sides. Set solid, the ink gaps in the visible band run 0.011 cap at CT and 0.000 at TS, so the last two letters touch before any tracking at all. 0.02em puts the tightest pair at 0.030 cap, which is where -0.012em put Sitka's tightest pair: same optical tightness, measured on the pair that governs.\nWhat it cannot fix: the gaps are UNEVEN — EC opens to 0.216 cap against TS's 0.030 — and tracking is additive, so no single value evens them out." },

    { sel: ".cut-title > a", prop: "font-weight", unit: "", def: 400, min: 100, max: 900, step: 25,
      label: "weight", hi: ".cut-title > a", hiLine: true,
      tip: "Only the weights a face actually ships are real. The variable cuts in the list — Playfair Display, Bodoni Moda, Cinzel, Cormorant, EB Garamond, Fraunces — interpolate the whole range; everything else snaps to its nearest cut or gets a synthesised bold, which font-synthesis below can refuse." },

    { sel: ".cut-title > a", prop: "font-stretch", unit: "%", def: 100, min: 50, max: 200, step: 1,
      label: "width", hi: ".cut-title > a", hiLine: true,
      note: "not declared today — 100% is the initial value",
      tip: "Does nothing unless the face carries a `wdth` axis. None of these do, which is why Bodoni MT Condensed is in the list as the honest way to get a narrower word." },

    { sel: ".cut-title > a", prop: "line-height", unit: "", def: 1, min: 0.5, max: 2, step: 0.01,
      label: "leading", hi: ".cut-title > a", hiLine: true,
      tip: "Inert wherever `text-box: trim-both cap alphabetic` is supported, because the trim replaces the line box with the cap slab. It still bites in Firefox, which has no text-box-trim and leans on --cue-cap-drop instead." },

    { sel: ".cut-title > a", prop: "word-spacing", unit: "em", def: null, min: -0.2, max: 0.6, step: 0.005,
      label: "word spacing", hi: ".cut-title > a", hiLine: true,
      tip: "PROJECTS is one word, so this changes nothing today. It is here because the group is the complete set, and it would start to matter the moment the cut title becomes two words." },

    { sel: ".cut-title > a", prop: "font-style", kind: "pick", def: "normal",
      opts: ["normal", "italic", "oblique 6deg", "oblique 10deg", "oblique 14deg", "oblique -8deg"],
      label: "style", hi: ".cut-title > a", hiLine: true, hint: "oblique 12deg",
      note: "not declared today — `normal` is the initial value",
      tip: "`italic` asks for the drawn italic and falls back to a slant the browser fakes; the `oblique <angle>` forms ask for the slant on purpose. At this size a faked italic is visible as one." },

    { sel: ".cut-title > a", prop: "font-variant-caps", kind: "pick", def: "normal",
      opts: ["normal", "small-caps", "all-small-caps", "petite-caps", "all-petite-caps", "unicase", "titling-caps"],
      label: "caps", hi: ".cut-title > a", hiLine: true, hint: "titling-caps",
      note: "not declared today — `normal` is the initial value",
      tip: "titling-caps is the one that matters here: it asks the face for the caps it keeps for display sizes, which are drawn lighter and set tighter than its text caps. Only a few faces carry them; the rest ignore it.\nThe small-caps values need real lower case to work on, and the markup already says `Projects` — so they act on `rojects` under the uppercase transform below." },

    { sel: ".cut-title > a", prop: "font-variant-ligatures", kind: "pick",
      def: "common-ligatures discretionary-ligatures",
      opts: ["common-ligatures discretionary-ligatures", "normal", "none", "common-ligatures",
             "no-common-ligatures", "discretionary-ligatures",
             "common-ligatures discretionary-ligatures historical-ligatures", "contextual", "no-contextual"],
      label: "ligatures", hi: ".cut-title > a", hiLine: true, hint: "discretionary-ligatures",
