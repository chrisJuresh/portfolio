       empty string, which is no evidence either way — the shorthands are where
       this bites, font-synthesis especially. And a row can set `probe: false`
       where the browser is known to normalise the value into something other than
       what the sheet declares, which would fire the banner every load. */
    if (r.kind === "pick") {
      var got = norm(r.prop.slice(0, 2) === "--" ? cs.getPropertyValue(r.prop) : cs[camel(r.prop)]);
      r.live = got;
      /* Folded to lower case for the comparison only, never for the export: CSS
         keywords are case-insensitive and Chrome serialises them lowercased, so a
         sheet that says optimizeLegibility computes to optimizelegibility and the
         two are the same value written twice. The message and the export keep the
         table's own spelling, because that is what belongs in the sheet. */
      if (r.def != null && r.probe !== false && !changed(r) && got &&
          norm(r.def).toLowerCase() !== got.toLowerCase()) {
        drift.push(r.sel + " { " + r.prop + " } is " + got + ", table says " + norm(r.def));
      }
      return;
    }

    /* A custom property computes to its own declaration rather than to a pixel
       length, so compare the text — `27rem` against `27rem` — and keep the
       leading number for the slider to sit at. */
    if (r.prop.slice(0, 2) === "--") {
      var raw = cs.getPropertyValue(r.prop).trim();
      r.live = parseFloat(raw);
      if (r.def != null && !changed(r) && raw !== css(r, r.def)) {
        drift.push(r.sel + " { " + r.prop + " } is " + raw + ", table says " + css(r, r.def));
      }
      return;
    }

    var px = parseFloat(cs[r.prop === "gap" ? "columnGap" : camel(r.prop)]);
    var fs = parseFloat(cs.fontSize);
    var live;
    if (r.prop === "font-weight")      live = parseFloat(cs.fontWeight);
    else if (r.prop === "line-height") live = isNaN(px) ? 0 : px / fs;          /* px back to a ratio */
    else if (r.unit === "em")          live = isNaN(px) ? 0 : px / fs;
    else if (r.unit === "rem")         live = isNaN(px) ? 0 : px / rootPx;
    else                               live = isNaN(px) ? 0 : px;
    r.live = +live.toFixed(3);

    /* Only meaningful while the row is untouched — once injected, the page is
       computing the tuner's value, not the stylesheet's. */
    if (r.def != null && !changed(r)) {
      /* Tight on purpose. The only noise here is sub-pixel snapping — browsers
         round a computed length to 1/64px, so the worst error is 0.008px, which
         is 0.0005rem — and at 0.02 the ladder's smaller rungs slipped through
         unreported (0.6 → 0.618, 0.25 → 0.236, 0.22 → 0.236 all passed). px rows
         stay loose: they're whole-pixel sizes where 0.25 is still well inside a
         real change. */
      var tol = r.unit === "px" ? 0.25 : 0.005;
      if (Math.abs(r.live - r.def) > tol) {
        drift.push(r.sel + " { " + r.prop + " } is " + num(r.live) + r.unit + ", table says " + num(r.def) + r.unit);
      }
    }
  });

  var banner = document.getElementById("drift");
  banner.innerHTML = drift.length
    ? "<strong>styles.css has moved under this tool</strong> — the &ldquo;was&rdquo; comments in the export will be wrong until the ROWS table in this file is updated:<br>" +
      drift.map(function (d) { return "<code>" + d + "</code>"; }).join("<br>")
    : "";

  paint();
}

/* Which face actually won, measured rather than trusted. A family that is
   neither installed nor @font-face'd falls to whatever is next in the stack, and
   for every candidate stack that is Comic Sans — so this is where the tell gets
   read back as a name. Most specific first: Georgia Pro would otherwise be
   reported as Georgia. It is also how a shipped stack tells you its webfont did
   not arrive — the row says Sitka Text, or Charter on a Mac, instead of
   Vollkorn — which nothing else on screen would show. */
/* Every family either list can ask for, in the order the measurement tries them.
   Ordering is the whole subtlety: the first match wins, so a name has to come
   before anything it is a prefix of — "Georgia Pro" before Georgia, "Bodoni MT
   Condensed" before "Bodoni MT", "Cormorant Garamond" before Cormorant — or the
   specific face gets reported under the general name. The display families go
   first for the same reason, since they are the ones being surveyed. */
var FACES = [
  /* display: the cut title's list */
  "Ogg Roman", "Ogg", "PP Editorial New", "Editorial New",
  "Bodoni Moda", "Libre Bodoni", "Bodoni MT Condensed", "Bodoni MT Black",
  "Bodoni MT", "Modern No. 20", "Didot", "Antic Didone", "Playfair Display SC", "Playfair Display",
  "Prata", "Rufina", "DM Serif Display", "Instrument Serif", "Cinzel Decorative", "Cinzel",
  "Trajan Pro", "Marcellus SC", "Marcellus", "Italiana", "Forum", "Engravers MT",
  "Perpetua Titling MT", "Perpetua", "Copperplate Gothic Light",
  /* One design under three names — the /fonts webfont calls itself "Friz Quadrata
     Std", a desktop install may be either of the others. Identical outlines measure
     identically, so this test cannot tell them apart and will report whichever
     comes first here; "Std" leads because that is the one this repo actually
     serves, and the other two only appear on a machine that already had the font.
     Std and the ITC name both precede the bare one, per the prefix rule above. */
  "Friz Quadrata Std", "ITC Friz Quadrata", "Friz Quadrata",
  "EB Garamond",
  "Cormorant Garamond", "Cormorant", "Garamond", "Goudy Old Style", "Centaur",
  "Baskerville Old Face", "Baskerville", "Big Caslon", "Hoefler Text", "Cochin",
  "Old Standard TT", "Gilda Display", "Young Serif", "Abril Fatface", "Yeseva One",
  "Elephant", "Fraunces", "Anton", "Space Grotesk",
  "Sitka Banner", "Sitka Display", "Sitka Subheading", "Sitka Heading",

  /* body: the reading list */
  "Sitka Text", "Source Serif 4", "Source Serif Pro", "Literata", "Georgia Pro", "Newsreader",
  "PT Serif", "Castoro", "Merriweather", "Constantia", "Faustina", "Domine", "Spectral",
  "Vollkorn", "Bitter", "Latin Modern Roman", "LM Roman 9", "LM Roman 8", "LM Roman 12",
  "Charter", "Bitstream Charter", "XCharter", "Cambria", "Palatino Linotype", "Book Antiqua",
  "Georgia", "Times New Roman", "Comic Sans MS", "serif"
];

function resolved(stack) {
  var doc = frame.contentDocument;
  if (!doc) return "";
  var probeCtx = doc.createElement("canvas").getContext("2d");
  var w = function (fam) { probeCtx.font = "40px " + fam; return probeCtx.measureText("Handgloves 123").width; };

  /* A family this machine hasn't got measures as the canvas default — Times on
     Windows — so an uninstalled NAME is a width like any other, and the first one
     in FACES will claim every stack that legitimately resolved to that default.
     Ogg is the case that exposed it: retail, absent here, first in the list, and
     every Times result came back reported as "Ogg Roman". So the absent names are
     dropped before matching, measured against a family nobody can have.
     Two names are exempt, because the test cannot see them: `serif` is a generic
     and always resolvable, and Times New Roman is what the canvas default IS on
     Windows — so both measure exactly like a family nobody has. Exempting them
     costs nothing. A stack that measures as the default either asked for Times and
     got it, or asked for a generic serif and got Times; naming Times is right
     either way, and it is what this tool said before Ogg joined the list. */
  var gone = w('"__no_such_family__"');
  var known = FACES.filter(function (name) {
    return name === "serif" || name === "Times New Roman" ||
           Math.abs(w('"' + name + '"') - gone) > 0.01;
  });
  var want = w(stack), hit = "?";
  for (var i = 0; i < known.length; i++) {
    var name = known[i] === "serif" ? "serif" : '"' + known[i] + '"';
    if (Math.abs(w(name) - want) < 0.01) { hit = known[i] === "serif" ? "generic serif" : known[i]; break; }
  }
  return hit;
}

/* Reads that measurement back onto a font row. Called from paint() and again on
   every hover, so the note keeps pace with the frame rather than with the
   selection — hover a face this machine hasn't got and it says so at once. */
function faceNote(r) {
  if (!r || !r.face) return;
  var stack = String(previewOf(r)), got = resolved(stack);
  /* Comic Sans can only be what a candidate stack fell through to — nothing in
     the list asks for it — so name the absence rather than the face. */
  var absent = got === "Comic Sans MS" && stack.indexOf(COMIC) !== -1;
  var note = absent ? "→ nothing here — Comic Sans" : "→ " + got;
  var cls = "selnote" + (absent ? " absent" : "");

  /* The display row carries a second fact, and it is the one that bites: whether
     the word still fits the measure. See fit(). */
  if (r.prop === "--serif-display" && !absent) {
    var f = fit();
    if (f) {
      note += f.fits ? " · fits the measure" : " · " + f.over + " past the measure, fits at " + f.size + "cqw";
      if (!f.fits) cls += " over";
    }
  }
  r.face.textContent = note;
  r.face.className = cls;
}

/* Does PROJECTS still fit the column, and at what size would it?

   This is the failure the tool could not see. --cue-size is the ONE face-specific
   number in the cut title — 22.95cqw fits the word to the full measure in Friz
   and in nothing else, as 25.32 did in Sitka Banner before it — and
   `.cut-title > a` clips on both axes, so a wider
   face does not overflow visibly, it loses its tail. Silently: a cut title is
   MEANT to be cut, so a T sliced down its stem by the right-hand edge reads as the
   device working. Of the faces in DISPLAY that resolve on this machine, thirty-four
   of thirty-nine overflow, most of them by a fifth of the word.

   Measured on the real span rather than a canvas, so tracking, the uppercase
   transform, the weight and any feature that moves an advance width are all in it.
   `size` is what --cue-size would have to be for the ink to land exactly on the
   measure — the retune the styles.css comment asks for, done for you.

   Half a pixel of tolerance: an exact fit is the intent, and browsers round a
   computed length to 1/64px, so a word that lands dead on the measure must not
   report itself as overflowing. */
function fit() {
  var doc = frame.contentDocument;
  if (!doc) return null;
  var box = doc.querySelector(".cut-title"), sp = doc.querySelector(".cut-title > a > span");
  var row = BYKEY[":root|--cue-size"];
  if (!box || !sp || !row) return null;

  var col = box.getBoundingClientRect().width;
  if (!col) return null;
  var rng = doc.createRange();
  rng.selectNodeContents(sp);
  var ink = rng.getBoundingClientRect().width;
  if (!ink) return null;

  var now = +effective(row);
  return {
    fits: ink <= col + 0.5,
    over: Math.round((ink / col - 1) * 1000) / 10 + "%",
    size: +(now * col / ink).toFixed(2)
  };
}

/* ---- CSS out ------------------------------------------------------------- */
/* The Comic Sans tail is a tuner instrument, not a design decision, so it does
   not leave the tuner: the export puts `serif` back under any candidate stack.
   Only the preview copy — buildCSS(false), injected into the frame — keeps it.
   The two differ solely in what happens when a face is absent, and if a face was
   absent you were looking at Comic Sans and were never going to ship it. */
function ship(v) {
  return String(v).split(COMIC).join("serif");
}

function buildCSS(annotated) {
  var rows = changedRows();
  if (!rows.length) return annotated ? "/* nothing changed yet — move a slider */" : "";

  var order = [], bySel = {};
  rows.forEach(function (r) {
    if (!bySel[r.sel]) { bySel[r.sel] = []; order.push(r.sel); }
    bySel[r.sel].push(r);
  });

  var swapped = annotated && rows.some(function (r) {
    return r.isFont && String(val(r)).indexOf(COMIC) !== -1;
  });

  /* Which borrowed faces this export leans on. The preview fetches them from
     Google; portfolio/ ships nothing for them, so pasting one in without hosting
     it first lands on `serif` for every visitor while still looking right here.
     GOOGLE, not every webfont on offer: the SELF families are served out of
     /fonts already, so naming one of those is naming something that will render. */
  var borrowed = annotated ? GOOGLE.filter(function (fam) {
    return rows.some(function (r) { return r.isFont && String(val(r)).indexOf(fam) !== -1; });
  }) : [];

  var out = [];
  if (annotated) {
    out.push("/* " + Array(74).join("─"));
    out.push("   type-tuner export — /portfolio — " + rows.length + " change" + (rows.length === 1 ? "" : "s"));
    out.push("   tuned at " + state.w + "×" + state.h + ", " + state.theme + " theme, " + new Date().toISOString().slice(0, 16).replace("T", " "));
    if (state.active != null && state.profiles[state.active] && !dirty()) out.push("   profile: " + pname(state.active));
    out.push("   Selectors and units match portfolio/styles.css.");
    if (swapped) {
      out.push("   The tuner's " + COMIC + " fallback — the tell for a face this");
      out.push("   machine hasn't got — is `serif` below. Check the resolved-face note beside");
      out.push("   each font row: if it said Comic Sans MS, that stack has nothing to render.");
    }
    if (borrowed.length) {
      out.push("   " + borrowed.join(", ") + " render" + (borrowed.length === 1 ? "s" : "") + " in the tuner because the");
      out.push("   preview borrows " + (borrowed.length === 1 ? "it" : "them") + " from Google Fonts. portfolio/ hosts nothing for");
      out.push("   " + (borrowed.length === 1 ? "it" : "them") + " — self-host the face into /fonts first, or this is `serif` in production.");
    }
    out.push("   " + Array(74).join("─") + " */");
    out.push("");
  }

  order.forEach(function (sel) {
    if (annotated) {
      bySel[sel].forEach(function (r) {
        if (r.note) out.push("/* " + r.prop + ": " + r.note + " */");
      });
    }
    out.push(sel + " {");
    bySel[sel].forEach(function (r) {
      var v = css(r, val(r));
      var line = "  " + r.prop + ": " + (annotated && r.isFont ? ship(v) : v) + ";";
      if (annotated) {
        var was = r.def == null ? "not set" : css(r, r.def);
        while (line.length < 43) line += " ";   /* line up the comments, but never run into one */
        line += " /* was " + was + " */";
      }
      out.push(line);
    });
    out.push("}");
  });

  if (annotated) {
    out.push("");
    out.push("/* tuner-state v1: " + JSON.stringify(state.vals) + " */");
  }
  return out.join("\n");
}

/* ---- rendering the panel ------------------------------------------------- */
var controls = document.getElementById("controls");

function chips(host, items, isOn, pick) {
  host.textContent = "";
  items.forEach(function (it) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = it.label;
    b.setAttribute("aria-pressed", String(isOn(it)));
    b.addEventListener("click", function () { pick(it); });
    host.appendChild(b);
  });
}

/* Delegated, so it covers the slider, the number box, the label and the select
   in one place, and keeps working for rows built later. */
function wireHighlight() {
  function rowOf(e) {
    var n = e.target;
    while (n && n !== controls) { if (n.__row) return n.__row; n = n.parentNode; }
    return null;
  }
  controls.addEventListener("mouseover", function (e) { var r = rowOf(e); if (r) highlight(r.hi, r.hiLine); });
  controls.addEventListener("mouseout",  function (e) { if (!controls.contains(e.relatedTarget)) highlight(null); });
  controls.addEventListener("focusin",   function (e) { var r = rowOf(e); if (r) { highlight(r.hi, r.hiLine); reveal(r.hi); setStrip(r.strip); } });
  controls.addEventListener("focusout",  function (e) { if (!controls.contains(e.relatedTarget)) highlight(null); });
  controls.addEventListener("pointerdown", function (e) { var r = rowOf(e); if (r) { reveal(r.hi); setStrip(r.strip); } });
}

function buildPanel() {
  GROUPS.forEach(function (g) {
    var box = document.createElement("section");
    box.className = "g" + (state.shut[g.name] ? " shut" : "");

    var head = document.createElement("button");
    head.type = "button";
    head.className = "ghead";
    head.appendChild(document.createTextNode(g.name));
    var badge = document.createElement("span");
    badge.className = "badge";
    head.appendChild(badge);
    g.badge = badge;
    head.addEventListener("click", function () {
      box.classList.toggle("shut");
      state.shut[g.name] = box.classList.contains("shut");
      save();
    });
    box.appendChild(head);

    var body = document.createElement("div");
    body.className = "gbody";
    g.rows.forEach(function (r) { body.appendChild(r.kind === "num" ? numRow(r) : pickRow(r)); });
    box.appendChild(body);
    controls.appendChild(box);
  });
}

function numRow(r) {
  var row = document.createElement("div");
  row.className = "row";
  r.el = row;
  row.__row = r;

  var lab = document.createElement("label");
  lab.textContent = r.label;
  lab.title = r.sel + " { " + r.prop + " }" + (r.note ? "  — " + r.note : "") + (r.tip ? "\n\n" + r.tip : "");

  var range = document.createElement("input");
  range.type = "range";
  range.min = r.min; range.max = r.max; range.step = r.step;

  var box = document.createElement("input");
  box.type = "number";
  box.min = r.min; box.max = r.max; box.step = r.step;

  var undo = document.createElement("button");
  undo.type = "button";
  undo.className = "undo";
  undo.textContent = "↺";
  undo.title = "back to " + (r.def == null ? "unset" : css(r, r.def));

  r.inputs = [range, box];

  function set(v, live) {
    v = Math.min(r.max, Math.max(r.min, +v));
    state.vals[r.k] = +v.toFixed(4);
    range.value = v; box.value = num(v);
    if (live) apply(true); else commit(r.k);   /* mid-drag: no history entry */
  }
  range.addEventListener("input",  function () { set(range.value, true); });
  range.addEventListener("change", function () { set(range.value, false); });
  box.addEventListener("input",    function () { if (box.value !== "") set(box.value, false); });
  undo.addEventListener("click",   function () { delete state.vals[r.k]; commit(null); });

  row.appendChild(lab); row.appendChild(range); row.appendChild(box); row.appendChild(undo);
  return row;
}

/* ---- the hover list ------------------------------------------------------ */
/* A listbox rather than a <select>, for one reason: a native popup is drawn by
   the OS and never reports which option the pointer is over, so trying a face
   means committing to it and coming back — twenty-six faces in the reading list
   and sixty-one in the display one, so a hundred and seventy-four clicks to see
   them all. Here the entry under the pointer is the one in the page, and only a
   click keeps it, so the way to survey the list is to run down it.
   Keyword rows get the same widget and need it just as badly: nobody reads the
   difference between `titling-caps` and `all-small-caps`, or between four values
   of text-rendering, off a name — you look at it. Same rule either way, whether
   the list holds a font stack or `oblique 10deg`.
   `pick.value` is a property, get and set, so paint() can go on driving every
   widget in the panel through `.value` without knowing which are selects. */
var openPick = null;                      /* one list open at a time */
var pickSeq = 0;

function hoverPick(r, free) {
  var id = "fp" + (++pickSeq);

  var pick = document.createElement("div");
  pick.className = "pick";

  var trigger = document.createElement("button");
  trigger.type = "button";
  trigger.className = "trigger";
  trigger.setAttribute("aria-haspopup", "listbox");
  trigger.setAttribute("aria-expanded", "false");
  trigger.title = "hover an entry to put it in the page — only a click keeps it";
  var now = document.createElement("span");
  now.className = "now";
  trigger.appendChild(now);

  var menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "listbox");
  menu.hidden = true;

  var opts = r.list.concat([["custom…", "__custom"]]).map(function (s, i) {
    var o = document.createElement("div");
    o.className = "opt";
    o.id = id + "-" + i;                  /* so aria-activedescendant can name it */
    o.setAttribute("role", "option");
    o.textContent = s[0];
    o.__name = s[0];
    o.__val = s[1];
    menu.appendChild(o);
    return o;
  });

  var cur = null;                         /* what is chosen, not what is hovered */

  function nameOf(v) {
    var hit = opts.filter(function (o) { return o.__val === v; })[0];
    return hit ? hit.__name : "custom…";
  }
  function at() {
    return opts.filter(function (o) { return o.classList.contains("at"); })[0] || null;
  }
  function optOf(n) {
    while (n && n !== menu) {
      if (n.classList && n.classList.contains("opt")) return n;
      n = n.parentNode;
    }
    return null;
  }

  /* Where the pointer — or an arrow key — has got to. Straight into the page, and
     named on the trigger, so the frame and the panel never disagree about what is
     being looked at. `custom…` has no value behind it, so it previews nothing. */
  function peek(o) {
    opts.forEach(function (x) { x.classList.toggle("at", x === o); });
    if (o) menu.setAttribute("aria-activedescendant", o.id);
    else menu.removeAttribute("aria-activedescendant");
    var v = o && o.__val !== "__custom" ? o.__val : null;
    pick.classList.toggle("peek", v != null && v !== cur);
    now.textContent = v == null ? nameOf(cur) : o.__name;
    setPreview(r, v);
  }

  function show() {
    if (openPick && openPick !== pick) openPick.__shut();
    openPick = pick;
    pick.classList.add("open");
    menu.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    var on = opts.filter(function (o) { return o.__val === cur; })[0];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
  }
  function shut() {
    if (openPick === pick) openPick = null;
    pick.classList.remove("open");
    menu.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
    peek(null);                           /* the preview goes with the list */
  }
  pick.__shut = shut;

  /* `custom…` is a state of the row, not a value, and it has to be recorded as
     one: it seeds the box with whatever is in force, which is usually a value
     that IS in the list, and paint() would otherwise read that back as "not
     custom after all" and shut the box again the moment it opened. */
  function choose(v) {
    shut();
    r.wantFree = v === "__custom";
    if (r.wantFree) {
      free.hidden = false;
      free.value = free.value || effective(r);
      free.focus();
      state.vals[r.k] = free.value;
    } else {
      free.hidden = true;
      state.vals[r.k] = v;
    }
    commit(r.k);
  }

  trigger.addEventListener("click", function () { if (menu.hidden) show(); else shut(); });

  /* Keeps the focus on the trigger through a click on an entry: an .opt is not
     focusable, so without this the mousedown blurs the trigger and focusout
     shuts the list out from under the click. */
  menu.addEventListener("mousedown",    function (e) { e.preventDefault(); });
  menu.addEventListener("pointerover",  function (e) { var o = optOf(e.target); if (o) peek(o); });
  menu.addEventListener("pointerleave", function () { peek(null); });
  menu.addEventListener("click",        function (e) { var o = optOf(e.target); if (o) choose(o.__val); });

  /* The same sweep from the keyboard: the arrows move the preview, Enter keeps
     it. A closed <select> managed that much; an open one never did. */
  pick.addEventListener("keydown", function (e) {
    var k = e.key;
    if (menu.hidden) {
      if (k === "ArrowDown" || k === "ArrowUp" || k === "Enter" || k === " ") { e.preventDefault(); show(); }
      return;
    }
    if (k === "Escape") { e.preventDefault(); shut(); trigger.focus(); return; }
    if (k === "Tab") { shut(); return; }
    if (k === "Enter" || k === " ") {
      e.preventDefault();
      var o = at();
      if (o) choose(o.__val);
      return;
    }
    if (k !== "ArrowDown" && k !== "ArrowUp") return;
    e.preventDefault();
    var here = at();
    var i = here ? opts.indexOf(here) : opts.map(function (o) { return o.__val; }).indexOf(cur);
    i = Math.max(0, Math.min(opts.length - 1, (i < 0 ? 0 : i) + (k === "ArrowDown" ? 1 : -1)));
    peek(opts[i]);
    if (opts[i].scrollIntoView) opts[i].scrollIntoView({ block: "nearest" });
  });

  /* Leaving the control at all — including clicking into the frame — puts the
     list away, so a preview can never outlive the pointer that asked for it. */
  pick.addEventListener("focusout", function (e) {
    if (!pick.contains(e.relatedTarget)) shut();
  });

  Object.defineProperty(pick, "value", {
    get: function () { return cur; },
    set: function (v) {
      cur = v;
      opts.forEach(function (o) {
        var on = o.__val === v;
        o.classList.toggle("cur", on);
        o.setAttribute("aria-selected", String(on));
      });
      if (!at()) now.textContent = nameOf(v);   /* never overwrite a live hover */
    }
  });

  pick.appendChild(trigger);
  pick.appendChild(menu);
  return pick;
}

/* One row for everything chosen out of a list, font stack or keyword alike. The
   resolved-face note is the only font-only part, and rightly so: which face won is
   a real question with a measurable answer, whereas a keyword either applied or the
   property does not exist — and either way the page in the frame is the report. */
function pickRow(r) {
  var row = document.createElement("div");
  row.className = "frow";
  r.el = row;
  row.__row = r;

  var lab = document.createElement("label");
  lab.textContent = r.label;
  lab.title = r.sel + " { " + r.prop + " }" + (r.note ? "  — " + r.note : "") + (r.tip ? "\n\n" + r.tip : "");

  var free = document.createElement("input");
  free.type = "text";
  free.placeholder = "e.g. " + r.hint;
  free.hidden = true;

  var undo = document.createElement("button");
  undo.type = "button";
  undo.className = "undo";
  undo.textContent = "↺";
  undo.title = "back to " + (r.def == null ? "unset" : r.def);
  undo.style.visibility = "hidden";

  var pick = hoverPick(r, free);

  var wrap = document.createElement("div");
  wrap.className = "sel";
  wrap.appendChild(pick);
  wrap.appendChild(undo);

  r.inputs = [pick, free];
  r.undo = undo;

  free.addEventListener("input", function () { state.vals[r.k] = free.value; commit(r.k); });
  undo.addEventListener("click", function () {
    delete state.vals[r.k];
    r.wantFree = false;
    free.hidden = true;
    commit(null);
  });

  row.appendChild(lab); row.appendChild(wrap); row.appendChild(free);

  if (r.isFont) {
    var face = document.createElement("span");
    face.className = "selnote";
    r.face = face;
    row.appendChild(face);
  }
  return row;
}

/* ---- paint: push state into the widgets --------------------------------- */
function paint() {
  ROWS.forEach(function (r) {
    if (!r.el) return;
    var on = changed(r);
    r.el.classList.toggle("on", on);
    r.el.classList.toggle("gone", !!r.gone);

    if (r.list) {
      /* A value the list can name shows that name; anything else — a hand-typed
         stack, an OpenType feature nobody put in the presets, or `custom…` picked
         deliberately — shows the box instead. */
      var v0 = String(effective(r));
      var known = !r.wantFree && r.list.some(function (s) { return s[1] === v0; });
      r.inputs[0].value = known ? v0 : "__custom";
      r.inputs[1].hidden = known;
      if (!known && document.activeElement !== r.inputs[1]) r.inputs[1].value = v0;
      r.undo.style.visibility = on ? "visible" : "hidden";
      if (r.face) faceNote(r);
    } else {
      var v = effective(r);
      if (document.activeElement !== r.inputs[1]) r.inputs[1].value = num(v);
      r.inputs[0].value = v;
      if (r.gone) r.el.title = r.sel + " isn't on the page with the current content.js";
    }
  });

  GROUPS.forEach(function (g) {
    var n = g.rows.filter(changed).length;
    g.badge.textContent = n ? n : "";
    g.badge.dataset.n = n;
  });

  var total = changedRows().length;
  var count = document.getElementById("count");
  count.textContent = total;
  count.dataset.n = total;

  var out = document.getElementById("out");
  if (document.activeElement !== out) out.value = buildCSS(true);

  chips(document.getElementById("sizes"),
    SIZES.map(function (s) { return { label: s.label, value: s.k }; }),
    function (i) { return i.value === state.preset; },
    function (i) { setPreset(i.value); });

  if (document.activeElement !== fw) fw.value = state.w;
  if (document.activeElement !== fh) fh.value = state.h;
  document.getElementById("hilite").setAttribute("aria-pressed", String(!!state.hi));

  document.getElementById("undo").disabled = hix <= 0;
  document.getElementById("redo").disabled = hix >= hist.length - 1;
  paintProfiles();
}

function paintProfiles() {
  var host = document.getElementById("profiles");
  host.textContent = "";
  var isDirty = dirty();

  state.profiles.forEach(function (p, i) {
    var cell = document.createElement("div");
    cell.className = "slot" + (p ? "" : " empty") + (state.active === i ? " on" : "") + (state.active === i && isDirty ? " dirty" : "");

    var load = document.createElement("button");
    load.type = "button";
    load.className = "load";
    load.textContent = pname(i);
    load.title = p
      ? pname(i) + " — " + Object.keys(p.vals).length + " change(s). Click or press " + (i + 1) + " to load." +
        "\nDouble-click renames, alt-click clears.\n\n" + Object.keys(p.vals).map(function (k) { return k.replace("|", " → ") + ": " + p.vals[k]; }).join("\n")
      : "Empty. Click to store the current " + changedRows().length + " change(s) here.";

    load.addEventListener("click", function (e) {
      if (e.altKey) return clearProfile(i);
      if (p) loadProfile(i); else saveProfile(i);
    });
    load.addEventListener("dblclick", function () { renameProfile(i); });

    var put = document.createElement("button");
    put.type = "button";
    put.className = "put";
    put.textContent = "⤓";
    put.title = "Save the current state into " + pname(i);
    put.addEventListener("click", function () { saveProfile(i); });

    cell.appendChild(load);
    cell.appendChild(put);
    host.appendChild(cell);
  });
}

/* live=true during a slider drag: restyle and repaint, but spare the disk a
   write on every intermediate value. */
function apply(live) {
  inject();
  paint();
  if (!live) save();
}

/* ---- wiring -------------------------------------------------------------- */
frame.addEventListener("load", function () {
  var doc = frame.contentDocument;
  if (!doc) return;
  doc.documentElement.setAttribute("data-theme", state.theme);
  /* fonts.css is asked for fresh every frame load. A cached copy of it is a copy
     of the @font-face list, and a face added since is then invisible to the
     preview while sitting on disk and being served — which this tool reports as
     "nothing here — Comic Sans", i.e. as a missing file rather than a stale
     sheet. That is the one lie it must not tell, and it cost an afternoon once.
     Production revalidates this sheet (see vercel.json); the query makes the
     tuner independent of whatever any cache in front of it decides to do. It is
     ~5 KB, and only this dev page pays for it. */
  Promise.all([addLink(doc, "/fonts/fonts.css?" + Date.now()), addLink(doc, GFONT), addLink(doc, DFONT)])
    .then(function () { return doc.fonts ? Promise.all(SELF.concat(GOOGLE).map(loadFace)) : null; })
    .then(function () { return doc.fonts ? doc.fonts.ready : null; })
    .then(function () { inject(); probe(); setStrip(wantStrip); });
});

document.getElementById("theme").addEventListener("click", function () {
  state.theme = state.theme === "dark" ? "light" : "dark";
  save();
  loadFrame();                              /* the page reads the theme on boot */
});
document.getElementById("reload").addEventListener("click", loadFrame);
document.getElementById("whole").addEventListener("click", wholePage);
document.getElementById("undo").addEventListener("click", undoStep);
document.getElementById("redo").addEventListener("click", redoStep);

/* Digits switch profiles for quick A/B; Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y walk the
   timeline. Both stand down while a text or number field has focus, so typing a
   size stays typing a size and the browser's own text undo is left alone. */
addEventListener("keydown", function (e) {
  var t = document.activeElement, tag = t ? t.tagName : "";
  var typing = tag === "TEXTAREA" || (tag === "INPUT" && (t.type === "text" || t.type === "number"));

  if (e.ctrlKey || e.metaKey) {
    var k = e.key.toLowerCase();
    if (typing && k === "z") return;                 /* let the field undo itself */
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undoStep(); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redoStep(); }
    return;
  }

  /* An open font list owns the arrows, Enter and Escape, and a digit typed at it
     is a fumble rather than a request to swap profiles underneath it. */
  if (typing || e.altKey || openPick) return;
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= SLOTS) {
    e.preventDefault();
    if (state.profiles[n - 1]) loadProfile(n - 1); else say("P" + n + " is empty");
  }
});

document.getElementById("hilite").addEventListener("click", function () {
  state.hi = !state.hi;
  if (!state.hi) highlight(null);
  save(); paint();
});

/* Typing a size by hand is its own preset — no chip stays lit for it. */
var fw = document.getElementById("fw"), fh = document.getElementById("fh");
function dim(input, key, min) {
  input.addEventListener("input", function () {
    var v = parseInt(input.value, 10);
    if (isNaN(v) || v < min) return;
    state[key] = v; state.preset = "custom";
    sizeFrame(); save(); paint();
  });
}
dim(fw, "w", 320);
dim(fh, "h", 400);

/* Follow the window while "my window" is the chosen size. */
var reTimer = null;
addEventListener("resize", function () {
  if (state.preset !== "window") return;
  clearTimeout(reTimer);
  reTimer = setTimeout(function () { setPreset("window"); }, 120);
});

document.getElementById("copy").addEventListener("click", function () {
  var out = document.getElementById("out");
  var done = function () { say("copied — paste it into the chat"); };
  if (navigator.clipboard) navigator.clipboard.writeText(out.value).then(done, function () { out.select(); document.execCommand("copy"); done(); });
  else { out.select(); document.execCommand("copy"); done(); }
});

document.getElementById("import").addEventListener("click", function () {
  var text = document.getElementById("out").value;
  var m = text.match(/tuner-state v1:\s*(\{[\s\S]*?\})\s*\*\//);
  if (!m) return say("no `tuner-state` line found in that text");
  try {
    var vals = JSON.parse(m[1]);
    /* Drop keys this build no longer knows, so a stale export can't wedge it. */
    var live = {};
    ROWS.forEach(function (r) { if (vals[r.k] != null) live[r.k] = vals[r.k]; });
    state.vals = live;
    commit(null);
    say("imported " + changedRows().length + " change(s)");
  } catch (e) { say("that state line didn't parse"); }
});

document.getElementById("resetall").addEventListener("click", function () {
  if (!changedRows().length) return;
  if (!confirm("Discard every change and go back to what styles.css ships?")) return;
  state.vals = {};
  commit(null);                             /* undoable — Ctrl+Z brings it back */
  say("reset");
});

var sayTimer = null;
function say(msg) {
  var el = document.getElementById("status");
  el.textContent = msg;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(function () { el.textContent = ""; }, 2600);
}

buildPanel();
wireHighlight();
paint();
loadFrame();
</script>
</body>
</html>
