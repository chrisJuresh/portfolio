<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plate tuner — /portfolio</title>
  <style>
    :root { color-scheme: light dark; --ui: #1a1917; --ui-bg: #fcfbf8; --ui-panel: #f5f2ea; --ui-line: #d6d0c4; --ui-mut: #6f6a5d; --ui-hit: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --ui: #eaeaea; --ui-bg: #161616; --ui-panel: #1e1e1e; --ui-line: #3a3a3a; --ui-mut: #9a9a9a; --ui-hit: #d8a76a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      background: var(--ui-bg); color: var(--ui);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    /* ---- top bar ---------------------------------------------------------- */
    .top {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ui-line);
    }
    .top strong { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .grow { flex: 1 1 auto; }
    button, input[type="text"], input[type="number"], textarea {
      font: inherit; color: var(--ui); background: transparent;
      border: 1px solid var(--ui-line); border-radius: 5px;
    }
    input[type="text"], input[type="number"], textarea { background: var(--ui-bg); color-scheme: light dark; }
    button { padding: 0.24rem 0.55rem; cursor: pointer; }
    button:hover { border-color: var(--ui-mut); }
    button[aria-pressed="true"] { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    .badge { padding: 0.1rem 0.4rem; border-radius: 99px; background: var(--ui-hit); color: var(--ui-bg); font-size: 11px; }
    .badge[data-n="0"] { background: transparent; color: var(--ui-mut); }
    .set { display: flex; gap: 0; }
    .set button { border-radius: 0; margin-left: -1px; }
    .set button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
    .set button:last-child { border-radius: 0 5px 5px 0; }

    /* ---- layout ----------------------------------------------------------- */
    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .side { flex: 0 0 23rem; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--ui-line); background: var(--ui-panel); }
    .controls { flex: 1 1 auto; overflow: auto; padding-bottom: 0.6rem; }
    .stage { flex: 1 1 auto; overflow: auto; padding: 0.8rem; }
    iframe { display: block; border: 0; background: #fff; }
    /* The wrapper carries the border and takes the SCALED size, so the stage
       lays out against what you can see rather than against the 1920 the frame
       inside it still thinks it is. */
    .frame-fit { position: relative; overflow: hidden; border: 1px solid var(--ui-line); }
    .frame-fit iframe { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    .scale-note { margin-top: 0.4rem; font-size: 0.7rem; color: var(--ui-mut); }
    /* The bare views stand on the page's own paper, at the plate's own opacity —
       judging a grade against this tool's chrome would be judging it against a
       colour the plate never meets. */
    .sheet { display: inline-block; padding: 1.2rem; border: 1px solid var(--ui-line); }
    .sheet canvas { display: block; max-width: 100%; height: auto; }
    [hidden] { display: none !important; }

    /* ---- groups + rows ---------------------------------------------------- */
    .ghead {
      width: 100%; display: flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.7rem; border: 0; border-top: 1px solid var(--ui-line);
      border-radius: 0; background: transparent; text-align: left;
      font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut);
    }
    .ghead::before { content: "\25be"; font-size: 10px; }
    .g.shut .ghead::before { content: "\25b8"; }
    .g.shut .gbody { display: none; }
    .gbody { padding: 0.15rem 0.7rem 0.5rem; }
    .gnote { margin: 0.1rem 0 0.45rem; font-size: 10.5px; color: var(--ui-mut); }

    .row { display: grid; grid-template-columns: 7.6rem 1fr 4.2rem 1rem; align-items: center; gap: 0.3rem; min-height: 1.55rem; }
    .row > label { font-size: 11.5px; color: var(--ui-mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.on > label { color: var(--ui-hit); }
    input[type="range"] { width: 100%; min-width: 0; accent-color: var(--ui-hit); }
    input[type="number"] { width: 100%; padding: 0.08rem 0.2rem; font-size: 11.5px; }
    input[type="color"] { width: 100%; height: 1.3rem; padding: 0; border: 1px solid var(--ui-line); border-radius: 4px; background: transparent; cursor: pointer; }
    .undo { border: 0; padding: 0; width: 1rem; color: var(--ui-mut); visibility: hidden; line-height: 1; }
    .row.on .undo { visibility: visible; }
    .undo:hover { color: var(--ui-hit); }

    .hint { font-size: 10.5px; color: var(--ui-mut); }
    .warn { margin: 0; padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--ui-line); background: rgba(216, 167, 106, 0.16); font-size: 11.5px; }
    .warn:empty { display: none; }
    .warn code { font-family: ui-monospace, Consolas, monospace; }

    /* ---- export drawer ---------------------------------------------------- */
    .export { flex: 0 0 auto; border-top: 1px solid var(--ui-line); max-height: 60%; overflow: auto; }
    .export > summary { padding: 0.4rem 0.7rem; cursor: pointer; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .ebody { padding: 0 0.7rem 0.6rem; }
    .ebody h3 { margin: 0.4rem 0 0.2rem; font: 10.5px/1.4 ui-monospace, Consolas, monospace; color: var(--ui-mut); }
    textarea { width: 100%; height: 9rem; padding: 0.4rem; resize: vertical; font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre; }
    .ebtns { display: flex; gap: 0.3rem; align-items: center; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div class="top">
    <strong>plate</strong>
    <span class="badge" id="count" data-n="0">0</span>
    <span class="set" id="pics"></span>
    <span class="set" id="views"></span>
    <span class="set" id="sizes"></span>
    <span class="grow"></span>
    <span class="hint" id="stat"></span>
    <button id="theme" type="button">theme</button>
    <button id="resetall" type="button">reset all</button>
  </div>

  <p class="warn" id="warn"></p>

  <div class="wrap">
    <div class="side">
      <div class="controls" id="controls"></div>
      <details class="export" open>
        <summary>what to paste</summary>
        <div class="ebody">
          <h3>design/plate/build-plate.py — then re-run it</h3>
          <textarea id="outpy" spellcheck="false" readonly></textarea>
          <div class="ebtns"><button data-copy="outpy" type="button">copy</button>
            <span class="hint">the grade is baked into the file: nothing here shows on the site until the script runs again</span></div>
          <h3>portfolio/styles.css</h3>
          <textarea id="outcss" spellcheck="false" readonly style="height:6rem"></textarea>
          <div class="ebtns"><button data-copy="outcss" type="button">copy</button>
            <span class="hint">live already — this half is only CSS</span></div>
        </div>
      </details>
    </div>
    <main class="stage">
      <!-- The iframe is the chosen viewport at its TRUE size and is then scaled
           down to fit the panel, rather than being shrunk to fit by handing the
           page a smaller window. Those are different pictures now: the placement
           is in fixed pixels, so a 400px-wide frame shows the top-left corner of
           the plate at 1:1 and not the plate. See fitFrame(). -->
      <div class="frame-fit" id="fit"><iframe id="frame" title="portfolio preview"></iframe></div>
      <div class="scale-note" id="scalenote"></div>
      <div class="scale-note" id="derived"></div>
      <div class="sheet" id="sheet" hidden><canvas id="cv"></canvas></div>
    </main>
  </div>

<script>
/* ============================================================================
   Plate tuner — everything about the three photographs in the page's corners: the
   plate in the bottom-left, the car in the top-right and the eye in the
   bottom-right.

   Two halves that are tuned together and shipped apart, which is the whole
   reason this tool exists as one window:

   * THE GRADE and THE MATTE are baked into portfolio/img/<stem>-*.webp by
     design/plate/build-plate.py. Nothing here can change the file. What this
     page does is run that script's pipeline again, in a canvas, over the same
     input the script starts from — design/plate/<stem>-source.webp, which the
     script writes for exactly this purpose — so that a slider answers in a frame
     instead of in a forty-second re-develop of a 19 MB raw. The answer you keep
     is a block of Python to paste back.
     The grade is FOUR sets of numbers — picture × theme — because the script
     bakes a ladder per theme out of a Grade per picture. A picture on black
     wants its own endpoints rather than more of light's, and opacity cannot say
     that; the car wants its own rather than the plate's, and nothing in the
     stylesheet can say that either. So both switches in the top bar swap which
     grade you are dragging. The matte is not per theme and should not become so:
     it is the shape of the building, which is one photograph either way.
   * THE PLACEMENT is a handful of custom properties in portfolio/styles.css, and
     those are live: the preview is the real page in an iframe with the regraded
     picture dropped into it, so what moves under the type here moves there.
     styles.css declares one more, --fold, which is the bottom edge of the first
     screen and is the datum every picture is scaled to rather than a placement,
     which is why there is no slider for it here.

   A GRADE PER FRAME, PER THEME. build-plate.py has one block of grade constants
   per picture per theme — PLATE_LIGHT, PLATE_DARK, CAR_LIGHT, CAR_DARK, EYE_LIGHT,
   EYE_DARK — so the two switches in the top bar now do the same KIND of thing:
   each swaps which of those grades the sliders are pointed at, and each also swaps
   what you are judging it against. The theme button changes the paper under the
   frame; the picture button changes the frame. The Grade panel says which picture it
   is holding, in its heading, because the whole of the confusion this replaces
   was a slider that looked like it applied to what you were looking at and did
   not.

   One set of numbers ran over both frames until this, on the theory that the two
   should read as one paper stock. They still should, and the thing that makes
   them is the pipeline — the same percentile exposure, the same shoulder, the
   same desaturation toward the same tint — which is still one pipeline. What is
   per picture is only where each frame's black and white are pinned, and those
   are absolute: one pair of endpoints cannot be right for a dome that fills its
   frame and a gondola on a wire.

   The picture you have switched to is the one regraded live in the preview. The
   other stays exactly as it shipped — it is whatever the last run of the script
   put in portfolio/img/, which is the honest thing for it to be while you are
   not looking at it, and it means the frame only ever carries one canvas. Which
   is also why the grade rows swap rather than doubling up into two panels: a
   grade you cannot see regraded is not one you can judge, and this tool's whole
   premise is that you judge it on the page.

   Both pictures' grades are read on boot, though, not just the one on screen, so
   a session that tunes the plate and then the car exports both blocks. See
   loadGrades().

   You cannot judge the grade without the placement. A grade read at 100% on a
   white field is a different photograph from the same grade at 0.12 behind a
   column of Sitka, and it is the second one that ships — hence the default view.

   WHERE THIS IS AND IS NOT THE TRUTH
   The pipeline below is a transcription of build-plate.py, stage for stage, and
   the constants are its constants. It parts company in four places, all of them
   noted again at the point they happen:
     * eight bits and a lossy source file, against float32 off the raw;
     * the grade runs at the source's 900px rather than at full width and then
       downsampling, so the shipped curve is a shade smoother than this one;
     * the grain is a different pseudo-random stream, so it is the right strength
       and the wrong pattern, and it is the wrong size too (see NEUTRAL SOURCE in
       build-plate.py);
     * the exposure percentile is read off a 4096-bin histogram rather than a
       sort, which moves it by less than a thousandth of a stop.
   None of the four is visible at --plate-opacity. All four mean this is where
   you decide a number, not where you check one — for that, run the script and
   look at the page.
   ========================================================================== */
"use strict";

var LUTN = 4096;          /* steps in the tone-curve lookup — see buildLUT */
var HIST = 4096;          /* bins in the exposure histogram */
var BLEED = 3;            /* px of sky painted over with the building beside it */

/* ---- what build-plate.py says today -------------------------------------- */
/* Not a table of literals: plate-source.json is written by the script in the
   same run that writes the source image, so "was" here is what the plate on the
   page actually is, and there is no second copy of the constants to drift.
   Bounds and labels are this tool's own — they are a question of what is worth
   dragging through, which the script has no opinion about.
   dp: how many decimals the exported Python carries, so the block reads like the
   block it replaces rather than like a float. */
var GRADE = [
  { k: "EXPOSURE_PCT",    label: "exposure %ile", min: 90, max: 99.99, step: 0.01, dp: 2,
    tip: "Which percentile of the building's brightness is driven to the exposure below.\nHigh enough to mean the sunlit stone; short of 100 so one specular highlight cannot set the whole frame." },
  { k: "EXPOSURE_TARGET", label: "exposure",      min: 0.1, max: 0.8,  step: 0.005, dp: 3,
    tip: "Where that percentile lands, in linear light, before any tone curve.\nThis is the brightness knob. Everything below shapes what it hands over." },
  { k: "SAT_KEEP",        label: "colour kept",   min: 0,   max: 1,    step: 0.01, dp: 2,
    tip: "Fraction of the original chroma left in.\n0 is a duotone: the tint below is then the only colour in the picture.\n1 keeps the day as it was, and the tint rides on top of it." },
  { k: "CONTRAST",        label: "contrast",      min: 0,   max: 1,    step: 0.01, dp: 2,
    tip: "How far the tone curve is blended toward a smoothstep S.\n0 leaves it straight." },
  { k: "HIGHLIGHT_PUSH",  label: "highlight push", min: 1,  max: 2.5,  step: 0.01, dp: 2,
    tip: "Lifts the top of the range without clipping it — it is a power of the INVERSE, so it cannot take anything past white.\n1 is off." },
  { k: "SHADOW",          label: "blacks land on", colour: true,
    tip: "Where black ends up. Lifting it off #000 is what stops the plate reading as a photograph and starts it reading as stock.\nKeep it well short of the ink (#1a1917) or the picture starts competing with the type." },
  { k: "HIGHLIGHT",       label: "whites land on", colour: true,
    tip: "Where white ends up. A hair above the paper (#fcfbf8) and the sunlit stone stays the brightest thing in the corner without glowing." },
  { k: "GRAIN_SIGMA",     label: "grain",         min: 0,   max: 0.03, step: 0.0005, dp: 4,
    tip: "Monochrome, weighted to the mids: none in the lifted blacks, where it would read as sensor noise, and none in the highlights, where it would read as JPEG." },
  /* Not one of build-plate.py's constants, and never will be: it is the two rows
     above moved together, and what it exports is those two colours. It is here
     because "all of it darker" is the one thing neither the pickers nor
     --plate-opacity can say. The pickers cannot because it takes both of them at
     once and by eye, in tandem, in hex. Opacity cannot because the whites land a
     hair ABOVE the paper — at 0.6 the sunlit stone composites to 254,250,240
     against paper of 252,251,248 — so turning it up deepens the shadows and
     warms the highlights and never brings the top of the picture down at all.
     Last in the group rather than beside the endpoints it drives, because the
     rows above it are the pipeline in order and this is not a stage. */
  { k: "LEVEL",           label: "overall level", min: 0.3, max: 1.1, step: 0.005, dp: 3, tool: true,
    tip: "Both endpoints at once, as a fraction of what the file says. The one knob for \"all of it darker\".\nOpacity cannot do this — the whites land just above the paper, so no amount of it brings the sunlit stone down.\n1 is the file's own two colours. It exports as those colours, not as itself." }
];

/* Brightness is the whole test on this frame — there is no blueness slider, and
   there was one here until the photograph changed. The sky is a hazy backlit
   white and the dome's stone, lit by it, is the BLUER of the two; a blueness
   floor would knock out the building and keep the sky. build-plate.py's
   constants block has the measurements. */
var MATTE = [
  { k: "SKY_LUMA_MIN",  label: "bright seed", min: 0.02, max: 0.30, step: 0.002, dp: 3,
    tip: "How bright a pixel must be to START a patch of sky.\nThis is the confident test. The sky sits at 0.10–0.18 and nothing built gets past 0.15." },
  { k: "SKY_LUMA_LOW",  label: "dim spread", min: 0.01, max: 0.20, step: 0.0025, dp: 3,
    tip: "How bright it must be to STAY in one it already touches.\nThe top corner of the sky falls to 0.083 — this is what carries the matte into it without opening the tower's sunlit lead, which is brighter still but touches nothing that seeds." },
  { k: "SKY_EDGE_BLUR", label: "edge softness", min: 0, max: 4,  step: 0.1, dp: 1,
    tip: "Blur on the alpha, in output pixels, so the roofline does not stair-step.\nApproximated here by three box passes; the script uses a real Gaussian." }
];

/* The CSS half, one table per picture. `dark` marks the rows that are declared
   twice in styles.css — every picture needs more of itself on black — so they are
   held, exported and probed per theme rather than shared.

   Every row here has to be a value getComputedStyle can hand back as a NUMBER,
   because that is how probe() reads what a row has moved FROM. That rules out
   --plate-w, --car-w and --eye-w, which are min(calc(…), 2400px) expressions and
   come back as their own text: the size control is --plate-fill / --car-fill /
   --eye-fill, the share of the first screen the picture is drawn across, which is
   the thing that is actually written down in the sheet anyway. */
var PLACE = [
  { k: "--plate-opacity", label: "opacity", unit: "",   min: 0, max: 0.6, step: 0.005, dp: 3, dark: true,
    tip: "The one number that decides whether this is paper stock or a picture.\nThe moment you notice it as a photograph it is too strong." },
  { k: "--plate-fill", label: "width ÷ band",  unit: "", min: 0.2, max: 1.6, step: 0.001, dp: 3,
    tip: "How wide the picture is drawn, as a share of the band between the top of the page and the fold. Height follows the file's own aspect, so this is the size control and there is only one.\nA share and not a length: both edges the plate is pinned by are held at every window height, and a taller window simply gets a bigger plate. It is also the control for how far down the frame the top of the band cuts — raise it and the vane climbs out of the top of the page, lower it and empty sky opens above it." },
  { k: "--plate-x", label: "out from left", unit: "px", min: -400, max: 400, step: 1, dp: 0,
    tip: "Positive moves it right, off the page's left edge." },
  { k: "--plate-y", label: "up from the fold", unit: "px", min: -1600, max: 1200, step: 1, dp: 0,
    tip: "Positive lifts it off --fold, the bottom of the first screen.\nNegative hangs it PAST that line and down into the second screen — the box grows with it, so nothing is cut off there any more.\nIt shortens the band as it goes, so the picture shrinks with it: --plate-fill is a share of what is left." },
  { k: "--plate-crop", label: "crop the foot", unit: "", min: 0, max: 0.9, step: 0.005, dp: 3,
    tip: "Cuts the BOTTOM off the picture — the rooftops and the glass in front of the dome.\nA share of the plate's width rather than a length of its own, so it survives the size being re-tuned without having to be re-measured after it.\nIt shortens the picture where it stands; it does not move it. Use 'up from the fold' for that." }
];

/* The car is anchored by one corner where the plate is anchored by two edges, so
   it is a shorter list with one row the plate has no use for — the dissolve. */
var CAR = [
  { k: "--car-opacity", label: "opacity", unit: "", min: 0, max: 0.6, step: 0.005, dp: 3, dark: true,
    tip: "Its own, not the plate's, though the two hold the same number today.\nTwo pictures with two different amounts of dark in them: the day one of them needs a nudge is the day sharing the variable would have been the bug." },
  { k: "--car-fill", label: "width ÷ fold", unit: "", min: 0.2, max: 1.6, step: 0.001, dp: 3,
    tip: "Width as a share of the first screen, as --plate-fill is of the band.\nIt has a floor at 0.751 and you can see it: the file is 1.332× as tall as it is wide, so below that the picture's own foot lands above the fold and a horizontal line appears across the pylon in mid-air. Past it the fold does the cutting, which is the page's own edge." },
  { k: "--car-fade", label: "dissolve the inner edge", unit: "", min: 0, max: 0.6, step: 0.005, dp: 3,
    tip: "How much of its own width the LEFT edge — the only edge of it that ends anywhere but a page edge — takes to fade into the paper.\nThe plate has no such control and wants none: its inner edges are empty sky. This frame's is the gantry, cut clean across, and at this opacity a straight vertical line is the one thing that reads as a crop.\n0 is a hard edge. Watch it against 'the plate' view, where it is at full strength." },
  { k: "--car-x", label: "out from right", unit: "px", min: -400, max: 400, step: 1, dp: 0,
    tip: "Positive moves it left, in off the page's right edge." },
  { k: "--car-y", label: "down from the top", unit: "px", min: -1200, max: 1200, step: 1, dp: 0,
    tip: "Positive pushes it down the page, away from the corner it is anchored in.\nUnlike the plate's, this does not resize anything — the car's box is the whole first screen either way." },
  { k: "--car-crop", label: "crop the head", unit: "", min: 0, max: 0.9, step: 0.005, dp: 3,
    tip: "Cuts the TOP off the picture — the gantry — which is the corner it is anchored to, so it is the mirror of the plate's crop and not a second copy of it.\nA share of the car's width, for the same reason: it survives the size being re-tuned." }
];

/* The eye is the car's anchoring — one corner, one rule, sized against the fold —
   with the plate's geometry at the bottom of the page and the plate's want of a
   dissolve, which is none: both its inner edges are empty sky in this frame. So it
   is the car's list with the fade row dropped and the two vertical rows pointing
   the other way. `out from right` is the row that matters most here, because the
   frame is not mirrored and it is what stands the subject in the corner. */
var EYE = [
  { k: "--eye-opacity", label: "opacity", unit: "", min: 0, max: 0.6, step: 0.005, dp: 3, dark: true,
    tip: "Its own, as the other two are their own, and holding the same number today.\nThis frame is a steel lattice with sky through it rather than a solid mass, so it carries less ink than either at the same setting — which is an argument for reading it against them here rather than assuming the shared value is still right." },
  { k: "--eye-fill", label: "width ÷ fold", unit: "", min: 0.1, max: 1.2, step: 0.001, dp: 3,
    tip: "Width as a share of the first screen, as --car-fill is.\nWhat it really sets is how tall the mast stands: the mast is 87.6% of the frame, so 1.167× this width. It has a ceiling the car sets rather than the file — much past 0.39 the top of the mast arrives under the gondola and the two read as one machine. Watch the gap between them, not the size." },
  { k: "--eye-x", label: "out from right", unit: "px", min: -400, max: 400, step: 1, dp: 0,
    tip: "Positive moves it left, in off the page's right edge.\nNegative today, and load-bearing rather than a nudge: the frame is not mirrored, so the subject sits in the left three-fifths of the file and the right two-fifths is sky. This is what pushes that dead margin off the page and puts the cable stays in the corner. Drag it toward 0 and the whole picture walks in off the edge, leaving white where the corner should be." },
  { k: "--eye-y", label: "up from the fold", unit: "px", min: -1200, max: 1200, step: 1, dp: 0,
    tip: "Positive lifts it off --fold, the bottom of the first screen; negative hangs it past that line.\nUnlike the plate's, this does not resize anything — --eye-fill is a share of the fold, not of what --eye-y leaves." },
  { k: "--eye-crop", label: "crop the foot", unit: "", min: 0, max: 0.9, step: 0.005, dp: 3,
    tip: "Cuts the BOTTOM off the picture — the foot of the mast and the base of the A-frame. The plate's crop, in the plate's direction, because this picture is anchored at the bottom too.\n0 today: the foot is already the frame's own edge standing on the fold, and the two edges landing together read as one." }
];

var MATTE_GROUP = { name: "Sky matte", rows: MATTE, py: true,
  note: "No sky is wanted, only the building — the page's own paper is the sky. Watch this one in the matte view." };
var GROUPS = [
  /* `dark` and `pic` on the GROUP and not on a row: the whole grade varies on both
     axes, because build-plate.py holds a Grade per picture and bakes a ladder per
     theme out of it. A picture on black wants its own endpoints rather than more of
     light's, and the car wants its own rather than the plate's. So every row below
     is held, previewed and exported once per picture per theme, and the two buttons

  for (var i = 0, q = 0, o = 0; i < N; i++, q += 3, o += 4) {
    var y = luma[i];
    /* exposure and desaturation in linear light, in one expression: the script's
       scale-then-mix-toward-luma, with the mix written out. */
    var xr = (y + (lin[q]     - y) * keep) * scale;
    var xg = (y + (lin[q + 1] - y) * keep) * scale;
    var xb = (y + (lin[q + 2] - y) * keep) * scale;
    xr = xr < 0 ? 0 : xr > 1 ? 1 : xr;
    xg = xg < 0 ? 0 : xg > 1 ? 1 : xg;
    xb = xb < 0 ? 0 : xb > 1 ? 1 : xb;

    var vr = sr + dr * lutT[(xr * LUTN) | 0];
    var vg = sg + dg * lutT[(xg * LUTN) | 0];
    var vb = sb + db * lutT[(xb * LUTN) | 0];

    if (sigma) {
      var grey = 0.2126 * vr + 0.7152 * vg + 0.0722 * vb;
      var w = 4 * grey * (1 - grey);
      var n = noise[i] * sigma * (w < 0 ? 0 : w > 1 ? 1 : w);
      vr += n; vg += n; vb += n;
    }

    d[o]     = vr < 0 ? 0 : vr > 1 ? 255 : vr * 255;
    d[o + 1] = vg < 0 ? 0 : vg > 1 ? 255 : vg * 255;
    d[o + 2] = vb < 0 ? 0 : vb > 1 ? 255 : vb * 255;
    d[o + 3] = alpha[i];
  }

  /* The bleed reads only pixels the loop above has already written, and every
     source is a building pixel, so one pass over the boundary is the whole job. */
  for (var s = 0; s < N; s++) {
    var from = bleedFrom[s];
    if (from < 0) continue;
    d[s * 4] = d[from * 4]; d[s * 4 + 1] = d[from * 4 + 1]; d[s * 4 + 2] = d[from * 4 + 2];
  }

  cv.width = W; cv.height = H;
  cv.getContext("2d").putImageData(out, 0, 0);
  publish();
}

/* An object URL rather than a data URL: the frame is handed a ~1 MB image on
   every draw, and base64 in a stylesheet would cost a re-parse of the whole
   declaration each time. The old one is revoked after the new one is in, so the
   frame never repaints through a gap. */
function publish() {
  cv.toBlob(function (b) {
    if (!b) return;
    var was = plateURL;
    plateURL = URL.createObjectURL(b);
    inject();
    if (was) URL.revokeObjectURL(was);
  }, "image/png");
}

/* ---- the frame ----------------------------------------------------------- */
var frame = document.getElementById("frame");
var fit = document.getElementById("fit");

/* THE FRAME is first and is the default, and it is the only one of these that
   the numbers in the panel actually mean: the placement is in the pixels of a
   1920×1080 window, so that is the window the plate was composed in and the one
   an edge is judged against. The rest are here for the one thing that still
   varies now that the plate does not — where the COLUMN falls on it, and how
   much of the picture a given window happens to reach.
   "my window" is gone with them. It used to be the honest default, because a
   plate measured in vw was the same composition in any window; now it is just
   an arbitrary viewport that happens to be the size of this panel, which is the
   most misleading thing it could be. */
var SIZES = [
  { k: "frame",   label: "the frame", w: 1920, h: 1080 },
  { k: "desktop", label: "desktop",   w: 1440, h: 900 },
  { k: "laptop",  label: "laptop",    w: 1280, h: 720 },
  { k: "tablet",  label: "tablet",    w: 820,  h: 1180 },
  { k: "mobile",  label: "mobile",    w: 390,  h: 844 }
];
var FRAME = SIZES[0];

/* Scale to fit, rather than size to fit. The frame keeps the viewport it is
   pretending to be and is then shrunk on screen, so what you are looking at is
   the whole of that window at some percentage. Sizing the iframe to the panel
   instead would hand the page a 400px window, and since the plate is 1161.6px
   wide whatever window it is in, the preview would be the top-left corner of the
   picture at 1:1 — every slider still moving something you cannot see. That is
   what this tool did between the plate going to fixed pixels and this function.
   Never scales UP: a 390px phone frame blown up to fill the stage would be a
   picture of nothing, and the point of the small presets is that they are small. */
var scale = 1;
function fitFrame() {
  if (!state.w || !state.h) { state.w = FRAME.w; state.h = FRAME.h; }
  var stage = fit.parentNode;
  var padding = 0.8 * 16 * 2 + 2;           /* .stage padding both sides, + border */
  var availW = Math.max(120, stage.clientWidth - padding);
  var availH = Math.max(120, stage.clientHeight - padding - 22);  /* 22 → scale note */
  scale = Math.min(1, availW / state.w, availH / state.h);
  frame.style.width = state.w + "px";
  frame.style.height = state.h + "px";
  frame.style.transform = "scale(" + scale + ")";
  fit.style.width = Math.round(state.w * scale) + "px";
  fit.style.height = Math.round(state.h * scale) + "px";
  paintScaleNote();
}
/* Said out loud, because a preview at 47% that does not admit it is a preview
   you will measure a 3px nudge in and be wrong. */
function paintScaleNote() {
  var el = document.getElementById("scalenote");
  if (!el) return;
  el.textContent = state.w + " × " + state.h +
    (scale < 1 ? "  ·  shown at " + Math.round(scale * 100) + "%" : "  ·  actual size");
}
function setPreset(k) {
  var s = SIZES.filter(function (x) { return x.k === k; })[0];
  if (!s) return;
  state.preset = k; state.w = s.w; state.h = s.h;
  fitFrame(); save(); paintChrome();
}
window.addEventListener("resize", fitFrame);

function loadFrame() {
  /* Same origin, so the theme the page reads on boot can be primed for it —
     which matters here more than in the type tuner, because the plate is one of
     the two things on this site that is declared differently on black. */
  try { localStorage.setItem("portfolio-theme", state.theme); } catch (_) {}
  frame.src = "/portfolio/?plate=" + Date.now();
  fitFrame();
}

/* The placement defaults are read off the page rather than written down here, so
   this tool cannot disagree with styles.css about what it is changing. Read once
   per theme, on the load that first shows that theme. */
function probe() {
  var doc = frame.contentDocument, win = frame.contentWindow;
  if (!doc || !win || !doc.documentElement) return;
  var cs = win.getComputedStyle(doc.documentElement);
  CSS_ROWS.forEach(function (r) {
    var raw = cs.getPropertyValue(r.k).trim();
    base[keyOf(r)] = raw === "" ? 0 : parseFloat(raw);
    state.place[keyOf(r)] = base[keyOf(r)];
  });
  save();
  paintChrome();
}

/* Injected last and with no !important, so the preview meets the same cascade
   the exported CSS will meet in styles.css. The image is this tool's, though —
   what is on disk is whatever the last run of the script produced, and the whole
   point is to see the grade that has not been baked yet.
   Both pictures' placement goes in every time, because both are on the page at
   once and moving one is judged against the other. Only the picture being graded
   has its file replaced: the background-image is written against that one's own
   selector, and the other is left to the ladder in portfolio/img.
   It has to be background-image and not --plate-src / --car-src, even though
   those are what the sheet reads: index.html sets them as inline styles on
   <html>, and an element style beats any rule this could write. */
function inject() {
  var doc = frame.contentDocument;
  if (!doc || !doc.body || !plateURL) return;
  var tag = doc.getElementById("__plate");
  if (!tag) { tag = doc.createElement("style"); tag.id = "__plate"; }
  var decls = CSS_ROWS.map(function (r) {
    return "  " + r.k + ": " + num(val(r), r.dp) + r.unit + ";";
  }).join("\n");
  tag.textContent =
    ":root {\n" + decls + "\n}\n" +
    picture().sel + " { background-image: url(" + plateURL + "); }\n";
  doc.body.appendChild(tag);
}

/* ---- views --------------------------------------------------------------- */
var sheet = document.getElementById("sheet");
var VIEWS = [
  { k: "page",    label: "on the page" },
  { k: "picture", label: "the picture" },
  { k: "matte",   label: "the matte" }
];

function paintView() {
  var page = state.view === "page";
  /* The wrapper and not the iframe: the border and the scaled box live on the
     wrapper now, so hiding the frame alone would leave an empty bordered rectangle
     sitting over the bare views. */
  fit.hidden = !page;
  document.getElementById("scalenote").hidden = !page;
  document.getElementById("derived").hidden = !page;
  sheet.hidden = page;
  /* Both bare views stand the picture at full strength on the page's own paper —
     this is where the grade itself is legible, and a shoulder or a lifted black
     read at 0.12 cannot be judged at all. The matte view is the same picture
     with the sky lit up in the panel's accent, so the cut edge has something to
     be read against instead of dissolving into the paper it is matched to. */
  sheet.style.background = state.theme === "dark" ? "#000" : "#fcfbf8";
  sheet.style.backgroundImage = state.view === "matte"
    ? "linear-gradient(rgba(216, 167, 106, 0.9), rgba(216, 167, 106, 0.9))"
    : "none";
  if (W) cv.style.width = Math.min(W, 820) + "px";
}

/* ---- the two blocks to paste --------------------------------------------- */
function pyBlock() {
  var gradeMoved = GRADE.filter(function (r) { return !r.tool && movedAnywhere(r); });
  var matteMoved = MATTE.filter(changed);
  if (!gradeMoved.length && !matteMoved.length) {
    return "# nothing in the grade or the matte has moved";
  }
  /* This block's own count, and not the badge's: the badge counts every line to
     paste anywhere, placement included, and those leave in the CSS block. A grade
     row counts once per picture-and-theme it moved in, because that is how many
     numbers in build-plate.py it is asking you to change. */
  var n = matteMoved.length;
  gradeMoved.forEach(function (r) {
    combos(r).forEach(function (c) { if (changedAt(r, c[0], c[1])) n++; });
  });
  var out = [];
  out.push("# " + Array(72).join("─"));
  out.push("# plate-tuner — " + n + " constant" + (n === 1 ? "" : "s") +
           " moved, " + new Date().toISOString().slice(0, 16).replace("T", " "));
  out.push("# Paste over the matching block in build-plate.py, then re-run it");
  out.push("# against the raw. Nothing changes on the site until you do.");
  out.push("# " + Array(72).join("─"));
  if (gradeMoved.length) {
    /* A picture that moved is printed in BOTH themes, in full, even when only one
       of them moved — and the whole call rather than the lines that changed. Two
       reasons, and they are the same reason twice: the file's PLATE_DARK may be
       written as its light's, in which case a light-only edit would silently drag
       dark along with it and the preview you approved on black would not be what
       shipped; and a bare `SHADOW = ...` line does not say which grade it belongs
       to. Spelling the calls out costs a few lines of paste and removes
       both questions. Emitting the two identical is harmless — build-plate.py
       compares them by value, so an untuned dark still writes no ladder.
       A picture that did NOT move is left out entirely, which is the difference the
       picture axis makes: the two are separate calls in the file now, with neither
       written as the other's name, so there is nothing for an untouched car to be
       dragged along by and no reason to hand you its block to paste. */
    PIC_KEYS.forEach(function (p) {
      var movedHere = gradeMoved.some(function (r) {
        return THEMES.some(function (t) { return changedAt(r, p, t); });
      });
      if (!movedHere) return;
      out.push("");
      THEMES.forEach(function (t, i) {
        if (i) out.push("");
        out.push(gradeCall(p, t));
      });
    });
  }
  if (matteMoved.length) {
    /* The matte is shared, so it stays a line at a time — there is only one of
       each and nothing for a theme to disambiguate. */
    if (gradeMoved.length) out.push("");
    matteMoved.forEach(function (r) {
      var line = r.k + " = " + tidy(num(val(r), r.dp), true);
      while (line.length < 40) line += " ";
      out.push(line + "# was " + tidy(num(baseOf(r), r.dp), true));
    });
  }
  return out.join("\n");
}

/* One picture's Grade(...) in one theme, as build-plate.py spells it. Rows that
   have moved carry a `# was`; the rest are printed at the value the file already
   has, so the call is complete and can be pasted over the old one whole.
   The name is built from the two axes rather than passed in — <STEM>_<THEME>, which
   is what build-plate.py calls its four constants — so the block and the call it
   replaces are named by the same rule at both ends. */
function gradeCall(pic, theme) {
  var lines = [pic.toUpperCase() + "_" + theme.toUpperCase() + " = Grade("];
  GRADE.forEach(function (r) {
    if (r.tool) return;
    var kk = keyAt(r, pic, theme);
    var b = base[kk];
    var v = state.vals[kk];
    if (v == null) v = b;
    if (v == null) return;                       /* no source loaded — say nothing */
    var line = "    " + r.k + "=" + (r.colour ? pyTuple(v) : tidy(num(v, r.dp), true)) + ",";
    if (b != null && String(v) !== String(b)) {
      while (line.length < 44) line += " ";
      line += "# was " + (r.colour ? pyTuple(b) : tidy(num(b, r.dp), true));
    }
    lines.push(line);
  });
  lines.push(")");
  return lines.join("\n");
}
function pyTuple(h) {
  return "(" + rgbOf(h).map(function (c) { return "0x" + ("0" + c.toString(16)).slice(-2); }).join(", ") + ")";
}

function cssBlock() {
  var moved = ROWS.filter(function (r) { return r.group.css && movedAnywhere(r); });
  if (!moved.length) return "/* nothing placed differently yet */";
  var bySel = { ":root": [], '[data-theme="dark"]': [] };
  /* A per-theme row can have moved in one theme, the other, or both, and each
     belongs in its own block — so it is emitted once per theme it moved in. */
  moved.forEach(function (r) {
    if (r.dark) {
      THEMES.forEach(function (t) {
        /* state.pic, because no CSS row is per-picture — each picture has its own
           placement rows rather than one set that swaps — so the picture passed
           here is ignored by keyAt() and only has to be a valid one. */
        if (!changedAt(r, state.pic, t)) return;
        bySel[t === "dark" ? '[data-theme="dark"]' : ":root"].push(decl(r, t));
      });
    } else {
      bySel[":root"].push(decl(r, null));
    }
  });
  var out = [];
  Object.keys(bySel).forEach(function (sel) {
    if (!bySel[sel].length) return;
    out.push(sel + " {");
    bySel[sel].forEach(function (l) { out.push(l); });
    out.push("}");
  });
  return out.join("\n");
}
/* changed(), asked about a named picture and theme instead of the ones on screen.
   Through keyAt() rather than by building the key here, so a row that varies on
   only one of the two axes is asked the right question. */
function changedAt(r, pic, theme) {
  var kk = keyAt(r, pic, theme), v = state.vals[kk], b = base[kk];
  return v != null && b != null && String(v) !== String(b);
}
function decl(r, theme) {
  var kk = axisKey(r.k, null, theme);   /* no CSS row is per-picture; see cssBlock */
  var line = "  " + r.k + ": " + tidy(num(state.vals[kk], r.dp)) + r.unit + ";";
  while (line.length < 34) line += " ";
  return line + "/* was " + tidy(num(base[kk], r.dp)) + r.unit + " */";
}

/* ---- panel --------------------------------------------------------------- */
var controls = document.getElementById("controls");

function buildPanel() {
  controls.innerHTML = "";
  GROUPS.forEach(function (g) {
    /* Rows are still built for a hidden group — only the box is left out of the
       page. They stay addressable, so val() and the saved state keep working
       without knowing which panels happen to be on screen. */
    var box = document.createElement("div");
    box.className = "g" + (state.shut[g.name] ? " shut" : "");
    var head = document.createElement("button");
    head.type = "button"; head.className = "ghead";
    /* `head` when a group's title depends on what it is currently pointed at, which
       the Grade one does now that its rows swap with the picture. `name` stays the
       stable identity underneath — it is what state.shut is keyed on, so a panel you
       collapsed does not spring open when you switch pictures. */
    head.textContent = g.head ? g.head() : g.name;
    head.addEventListener("click", function () {
      state.shut[g.name] = !state.shut[g.name];
      box.classList.toggle("shut"); save();
    });
    box.appendChild(head);
    var body = document.createElement("div");
    body.className = "gbody";
    if (g.note) {
      var note = document.createElement("p");
      note.className = "gnote"; note.textContent = g.note;
      body.appendChild(note);
    }
    g.rows.forEach(function (r) { body.appendChild(rowEl(r)); });
    box.appendChild(body);
    if (!g.hidden) controls.appendChild(box);
  });
}

function rowEl(r) {
  var el = document.createElement("div");
  el.className = "row";
  var lab = document.createElement("label");
  lab.textContent = r.label;
  if (r.tip) lab.title = r.tip;
  el.appendChild(lab);

  if (r.colour) {
    var col = document.createElement("input");
    col.type = "color";
    var txt = document.createElement("input");
    txt.type = "text";
    col.addEventListener("input", function () { set(r, hex(col.value)); });
    txt.addEventListener("change", function () {
      if (/^#[0-9a-fA-F]{6}$/.test(txt.value)) set(r, hex(txt.value));
      else paintChrome();
    });
    el.appendChild(col); el.appendChild(txt);
    r.col = col; r.txt = txt;
  } else {
    var rng = document.createElement("input");
    rng.type = "range"; rng.min = r.min; rng.max = r.max; rng.step = r.step;
    var box = document.createElement("input");
    box.type = "number"; box.min = r.min; box.max = r.max; box.step = r.step;
    rng.addEventListener("input", function () { set(r, +rng.value); });
    box.addEventListener("input", function () {
      if (box.value !== "" && isFinite(+box.value)) set(r, +box.value);
    });
    el.appendChild(rng); el.appendChild(box);
    r.rng = rng; r.box = box;
  }

  var undo = document.createElement("button");
  undo.type = "button"; undo.className = "undo"; undo.textContent = "↺";
  undo.title = "back to what the source says";
  undo.addEventListener("click", function () { set(r, null); });
  el.appendChild(undo);
  r.el = el;
  return el;
}

/* One entry point for every change, so there is exactly one place that decides
   what a change costs. A matte constant rebuilds the matte and the histogram; a
   grade constant does not; a placement row touches no pixels at all and only
   rewrites the frame's stylesheet. */
function set(r, v) {
  var kk = keyOf(r);
  if (v == null) delete state.vals[kk]; else state.vals[kk] = v;
  if (r === LEVEL_ROW) applyLevel();
  save();
  paintChrome();
  if (r.group.css) { inject(); paintDerived(); } else schedule();
}

/* ---- the two edges you are actually judging ------------------------------
   Neither of them is a slider, and after the plate went to fixed pixels both
   became worth reading off a number rather than off the preview: they are the
   same on every display now, so they are facts about the design and not about
   the window you happen to have open.
     top    = (--plate-fold - --plate-y) + --plate-crop×w - height
     right  = --plate-x + w                     (height = w × the file's aspect)
   The first is the one that is hard to hold in your head — --plate-y moves the
   plate's FOOT, and the crop then pushes the foot down without moving the head,
   so the top edge is three of the four sliders at once. It is also the edge that
   reads first, being the one that meets the column.
   The aspect comes from the source image the tool has already loaded rather than
   from the shipped rungs; they agree to within 0.05%, which is a third of a pixel
   here and well under what a slider can express. */
function rowFor(k) { return PLACE.filter(function (r) { return r.k === k; })[0]; }
function placed(k) { var r = rowFor(k); return r ? val(r) : 0; }
function foldOf() {
  var doc = frame.contentDocument, win = frame.contentWindow;
  if (!doc || !win || !doc.documentElement) return 0;
  return parseFloat(win.getComputedStyle(doc.documentElement).getPropertyValue("--plate-fold")) || 0;
}
function paintDerived() {
  var el = document.getElementById("derived");
  if (!el) return;
  var fold = foldOf();
  if (!fold || !W || !H) { el.textContent = ""; return; }
  var w = placed("--plate-w"), foot = fold - placed("--plate-y");
  var top = foot + placed("--plate-crop") * w - w * (H / W);
  el.textContent =
    "top edge " + Math.round(top) + "px down the page  ·  " +
    "right edge at " + Math.round(placed("--plate-x") + w) + "px  ·  " +
    "foot cut at " + Math.round(foot) + "px";
}

/* What "overall level" actually does: write the two endpoint rows. So it needs no
   stage of its own in drawPlate, nothing in plate-source.json, and nothing in
   build-plate.py — the block to paste is the two colour lines it has moved, which
   is what the tool would have printed if you had picked them by hand.
   Absolute, and anchored on the file's own two colours rather than on wherever the
   pickers currently sit: dragging back to 1 therefore lands exactly on the file
   again, and a hundred drags do not walk away from it eight bits at a time the way
   a multiply-what-is-there would. The cost is that it OVERWRITES a hand-picked
   endpoint, which is the honest bargain for one knob driving two — and the
   swatches move under the slider as it goes, so it is never a silent one. */
function applyLevel() {
  var f = +val(LEVEL_ROW);
  /* The picture and theme on screen only, and anchored on THAT grade's own two
     colours: the slider is itself per-picture and per-theme, so dragging it on the
     car in black is a statement about CAR_DARK and must reach none of the other
     three. keyOf() rather than a key built here, so it follows the rows. */
  END_ROWS.forEach(function (r) {
    var kk = keyOf(r);
    state.vals[kk] = "#" + rgbOf(base[kk]).map(function (c) {
      c = Math.round(c * f);
      return ("0" + (c < 0 ? 0 : c > 255 ? 255 : c).toString(16)).slice(-2);
    }).join("");
  });
}

/* Coalesced to one draw per frame: a range input fires on every pixel of the
   drag, and the grade is a pass over a million of them. */
var pending = null;
function schedule() {
  if (pending) return;
  pending = requestAnimationFrame(function () {
    pending = null;
    var t0 = performance.now();
    drawPlate();
    say(Math.round(performance.now() - t0) + " ms");
  });
}

function paintChrome() {
  ROWS.forEach(function (r) {
    var v = val(r);
    if (v == null) return;
    r.el.classList.toggle("on", changed(r));
    if (r.colour) {
      if (document.activeElement !== r.col) r.col.value = String(v);
      if (document.activeElement !== r.txt) r.txt.value = String(v);
    } else {
      if (document.activeElement !== r.rng) r.rng.value = v;
      if (document.activeElement !== r.box) r.box.value = num(v, r.dp);
    }
  });
  var n = changeCount();
  var badge = document.getElementById("count");
  badge.textContent = n; badge.setAttribute("data-n", n);
  document.getElementById("outpy").value = pyBlock();
  document.getElementById("outcss").value = cssBlock();
  [].forEach.call(document.querySelectorAll("#views button"), function (b) {
    b.setAttribute("aria-pressed", b.dataset.k === state.view ? "true" : "false");
  });
  [].forEach.call(document.querySelectorAll("#sizes button"), function (b) {
    b.setAttribute("aria-pressed", b.dataset.k === state.preset ? "true" : "false");
  });
  [].forEach.call(document.querySelectorAll("#pics button"), function (b) {
    b.setAttribute("aria-pressed", b.dataset.k === state.pic ? "true" : "false");
  });
}

var sayTimer = null;
function say(msg) {
  var el = document.getElementById("stat");
  el.textContent = msg;
  clearTimeout(sayTimer);
  sayTimer = setTimeout(function () { el.textContent = ""; }, 1600);
}

/* ---- chrome -------------------------------------------------------------- */
function chips(host, items, isOn, pick) {
  items.forEach(function (it) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.k = it.k; b.textContent = it.label;
    b.setAttribute("aria-pressed", isOn(it) ? "true" : "false");
    b.addEventListener("click", function () { pick(it); });
    host.appendChild(b);
  });
}

/* Which frame the grade is drawn on, and therefore which of the two the preview
   is showing live. Not which numbers you are dragging — see A GRADE PER FRAME,
   PER THEME at the top. The old canvas is left in place until the new one has been
   decoded and drawn, so the switch never blanks the frame. */
chips(document.getElementById("pics"), SOURCES,
  function (it) { return it.k === state.pic; },
  function (it) {
    if (it.k === state.pic) return;
    state.pic = it.k; save();
    /* Straight away, not on the fetch loadPicture() is about to do: the rows have
       already swapped to this picture's grade — keyOf() reads state.pic — and the
       heading that says which picture they are is the whole point of the switch
       being visible. loadPicture() builds the panel again when it knows whether the
       matte half exists; this is the half that must not wait for a round trip. */
    buildPanel();
    paintChrome();
    loadPicture(it.k);
  });

chips(document.getElementById("views"), VIEWS,
  function (it) { return it.k === state.view; },
  function (it) { state.view = it.k; save(); paintView(); paintChrome(); });

chips(document.getElementById("sizes"), SIZES,
  function (it) { return it.k === state.preset; },
  function (it) { setPreset(it.k); });

document.getElementById("theme").addEventListener("click", function () {
  state.theme = state.theme === "dark" ? "light" : "dark";
  save();
  loadFrame();          /* the page reads the theme on boot, so it is a reload */
  paintView(); paintChrome();
  /* And re-grade, which it did not have to while the two themes shared one set
     of numbers. They no longer do: this button now swaps the photograph as well
     as the paper it is standing on, and the canvas is the only thing that can
     say what the other one looks like. */
  schedule();
});

document.getElementById("resetall").addEventListener("click", function () {
  if (!changeCount() || !confirm("Put every slider back to what the files say?")) return;
  state.vals = {};
  save(); paintChrome(); schedule(); inject(); paintDerived();
});

[].forEach.call(document.querySelectorAll("[data-copy]"), function (b) {
  b.addEventListener("click", function () {
    var t = document.getElementById(b.dataset.copy);
    t.select();
    navigator.clipboard.writeText(t.value).then(function () { say("copied"); },
      function () { document.execCommand("copy"); say("copied"); });
  });
});

frame.addEventListener("load", function () { probe(); inject(); paintDerived(); });

/* ---- boot ---------------------------------------------------------------- */
function warn(html) { document.getElementById("warn").innerHTML = html; }

/* A <stem>-source.json keys its grade by theme, because build-plate.py bakes one
   per theme. The picture is not a key inside the file — the FILE is the picture —
   so which one it belongs to is passed in, and that is where the second half of
   the key comes from.
   A file written by an older build has no `light` key and carries a single flat
   grade instead — that one becomes the base for BOTH themes here, which is exactly
   what its single ladder was on the page. Worth the four lines: the JSON is a build
   artefact and is not always regenerated in the same commit that changes the
   script, so the tuner would otherwise open on a panel of undefineds any time the
   two were briefly out of step. plate-source.json is in exactly that state as this
   lands, being older than the per-theme grade it predates. */
function readGrade(pic, g) {
  var perTheme = (g && g.light) ? g : { light: g, dark: g };
  THEMES.forEach(function (t) {
    var src = perTheme[t] || perTheme.light;
    if (!src) return;
    Object.keys(src).forEach(function (k) { base[axisKey(k, pic, t)] = src[k]; });
  });
}

/* Every picture's grade, on boot, whichever one you are looking at.
   The export and the badge have to answer for all of them at once — a session that
   tunes the plate, switches to the car and tunes that has two blocks to paste — and
   `changed` is a comparison against a base, so a grade with no base loaded can
   neither show as moved nor reach the export. Reading only the picture on screen
   would therefore drop the others' edits out of the block the moment you switched,
   which is the per-picture version of the bug the per-theme bases were held for.
   Failures are swallowed: this is the export's completeness and not the tool's
   ability to run, loadPicture() reports the missing file for the picture that
   actually needs one, and one absent car-source.json should not stop you grading
   the plate. */
function loadGrades() {
  return Promise.all(SOURCES.map(function (s) {
    return fetch(s.stem + "-source.json?" + Date.now()).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (meta) {
      if (meta) readGrade(s.k, meta.grade);
    }).catch(function () {});
  }));
}

/* One picture's source pair, fetched and decoded. Called on boot and again on
   every switch, which is why it puts the panel back together each time: whether
   the matte half exists at all is a property of the source that just arrived, not
   of the tool, and the Grade panel's heading names the picture that just became
   the current one. This picture's grade constants are re-read too — both themes' —
   which loadGrades() has already done once on boot; doing it again here is what
   makes an edit to the JSON land on a switch rather than only on a reload. */
function loadPicture(k) {
  var stem = (SOURCES.filter(function (s) { return s.k === k; })[0] || SOURCES[0]).stem;
  warn("");
  return fetch(stem + "-source.json?" + Date.now()).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (meta) {
    META = meta;
    readGrade(k, meta.grade);
    /* null when the source arrived cut. The rows then have no base to be `was`,
       which is also why they cannot show as moved and cannot reach the export. */
    hasOwnMatte = !meta.matte;
    MATTE_GROUP.hidden = hasOwnMatte;
    if (!hasOwnMatte) Object.keys(meta.matte).forEach(function (k2) { base[k2] = meta.matte[k2]; });
    buildPanel();   /* again, now that it is known whether the matte panel exists */
    return new Promise(function (done, fail) {
      var img = new Image();
      img.onload = function () { done(img); };
      img.onerror = function () { fail(new Error("image")); };
      img.src = meta.source + "?" + Date.now();
    });
  }).then(function (img) {
    decode(img);
    paintView();          /* the bare views can only be sized once there is a size */
    paintChrome();
    schedule();
    paintDerived();       /* it needs the file's aspect, which decode() has just set */
  }).catch(function (e) {
    /* Both failures land here and both have the same two causes, so say both. */
    warn("<strong>No source to grade.</strong> This tool needs " +
         "<code>design/plate/" + stem + "-source.webp</code> and <code>" + stem +
         "-source.json</code>, which <code>build-plate.py</code> writes beside itself — " +
         "run it once against the source frame. " +
         "And it has to be served, not opened off the disk: <code>run.bat</code>, then " +
         "<code>localhost:8000/design/plate/plate-tuner.html</code>. (" + e.message + ")");
  });
}

function boot() {
  buildPanel();
  paintView();
  loadFrame();
  /* The other pictures' grades are wanted for the export and the badge, and the
     current one's is wanted before anything can be drawn — so every base is read
     first and the frame that needs one is loaded after. Ordered rather than
     fired together because both write `base`, and loadPicture()'s pass for the
     picture on screen should be the one that wins. */
  loadGrades().then(function () { loadPicture(state.pic); });
}

boot();
</script>
</body>
</html>
