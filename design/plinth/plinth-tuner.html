<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel tuner — the marble, the wording, the glass, the exit</title>
  <style>
    :root { color-scheme: light dark; --ui: #1a1917; --ui-bg: #fcfbf8; --ui-panel: #f5f2ea; --ui-line: #d6d0c4; --ui-mut: #6f6a5d; --ui-hit: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --ui: #eaeaea; --ui-bg: #161616; --ui-panel: #1e1e1e; --ui-line: #3a3a3a; --ui-mut: #9a9a9a; --ui-hit: #d8a76a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      background: var(--ui-bg); color: var(--ui);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    /* ---- top bar ---------------------------------------------------------- */
    .top {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ui-line);
    }
    .top strong { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .grow { flex: 1 1 auto; }
    button, select, input[type="text"], input[type="number"], textarea {
      font: inherit; color: var(--ui); background: transparent;
      border: 1px solid var(--ui-line); border-radius: 5px;
    }
    select, input[type="text"], input[type="number"], textarea { background: var(--ui-bg); color-scheme: light dark; }
    input[type="number"] { width: 4.4rem; padding: 0.18rem 0.3rem; }
    button { padding: 0.24rem 0.55rem; cursor: pointer; }
    button:hover { border-color: var(--ui-mut); }
    button[aria-pressed="true"] { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    .badge { padding: 0.1rem 0.4rem; border-radius: 99px; background: var(--ui-hit); color: var(--ui-bg); font-size: 11px; }
    .badge[data-n="0"] { background: transparent; color: var(--ui-mut); }
    .ms { font: 11px/1 ui-monospace, Consolas, monospace; color: var(--ui-mut); min-width: 7rem; }
    /* The top bar is the one strip of this page that never scrolls, so it is
       the only place a stone can be changed with the plinth still in view. */
    #pick { max-width: 15rem; padding: 0.18rem 0.3rem; }
    #prev, #next { padding: 0.24rem 0.45rem; }
    #pos { min-width: 3.4rem; }

    /* ---- layout ----------------------------------------------------------- */
    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .side { flex: 0 0 24rem; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--ui-line); background: var(--ui-panel); }
    .controls { flex: 1 1 auto; overflow: auto; padding-bottom: 0.6rem; }
    .stage { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: auto; padding: 0.6rem; gap: 0.6rem; }
    iframe { border: 1px solid var(--ui-line); background: #fff; flex: 0 0 auto; }
    .warn { margin: 0; padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--ui-line); background: rgba(216, 167, 106, 0.16); font-size: 11.5px; }
    .warn:empty { display: none; }

    /* ---- the contact strip ------------------------------------------------
       Every candidate at the same width, stacked, so two stones are compared by
       looking down rather than by remembering. The live one is a canvas in the
       same list and at the same width as the plates, which is what makes the
       preview answerable against a render instead of merely pretty.

       THE STRIP IS CAPPED AND SCROLLS INSIDE ITSELF, and that is what keeps the
       preview on screen. Twenty-three stones at plate width is some three
       thousand pixels of contact sheet, and while the strip sized to its
       content the iframe under it began two screens down — so picking a stone
       meant scrolling up, clicking, and scrolling back down to see what it did,
       with the answer off screen at the moment it changed. Drag the strip's
       bottom edge to trade it against the preview; the picker in the top bar
       cycles without either. */
    .sheet { flex: 0 0 auto; border: 1px solid var(--ui-line); background: var(--ui-panel);
             height: 34vh; min-height: 3rem; overflow: auto; resize: vertical; }
    .sheet[hidden] { display: none; }
    .sheet ol { list-style: none; margin: 0; padding: 0; }
    .sheet li { border-top: 1px solid var(--ui-line); }
    .sheet li:first-child { border-top: 0; }
    .sheet button {
      display: block; width: 100%; padding: 0.3rem 0.4rem 0.4rem; border: 0; border-radius: 0;
      background: transparent; text-align: left; cursor: pointer;
    }
    .sheet button:hover { background: rgba(138, 90, 43, 0.09); }
    .sheet button[aria-pressed="true"] { background: rgba(138, 90, 43, 0.16); }
    .sheet button[aria-pressed="true"] .nm { color: var(--ui-hit); }
    .sheet .nm { font: 11px/1.5 ui-monospace, Consolas, monospace; letter-spacing: 0.03em; }
    .sheet .ti { color: var(--ui-mut); font-size: 11px; }
    .sheet .un { color: var(--ui-hit); }
    /* The plates are 3000x269 and are drawn here at whatever width is going: a
       plate is stretched to its box on the page too, so this is the same lie the
       stylesheet tells and not a new one. */
    .sheet img, .sheet canvas { display: block; width: 100%; height: auto; margin-top: 0.15rem; background: #0d0d0d; }
    .sheet img { aspect-ratio: 3000 / 269; }

    /* ---- groups + rows ---------------------------------------------------- */
    .ghead {
      width: 100%; display: flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.7rem; border: 0; border-top: 1px solid var(--ui-line);
      border-radius: 0; background: transparent; text-align: left;
      font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut);
    }
    .ghead:hover { color: var(--ui); }
    .ghead .caret { font-size: 9px; }
    .gbody { padding: 0.1rem 0.7rem 0.5rem; }
    .gbody[hidden] { display: none; }
    .row { display: grid; grid-template-columns: 8.6rem 1fr 4.2rem; align-items: center; gap: 0.35rem; padding: 0.1rem 0; }
    .row > label { font-size: 11.5px; color: var(--ui-mut); cursor: help; }
    .row.moved > label { color: var(--ui-hit); font-weight: 600; }
    .row input[type="range"] { width: 100%; min-width: 0; accent-color: var(--ui-hit); }
    .row output { font: 11px/1 ui-monospace, Consolas, monospace; text-align: right; }
    .row input[type="color"] { width: 100%; height: 1.5rem; padding: 0; border: 1px solid var(--ui-line); background: transparent; }
    .row input[type="checkbox"] { justify-self: start; width: 1rem; height: 1rem; accent-color: var(--ui-hit); }
    /* The three treatments, one chip apart — design/glass-tuner.html's own
       control for the same question, so the two pages ask it the same way and a
       decision made in one is recognisable in the other. */
    .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .chips button { padding: 0.16rem 0.42rem; font-size: 11px; }
    .vhead { display: flex; align-items: center; gap: 0.35rem; margin: 0.5rem 0 0.15rem; }
    .vhead span { flex: 1 1 auto; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ui-mut); }
    .vhead button { padding: 0.1rem 0.4rem; font-size: 11px; }
    .note { margin: 0.4rem 0.7rem 0; padding: 0.4rem 0.5rem; border-left: 2px solid var(--ui-line); color: var(--ui-mut); font-size: 11px; }

    /* ---- the exit strip ----------------------------------------------------
       The scrub is the one control on this page that is a POSITION IN TIME
       rather than a value, so it gets the whole width the three chip rows leave
       and sits on the strip that never scrolls. -1 is a Panel that has not
       arrived, +1 one that has left, and the middle is the composition as it is
       drawn. */
    .exitrow { display: flex; align-items: center; gap: 0.3rem; }
    .exitrow > strong { flex: 0 0 auto; }
    #scrub { flex: 1 1 12rem; min-width: 8rem; accent-color: var(--ui-hit); }
    #presence { font: 11px/1 ui-monospace, Consolas, monospace; color: var(--ui-mut); min-width: 15rem; }
    #presence.thin { color: var(--ui-hit); }

    /* THE TWO COMPOSITIONS, ONE OVER THE OTHER, which is the only arrangement
       that answers the question the crossing asks: is there ever a moment when
       neither is on the screen. Side by side would show two Panels and no
       crossing. The incoming copy takes no pointer events — it is a picture of
       what is arriving, not a second page to drive. */
    .pair { position: relative; flex: 0 0 auto; align-self: flex-start; }
    .pair iframe { display: block; }
    #ghost {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; background: transparent;
    }
    #ghost[hidden] { display: none; }

    /* ---- export drawer ---------------------------------------------------- */
    .drawer { flex: 0 0 auto; border-top: 1px solid var(--ui-line); background: var(--ui-panel); }
    .drawer > .ghead { border-top: 0; }
    .out { padding: 0 0.7rem 0.6rem; }
    .out + .out { padding-top: 0; }
    .out h3 { margin: 0.3rem 0 0.2rem; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ui-mut); }
    textarea { width: 100%; padding: 0.4rem; resize: vertical; font: 11px/1.45 ui-monospace, Consolas, monospace; white-space: pre; }
  </style>
</head>
<body>
  <div class="top">
    <strong>stone</strong>
    <button id="prev" title="previous stone — [ or ←">◀</button>
    <select id="pick" aria-label="stone"></select>
    <button id="next" title="next stone — ] or →">▶</button>
    <span class="ms" id="pos"></span>
    <strong>show</strong>
    <button id="mode-baked" aria-pressed="true">baked plate</button>
    <button id="mode-live" aria-pressed="false">live previz</button>
    <span class="grow"></span>
    <button id="strip" aria-pressed="true" title="the contact strip, folded away">strip</button>
    <strong>frame</strong>
    <input type="number" id="fw" value="1440" min="320" max="3840" step="10" aria-label="frame width">
    <input type="number" id="fh" value="900" min="320" max="2400" step="10" aria-label="frame height">
    <button id="fit">fit</button>
    <button id="theme">theme: light</button>
    <span class="ms" id="ms"></span>
    <span class="badge" id="count" data-n="0">0 moved</span>
    <button id="reset">reset stone</button>
  </div>
  <!-- THE OTHER TWO PICKS, on the strip that never scrolls, for the same reason
       the stone picker is up here: both are judged by FLICKING between candidates
       with the composition in view, and a control that has to be scrolled to
       cannot be flicked. The glass is not here — it is twenty sliders and a
       question about a material rather than a choice between five spellings. -->
  <div class="top">
    <strong>subheading</strong>
    <select id="subpick" aria-label="subheading wording"
            title="The five wordings #57 lists. Focus this and the arrow keys walk them,
which is the whole of choosing one: the type is set in the real face at the real
size with the Frame biting the real amount out of the second line."></select>
    <span class="ms" id="subpos"></span>
    <strong>behind the glass</strong>
    <div class="chips" id="behind"></div>
    <span class="grow"></span>
    <span class="ms" id="glassms"></span>
    <span class="badge" id="glasscount" data-n="0">0 moved</span>
    <button id="glassreset">reset glass</button>
  </div>
  <!-- THE EXIT, AND IT IS THREE CHOICES RATHER THAN ONE. #74 asks for the text,
       the Frame and the plinth to be able to leave differently — direction, rate,
       and whether they go together or separately — so the three rows here are
       independent and the point of the page is the COMBINATION. The five numbers
       behind each treatment are in the sidebar; these chips are the starting
       points, and dragging past one of them is the intended use rather than an
       abuse of it.

       THE SCRUB RUNS FROM -1 TO +1 and the whole design of the treatments is in
       that sign. +1 is this Panel gone, -1 is this Panel not arrived yet, and a
       crossing at progress t holds the outgoing Panel at t and the incoming one
       at t - 1. So the scrub is not "how far through the animation" — it is
       where in the crossing THIS composition stands, and `crossing` below puts
       the other one on top of it at the other value. -->
  <div class="top exitrow">
    <strong>exit</strong>
    <div class="chips" id="exit-text"></div>
    <div class="chips" id="exit-frame"></div>
    <div class="chips" id="exit-plinth"></div>
    <span class="badge" id="exitcount" data-n="0">0 moved</span>
    <button id="exitreset">reset exit</button>
  </div>
  <div class="top exitrow">
    <strong>scrub</strong>
    <input type="range" id="scrub" min="-1" max="1" step="0.005" value="0"
           aria-label="where in the crossing this Panel stands"
           title="-1 arriving · 0 settled · +1 gone. A crossing holds the outgoing Panel
at t and the incoming one at t - 1, which is what `crossing` shows.">
    <span class="ms" id="scrubval">0.000</span>
    <button id="settle">settle</button>
    <button id="play">play ▶</button>
    <button id="crossing" aria-pressed="false"
            title="Loads a SECOND /portfolio and stands it on top of this one at t - 1, so the
Panel leaving and the Panel arriving are on the screen together. It is a whole
second page — a second WebGL titlebar and a second recording — so it is off
until asked for.">crossing</button>
    <span class="grow"></span>
    <span id="presence"></span>
  </div>
  <p class="warn" id="warn"></p>

  <div class="wrap">
    <aside class="side">
      <div class="controls" id="controls"></div>
      <div class="drawer">
        <button class="ghead" id="drawer-head" aria-expanded="true"><span class="caret">▾</span> export <span class="grow"></span><span id="copy-hint" style="text-transform:none;letter-spacing:0"></span></button>
        <div id="drawer-body">
          <div class="out">
            <h3>build-slab.py — a CANDIDATES entry <button id="copy-py">copy</button></h3>
            <textarea id="out-py" spellcheck="false" readonly style="height:11rem"></textarea>
          </div>
          <div class="out">
            <h3>styles.css + the bake <button id="copy-css">copy</button></h3>
            <textarea id="out-css" spellcheck="false" readonly style="height:6.5rem"></textarea>
          </div>
          <div class="out">
            <h3>the wording, the backdrop, the glass <button id="copy-panel">copy</button></h3>
            <textarea id="out-panel" spellcheck="false" readonly style="height:13rem"></textarea>
          </div>
          <div class="out">
            <h3>the exit treatments <button id="copy-exit">copy</button></h3>
            <textarea id="out-exit" spellcheck="false" readonly style="height:13rem"></textarea>
          </div>
        </div>
      </div>
    </aside>

    <main class="stage">
      <div class="sheet"><ol id="sheet"></ol></div>
      <div class="pair">
        <iframe id="frame" src="/portfolio/" title="/portfolio"></iframe>
        <!-- No `src` until `crossing` is pressed, so the second page is never
             fetched by a session that is not judging a crossing. -->
        <iframe id="ghost" title="/portfolio — the Panel arriving" hidden></iframe>
      </div>
    </main>
  </div>

<script>
/* ============================================================================
   Panel tuner — the four things about the Projects Panel that were left to be
   chosen by eye: which stone the plinth is cut from and what that stone is made
   of, which of #57's five wordings the subheading carries, what sits behind the
   titlebar's glass, and what the glass itself is made of.

   ALL FOUR ARE SWITCHED OVER THE REAL COMPOSITION, which is the whole design of
   this page and not a convenience. /portfolio is in an iframe, same origin, and
   every control below reaches into it: the stone is a `data-marble` attribute,
   the wording is two text nodes, and the glass is portfolio/frame-glass.js's own
   uniforms moved through the seam at the foot of that file. So the Frame is the
   real Frame at the real width, the type is the real face with the real amount
   bitten out of its second line by the real window, and the reflection lying in
   the marble is the real reflection. Nothing here draws a picture of the Panel to
   decide something about the Panel — except the marble previz, which says so
   loudly, twice, below.

   TWO HALVES, AND THE FIRST IS EXACT WHILE THE SECOND IS NOT. Knowing which is
   which is the whole of using this page honestly. It is a statement about THE
   STONE; the wording and the glass have no approximate half at all.

   * BAKED PLATE is the real thing. design/plinth/build-slab.py has already put a
     block in front of Cycles for each stone in its CANDIDATES table, and what
     this half does is flip `data-marble` on the real /portfolio in an iframe —
     which is all the stylesheet needs, because `--panel-plinth-src` was written
     to be switched by an attribute and nothing else. So comparing the four is
     free, and what you are looking at IS what ships. Nothing here can change a
     plate; only Blender can.

   * LIVE PREVIZ is an approximation, and it exists because the alternative is a
     minute of Cycles per question. It reproduces build-slab.py's geometry
     exactly — the same camera, the same block, so the same trapezoid over the
     same rectangle — and its material is the same recipe: a level set of warped
     noise driving colour, roughness and bump together. What it does NOT
     reproduce is the noise field itself. Blender's Perlin and a fragment
     shader's are not the same function, and Cycles integrates two area lights
     where this evaluates two directions.

     So the previz answers HOW MUCH GOLD, HOW WIDE, WHAT COLOUR, HOW SHARP —
     the character of the stone, which is the thing that is actually in question
     — and it does not answer where any individual vein lands. Numbers dialled
     here land close and want one confirming bake. The export block says so too,
     because the export is the thing that gets pasted at three in the morning.

   NO SLIDER MOVES THE LIGHT, and that is deliberate rather than unfinished. The
   two lights in build-slab.py are FITTED to the design render's own measured
   profile — mean absolute error 3.2 levels over both faces — so they are a
   constant of the composition, not a preference. Two stones are only comparable
   while they are lit the same way. The two gains under `previz calibration` are
   the exception and they are not part of the export: they line this shader's
   exposure up with the plates so a previz can be judged beside one, which is a
   property of the shader and not of the stone.

   EVERY CONSTANT COMES FROM slab.json, which build-slab.py writes. There is no
   copy of the CANDIDATES table in this file, and there must not be: a tuner
   holding its own literals goes on showing the stone the script used to render,
   and both halves look right on their own while it does. design/plate/
   plate-tuner.html reads plate-source.json for the same reason.

   THE GLASS'S CONSTANTS COME FROM THE PAGE, for exactly that reason one step
   further on. `window.panelGlass.defaults` is what frame-glass.js is actually
   set to, handed over rather than restated here, so "moved from what ships" is
   measured against what ships and cannot go stale. What this file owns is the
   BOUNDS and the TOOLTIPS — a question about what is worth dragging through,
   which frame-glass.js has no opinion about — the same split VEIN_ROWS lives
   under. The bounds themselves are design/glass-tuner.html's, so a number
   settled in one page is reachable in the other.

   AND THE GLASS IS NOT DRAWN HERE. design/glass-tuner.html carries the four
   passes and this page deliberately does not carry them a second time: it moves
   the shipping page's uniforms and asks the shipping page to render. That is
   also why the glass half is silent on a browser that fell to the CSS rung —
   there is no shader to drag, and it says so rather than moving sliders at
   nothing.
   ========================================================================= */
(function () {
  "use strict";

  var STORE = "portfolio-plinth-tuner";
  var SIDECAR = "slab.json";
  var MAX_SETS = 4;          /* what the shader carries; the table's widest is 3 */

  var frame = document.getElementById("frame");
  var warnEl = document.getElementById("warn");
  var sheetEl = document.getElementById("sheet");
  var sheetBox = document.querySelector(".sheet");   /* the scroller; sheetEl is the list inside it */
  var pickEl = document.getElementById("pick");
  var posEl = document.getElementById("pos");
  var stripBtn = document.getElementById("strip");
  var controlsEl = document.getElementById("controls");
  var countEl = document.getElementById("count");
  var msEl = document.getElementById("ms");
  var fwEl = document.getElementById("fw");
  var fhEl = document.getElementById("fh");
  var outPy = document.getElementById("out-py");
  var outCss = document.getElementById("out-css");
  var outPanel = document.getElementById("out-panel");
  var themeBtn = document.getElementById("theme");
  var subPickEl = document.getElementById("subpick");
  var subPosEl = document.getElementById("subpos");
  var behindEl = document.getElementById("behind");
  var glassCountEl = document.getElementById("glasscount");
  var glassMsEl = document.getElementById("glassms");
  var outExit = document.getElementById("out-exit");
  var ghost = document.getElementById("ghost");
  var scrubEl = document.getElementById("scrub");
  var scrubValEl = document.getElementById("scrubval");
  var presenceEl = document.getElementById("presence");
  var exitCountEl = document.getElementById("exitcount");
  var crossBtn = document.getElementById("crossing");

  var slab = null;           /* what build-slab.py says */
  var doc = null, win = null, panel = null;
  var mode = "baked";
  var pick = "nero";         /* which stone is selected */
  var order = [];            /* every stone name, in the strip's order — what [ and ] walk */
  var strip = true;          /* is the contact strip shown at all */
  var theme = "light";
  var stones = {};           /* name -> {title, ground, veins, baked, shipped} */
  var live = null;           /* the working copy the sliders drag */
  var ready = false;
  var closed = {};           /* which control groups are folded */
  var sub = 0;               /* which wording, an index into SUBS */
  var shippedSub = -1;       /* which one the page arrived carrying, or -1 */
  var subChosen = false;     /* did `sub` come from a stored session, or is it a default */
  var behind = "dark";       /* what sits behind the glass */
  var glass = {};            /* the glass values moved off what ships — sparse */
  var glassDefaults = null;  /* window.panelGlass.defaults, once the frame is up */
  var stoneEl = null;        /* the stone's own controls, rebuilt per stone */
  var glassEl = null;        /* the glass's, built once */
  var exitEl = null;         /* the exit's, rebuilt when a treatment changes */
  var clipLoop = 0;          /* the rAF that keeps a MOVING backdrop moving */
  var exitPick = {};         /* group -> treatment name */
  var exitShipped = {};      /* what the page arrived carrying, or null */
  var exitChosen = false;    /* did exitPick come from a stored session */
  var exitVals = {};         /* "text.rate" -> number, sparse, moved off the treatment */
  var exitDefaults = {};     /* the same keys, read off the page under the treatment */
  var exitT = 0;             /* the scrub: where in the crossing this Panel stands */
  var crossing = false;      /* is the second /portfolio loaded and standing on this one */
  var ghostDoc = null, ghostPanel = null;
  var playLoop = 0;          /* the rAF running a crossing, in THIS document */

  function warn(msg) { warnEl.textContent = msg || ""; }

  /* WHAT THIS SHADER IS A TWIN OF, and the whole reason it is a constant here
     rather than something computed. The previz below is a hand-written GLSL
     copy of build_material() in build-slab.py: every constant it needs comes out
     of slab.json, so the two cannot disagree about NUMBERS — but the SHAPE of
     the material is written out twice, once in Blender nodes and once in GLSL,
     and nothing has ever stopped those two from drifting apart. When they do,
     both halves still look right on their own, which is the failure this file's
     own header warns about and then had no defence against.

     So build-slab.py now hashes the material's shaping constants into
     `material_version` and this is the value the shader below was written
     against. They differ whenever the material grows something the GLSL does not
     have, and the banner says so rather than the preview quietly lying.

     THIS ONE IS KNOWN STALE. The material gained a bedding transform, a
     Voronoi fracture network, per-vein width modulation, vein haloes, density
     gating, ground mottle and polish variation; the shader below has none of
     them and still draws the isotropic constant-width level sets that were
     replaced. Until it is ported it is useful for the BLOCK and the CAMERA and
     nothing else. Read a baked plate for the stone. */
  var SHADER_MATERIAL_VERSION = "pre-bedding";

  function checkShaderCurrent() {
    if (!slab || !slab.material_version) return;
    if (slab.material_version === SHADER_MATERIAL_VERSION) return;
    warn("PREVIZ IS OUT OF DATE and is not showing this material. build-slab.py "
         + "is at material " + slab.material_version + "; the shader in this page "
         + "was written against " + SHADER_MATERIAL_VERSION + " and has no bedding, "
         + "fracture network, halo, density gate, mottle or polish variation in it. "
         + "The block and the camera are still right. For the STONE, bake a plate "
         + "and look at that.");
  }

  /* ---- the stone the tuner adds ------------------------------------------
     One preset that is NOT in build-slab.py, and it is here because it is the
     answer to the thing that sent anyone to this page. The baked `portoro` is
     Nero Portoro on paper and reads wrong: its gold is a broad olive wash at

  /* ---- boot ----------------------------------------------------------------

     stone needs the sidecar; the wording is two strings and the glass reads its
     own defaults off the page. Built here rather than inside the fetch so that a
     missing or unparseable slab.json leaves the wording and the glass working —
     inside the .then they would have gone down with the marble, and the two
     halves that need no Blender at all would have been unreachable until somebody
     ran Blender. What is lost with the sidecar is the SESSION: restore() needs the
     stone table to know which stone to put back, so a run without slab.json opens
     at the defaults and remembers nothing. */
  buildSubPicker();
  buildBehind();
  buildExitChips();
  /* Three hosts inside one scroller, in this order and made once: the stone's
     controls are rebuilt every time a stone is picked and the exit's every time
     a treatment is — the glass's never are — so they cannot share a parent that
     gets emptied. */
  stoneEl = document.createElement("div");
  glassEl = document.createElement("div");
  exitEl = document.createElement("div");

  controlsEl.appendChild(glassEl);
  controlsEl.appendChild(exitEl);

       they are not made of either — see `the stone, photographed` in
       build-slab.py. They are listed here because a picker that silently omits
       two thirds of what build-slab.py can render is worse than useless: you go
       looking for `gemini`, do not find it, and conclude the bake failed.

       THE PREVIZ CANNOT DRAW THEM, and is not asked to. The shader below is a
       hand-written GLSL twin of build_material() — noise fields, thresholds,
       haloes — and a photo stone is four 2814px maps this page does not have
       and could not sample honestly if it did (design/plinth/maps/ is
       gitignored, so on a fresh checkout it is not even on disk). What it shows
       instead is the REAL RENDER, which is better than a preview rather than a
       fallback from one: the plates are committed, so there is always one to
       show, and it is the actual Cycles output rather than an approximation of
       it. Hence `photo: true` pins the mode to baked. */
    Object.keys(slab.photo_candidates || {}).forEach(function (k) {

       reason from the photo ones: the previz CAN draw their material — it is a
       CANDIDATES entry — but it has no idea about the room, and the room is the
       entire difference. Drawing them live would show the stone in the light
       they were made to get away from and caption it as if it were them. */
    Object.keys(slab.relit_candidates || {}).forEach(function (k) {
      var c = slab.relit_candidates[k];
      stones[k] = { title: c.title, photo: c, baked: true, kind: "re-lit" };
    });
    Object.keys(PRESETS).forEach(function (k) {
      if (stones[k]) return;   /* the script won; a preset never shadows a bake */
      stones[k] = { title: PRESETS[k].title, ground: PRESETS[k].ground.slice(),
                    veins: PRESETS[k].veins.map(cloneVein), baked: false };
    });
    initGL();
    buildSheet();
    restore();
    buildControls();
    apply();
    /* The frame's load event and this promise race, and either can win. Both ends
       apply all four decisions, so whichever arrives second is what the page ends
       up wearing — and neither leaves a picker saying one thing while the page
       shows another. Both are no-ops before the frame is up: applySub() has no
       document to write into and applyGlass() has no seam to reach. */
    applySub();
    applyGlass(true);
    /* Fourth of the four, and it races the frame's load event exactly as the
       three above do: whichever arrives second is what the page ends up wearing,
       and both ends read the defaults before they build the rows. */
    applyExit();
    buildExitControls();
    sizeFrame();
    checkShaderCurrent();
  }).catch(function (e) {
    warn("could not read design/plinth/" + SIDECAR + " (" + e.message + "). " +
         "It is written by build-slab.py — run `blender -b -P design/plinth/build-slab.py -- all`, " +
         "and serve this page over http rather than opening the file directly.");
  });

  function cloneVein(v) { return v.slice(0, 5).concat([v[5].slice()], v.slice(6)); }
  function cloneStone(s) {
    /* A photo stone has neither a ground nor vein sets and there is nothing to
       edit on it, so it is carried through as itself rather than deep-copied
       into a shape it does not have. */
    if (s.photo) return { title: s.title, photo: s.photo, baked: true };
    return { title: s.title, ground: s.ground.slice(), veins: s.veins.map(cloneVein),
             baked: s.baked };
  }

  frame.addEventListener("load", function () {
    doc = frame.contentDocument;
    win = frame.contentWindow;
    /* The old document's rAF callbacks died with it, so any id held here is a loop
       that is not running. Cleared before anything can read it as one that is. */
    clipLoop = 0;
    panel = doc.getElementById("projects");
    if (!panel) {
      warn("no #projects in the frame — /portfolio has no Panel to stand a plinth under.");
      return;
    }
    theme = doc.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    themeBtn.textContent = "theme: " + theme;
    /* WHICH WORDING THE PAGE ARRIVED CARRYING, read rather than remembered, so
       "what ships" in the picker and the export is whatever index.html actually
       says today and not what it said when this table was written. A wording that
       is no longer one of the five reads back as -1, and the picker says so. */
    readShippedSub();
    /* The glass's controls cannot be built before this: their defaults are the
       shipping page's own, and the shipping page is what has just loaded. Built
       once and then left alone — a reload re-reads the defaults and rebuilds, in
       case frame-glass.js changed under an open tuner. */
    buildGlass();
    /* The plinth is at the foot of the page and the page is several screens
       long, so a tuner that did not scroll would open on the masthead every
       time. Instantly, not smoothly: a half-second glide on every reload is a
       half-second of not being able to see the thing being tuned. */
    panel.scrollIntoView({ block: "end", behavior: "instant" });
    /* A keydown inside the iframe never reaches this document, and clicking the
       preview — to scroll it, to open the Panel — is the likeliest thing to
       have taken focus before someone reaches for ]. Same handler, same origin,
       re-attached on every load because it is a new document each time. */
    doc.addEventListener("keydown", keys);
    apply();
    applySub();
    /* The exit's defaults are the shipping page's own under whichever treatment
       is selected, so like the glass's they cannot be read before this. Read
       what the page arrived wearing, put the mixture on it, and only then build
       the rows — a row built earlier would hold a `was` of nothing and call
       every untouched slider moved. */
    readExitShipped();
    applyExit();
    buildExitControls();
    /* Last, and with a redraw asked for: the glass is the only one of the four
       that costs a render, and the page has just drawn itself once with what
       ships. */
    applyGlass(true);
    /* Because this handler is where the shipped wording is finally known, and boot
       has already written the blob without it. */
    save();
  });

  /* ---- the contact strip ------------------------------------------------- */

  function buildSheet() {
    buildPicker();
    sheetEl.textContent = "";
    Object.keys(stones).forEach(function (k) {
      var s = stones[k];
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.stone = k;
      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = k;
      if (!s.baked) {
        var u = document.createElement("span");
        u.className = "un";
        u.textContent = "  — no plate, previz only";
        nm.appendChild(u);
      } else if (s.photo) {
        var p = document.createElement("span");
        p.className = "un";
        p.textContent = "  — " + (s.kind || "photograph") + ", plate only";
        nm.appendChild(p);
      }
      var ti = document.createElement("div");
      ti.className = "ti";
      ti.textContent = s.title;
      b.appendChild(nm);
      b.appendChild(ti);
      if (s.baked) {
        var img = document.createElement("img");
        /* `../../portfolio/` and not `../../`: this page is at /design/plinth/,
           so two levels up is the repository root and the plates are a further
           directory in. It read `../../` and every thumbnail in the strip 404'd
           — silently, because a broken <img> in a dark row looks like a stone
           that has not been baked yet, which is a thing the strip is expected to
           contain. */
        img.src = plateURL(k, "../../portfolio/");
        img.alt = "";
        img.loading = "lazy";
        b.appendChild(img);
      } else {
        b.appendChild(placeholder());
      }
      b.addEventListener("click", function () { select(k); });
      li.appendChild(b);
      sheetEl.appendChild(li);
    });
    markSheet();
  }

  /* What a photo stone shows instead of sliders: what it is made of, read-only.
     READ-ONLY IS THE HONEST ANSWER, not a shortcut. Every slider on a
     procedural stone works because this page can redraw the result — move it and
     the previz answers. Nothing here can be answered without Cycles: `scale` and
     `offset` decide which sliver of a 2814px photograph lands on a block whose
     top face is foreshortened eight to one, `sss` is a subsurface radius, and
     `room` is an entire lighting rig. A slider that silently did nothing until
     someone remembered to re-bake would be worse than no slider, so these are
     values to read and then go and change in build-slab.py. */
  /* These are Python values on their way back into a Python file, so they are
     rendered as Python throughout — `False` not `false`, and 1.0 not 1. A whole
     number arriving as `1` is valid Python and would still bake, but it makes a
     copied entry look unlike every other line in PHOTO_CANDIDATES, and the point
     of the export is to be pasted without tidying. */
  function pyVal(v) {
    if (Array.isArray(v)) return "(" + v.map(pyVal).join(", ") + ")";
    if (typeof v === "boolean") return v ? "True" : "False";
    if (typeof v === "number") return Number.isInteger(v) ? v.toFixed(1) : String(v);
    return '"' + v + '"';
  }

  /* Stones that arrived through design/plinth/add-stone.py rather than out of
     the table in build-slab.py. Their values live in design/plinth/stones/, and
     everything this page says about where to go and change them has to say so —
     see photoControls() and writeExport(). */
  function addedStone(k) { return (slab.added_stones || {})[k] || null; }

  var PHOTO_ROWS = [
    ["grade", "which basecolor-*.png, so which of build-portoro-maps.py's GRADES"],
    ["scale", "tiles per model unit, and a unit is a Frame width. 0.84 lays one slab across the plinth; 0.42 crops in and the figure doubles; 1.75 goes fine and jewel-like. The strongest control here, and not a quality setting."],
    ["offset", "where in the slab the block was cut from. Only a sliver is ever seen, so this decides which veins land on the plinth at all."],
    ["bump", "(strength, distance). Tiny, and has to be: the top face is seen at 7.8 degrees where it is nearly a mirror, so bump adds distortion to a reflection rather than texture to a surface."],
    ["sss", "Subsurface Weight through the calcite mask. Calcite is translucent, and that is most of why marble looks deep rather than painted."],
    ["coat", "(weight, roughness). A second specular lobe over the stone. Off in the dark rooms, where it was lifting the black."],
    ["rough", "multiplies the roughness map. 0 pins it flat at BASE_ROUGH — the crippled control, `gemini-plain`."],
    ["crack", "lay the procedural FRACTURE network over the photograph as well"],
    ["room", "which ROOMS surround to render in. `noir` is the one where the black is actually black."]
  ];

  function photoControls(base) {
    var n = document.createElement("p");
    n.className = "note";
    n.textContent = "`" + pick + "` is " + (base.kind === "re-lit"
        ? "a procedural stone rendered in a different room — the previz has no room in it, "
          + "so drawing it live would show this stone in the light it was made to get away from. "
        : "cut from a photograph, not grown from noise. There is no previz for it. ")
      + "The picture above is the real Cycles plate. "
      /* An added stone's values are NOT in build-slab.py — it merges them from
         design/plinth/stones/<name>.json, which design/plinth/add-stone.py
         wrote. Sending you to the table in build-slab.py to change a number it
         does not hold costs a re-bake that appears to do nothing. */
      + (addedStone(pick)
          ? "These are read-only — change them in design/plinth/stones/" + pick
            + ".json and re-bake:"
          : "These are read-only — change them in PHOTO_CANDIDATES in build-slab.py and re-bake:")
      + "\n\n    blender -b -P design/plinth/build-slab.py -- " + pick;
    n.style.whiteSpace = "pre-wrap";
    stoneEl.appendChild(n);

    group(stoneEl, "photograph", "photo", function (b) {
      PHOTO_ROWS.forEach(function (r) {
        var v = base.photo[r[0]];
        if (v === undefined || v === null) return;
        var d = document.createElement("div");
        d.className = "row";
        d.title = r[1];
        var lab = document.createElement("label");
        lab.textContent = r[0];
        var val = document.createElement("span");
        val.className = "was";
        val.textContent = pyVal(v);
        d.appendChild(lab);
        d.appendChild(val);
        b.appendChild(d);
      });
    });
  }

  /* An unbaked stone still gets a picture in the strip, drawn by the previz —
     otherwise the one row you are working on is the one row with nothing in it. */
  function placeholder() {
    var c = document.createElement("canvas");
    c.className = "livethumb";
    c.width = 900;
    c.height = Math.round(900 * slab.plate.h / slab.plate.w);
    return c;
  }

  /* Where a stone's baked plate lives, from two different places.
     The strip is at /design/plinth/ and needs `../../portfolio/`; the frame is a document
     at /portfolio/ whose own stylesheet writes `img/tex/...` relative to itself,
     so it needs an absolute path instead. One function so the two can never
     drift onto different files — and the same ?v= the stylesheet asks for, so
     the strip and the frame are never showing two different renders of one
     stone. */
  function plateURL(k, base) {
    return (base || "/portfolio/") + "img/tex/plinth-" + k + ".webp" +
           (slab.version ? "?v=" + slab.version : "");
  }

  function markSheet() {
    Array.prototype.forEach.call(sheetEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.stone === pick ? "true" : "false");
    });
    markPicker();
    revealRow();
  }

  /* Keep the picked row visible INSIDE the strip, and by hand rather than with
     scrollIntoView(): that walks the whole ancestor chain, so it would scroll
     .stage as well and take the preview off screen — the one thing all of this
     exists to stop. A row taller than the box is aligned to its top; a row
     bottom-aligned in a box it does not fit is a row whose name is cut off. */
  function revealRow() {
    var b = sheetEl.querySelector('button[data-stone="' + pick + '"]');
    if (!b || sheetBox.hidden) return;
    var r = b.getBoundingClientRect(), c = sheetBox.getBoundingClientRect();
    if (r.top < c.top || r.height > c.height) sheetBox.scrollTop += r.top - c.top;
    else if (r.bottom > c.bottom) sheetBox.scrollTop += r.bottom - c.bottom;
  }

  /* ---- cycling, with the plinth still in view ------------------------------
     The strip is the honest way to COMPARE two stones — put them one above the
     other and look down rather than remember — and a poor way to walk
     twenty-three of them, because the row being clicked and the plinth being
     judged cannot both be on screen at plate width. So the same list is also a
     select in the top bar, which never scrolls, and two keys that do not need
     the mouse to leave the preview at all. Same `order`, same select(); this
     adds a way in, not a second source of truth. */

  function buildPicker() {
    order = Object.keys(stones);
    pickEl.textContent = "";
    var groups = {};
    order.forEach(function (k) {
      var s = stones[k];
      /* The four families the strip's captions already name, so that scrolling
         a menu of twenty-three says which of them can be drawn live before one
         is picked and the mode silently changes underneath. */
      var g = !s.baked ? "previz only — no plate"
            : s.kind === "re-lit" ? "re-lit — plate only"
            : s.kind === "photograph" ? "photograph — plate only"
            : "procedural — previz + plate";
      if (!groups[g]) {
        groups[g] = document.createElement("optgroup");
        groups[g].label = g;
        pickEl.appendChild(groups[g]);
      }
      var o = document.createElement("option");
      o.value = k;
      o.textContent = k;
      o.title = s.title;
      groups[g].appendChild(o);
    });
  }

  function markPicker() {
    pickEl.value = pick;
    posEl.textContent = (order.indexOf(pick) + 1) + " / " + order.length;
  }

  /* Wraps rather than stopping at the ends: a set of candidates being compared
     against each other is a ring, and running off the last one into nothing is
     a dead key at the moment the answer is two rows back. */
  function step(d) {
    if (!order.length) return;
    var i = order.indexOf(pick);
    if (i < 0) i = 0;
    select(order[(i + d + order.length) % order.length]);
  }

  pickEl.addEventListener("change", function () { select(pickEl.value); });
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });

  /* [ and ] because they sit together under one hand and neither is spoken for
     by the browser; the arrows as an alias. Both are dropped while a field has
     focus, so ← and → still nudge a slider a step and the select still opens on
     its own keys. */
  function keys(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    var d = (e.key === "[" || e.key === "ArrowLeft") ? -1
          : (e.key === "]" || e.key === "ArrowRight") ? 1 : 0;
    if (!d) return;
    e.preventDefault();
    step(d);
  }
  document.addEventListener("keydown", keys);

  /* Fold the strip away and the preview has the stage to itself. The picker
     above still cycles, which is what makes this a fold rather than a
     surrender: with the strip gone there is no other way to change stone. */
  function markStrip() {
    stripBtn.setAttribute("aria-pressed", strip ? "true" : "false");
    sheetBox.hidden = !strip;
  }
  stripBtn.addEventListener("click", function () {
    strip = !strip;
    markStrip();
    revealRow();
    save();
  });

  function select(k) {
    pick = k;
    live = cloneStone(stones[k]);
    /* A stone with no plate cannot be shown baked, so choosing one chooses the
       previz with it rather than showing a broken image and waiting to be
       asked. */
    if (!stones[k].baked) mode = "live";
    /* ...and the converse, for the same reason: a photo stone has no previz to
       flip to, so choosing one chooses the plate with it. */
    if (stones[k].photo) mode = "baked";
    markSheet();
    markMode();
    buildControls();
    apply();
    save();
  }

  /* ---- mode + theme ------------------------------------------------------ */

  function markMode() {
    document.getElementById("mode-baked").setAttribute("aria-pressed", mode === "baked" ? "true" : "false");
    var lv = document.getElementById("mode-live");
    lv.setAttribute("aria-pressed", mode === "live" ? "true" : "false");
    /* Disabled rather than left to warn on click: there is no previz of a
       photograph to switch to, and a button that always refuses is a button
       that should have said so before it was pressed. */
    var isPhoto = !!(stones[pick] && stones[pick].photo);
    lv.disabled = isPhoto;
    lv.title = isPhoto ? "no previz for a photo-backed stone — see the note on the left" : "";
  }
  document.getElementById("mode-baked").addEventListener("click", function () {
    if (!stones[pick].baked) {
      warn("`" + pick + "` has no plate in portfolio/img/tex — bake it before it can be shown baked.");
      return;
    }
    warn("");
    mode = "baked"; markMode(); apply(); save();
  });
  document.getElementById("mode-live").addEventListener("click", function () {
    mode = "live"; markMode(); apply(); save();
  });

  themeBtn.addEventListener("click", function () {
    theme = theme === "light" ? "dark" : "light";
    themeBtn.textContent = "theme: " + theme;
    if (doc) doc.documentElement.setAttribute("data-theme", theme);
    save();
  });

  document.getElementById("reset").addEventListener("click", function () {
    live = cloneStone(stones[pick]);
    buildControls();
    apply();
    save();
  });

  function sizeFrame() {
    frame.style.width = (parseInt(fwEl.value, 10) || 1440) + "px";
    frame.style.height = (parseInt(fhEl.value, 10) || 900) + "px";
    save();
  }
  fwEl.addEventListener("change", sizeFrame);
  fhEl.addEventListener("change", sizeFrame);
  document.getElementById("fit").addEventListener("click", function () {
    var stage = document.querySelector(".stage");
    fwEl.value = Math.round(stage.clientWidth - 26);
    /* Fit to what the strip actually left, not to a fraction of the stage: the
       0.72 that was here stood in for a strip whose height nothing knew, and
       now something does — it is a fixed 34vh, or nothing at all when folded.
       19 is the stage's own padding, 10 the column gap, 2 the iframe's border. */
    var used = sheetBox.hidden ? 0 : sheetBox.offsetHeight + 10;
    fhEl.value = Math.max(320, Math.round(stage.clientHeight - used - 21));
    sizeFrame();
  });

  /* ---- previz calibration -------------------------------------------------
     Not part of the stone and not exported. Cycles' two area lights are given
     in watts over an area; this shader evaluates two directions with a lobe
     widened by the light's angular size, which is the cheap stand-in for an
     area integral. The two constants that reconciles are exposure, so they live
     here where they can be lined up against a plate rather than being guessed
     at in GLSL. Defaults land the previz on the baked plates' levels. */
  /* Both fitted against plinth-nero.webp, measured down the plate's middle
     third: its top face ramps 38 -> 84 back to front and its front face is a
     flat 21. These land 49 -> 82 and a flat 21, which is the previz agreeing
     with a render about the thing it is not computing. */
  var cal = { key: 0.0093, fill: 0.060 };
  var CAL_ROWS = [
    { k: "key", label: "key gain", min: 0.001, max: 0.05, step: 0.0002, dp: 4,
      tip: "Exposure of the light behind the block, which is the whole of the top face.\nSmall because the reflection it stands in for is a near-mirror: the lobe's peak\nruns into the hundreds before any gain.\nFitted against plinth-nero's measured top face, 38 -> 84; this lands 49 -> 82,\nso the previz is a little flat at the back and right at the arris.\nNot the stone. Line it up against a baked plate in the strip above." },
    { k: "fill", label: "fill gain", min: 0.005, max: 0.4, step: 0.001, dp: 3,
      tip: "Exposure of the wide weak light in front, which is the whole of the front face.\nFitted against the same plate's flat 21. Also not the stone." }
  ];

  /* ---- controls ---------------------------------------------------------- */

  /* `into` rather than always the scroller, because there are two hosts in it now
     and only one of them is emptied when a stone is picked. */
  function group(into, title, key, fill) {
    var head = document.createElement("button");
    head.className = "ghead";
    head.type = "button";
    var caret = document.createElement("span");
    caret.className = "caret";
    var body = document.createElement("div");
    body.className = "gbody";
    function paint() {
      var hid = !!closed[key];
      body.hidden = hid;
      caret.textContent = hid ? "▸" : "▾";
      head.setAttribute("aria-expanded", hid ? "false" : "true");
    }
    head.appendChild(caret);
    head.appendChild(document.createTextNode(" " + title));
    head.addEventListener("click", function () { closed[key] = !closed[key]; paint(); save(); });
    into.appendChild(head);
    into.appendChild(body);
    paint();
    fill(body);
    return body;
  }

  /* One slider, its number, and the highlight that says it has been moved off
     what build-slab.py says. `get`/`set` rather than a property name, because
     the same row shape drives the ground colour, a vein's eight values, the two
     calibration gains and now the glass's twenty uniforms, which live in five
     different places.

     FOUR KINDS OF CONTROL AND ONE COMPARISON. `spec.colour` is a LINEAR rgb
     triple, which is what Cycles is handed and why the swatch looks darker than
     the number; `spec.hex` is a plain sRGB string, which is what the shader's tint
     is and must not go through the transfer functions; `spec.bool` is a checkbox;
     anything else is a slider. All four decide "moved" by comparing against `was`
     as a string or a number, so the highlight means the same thing in every
     group. */
  function row(parent, spec, get, set, was) {
    var el = document.createElement("div");
    el.className = "row";
    var lab = document.createElement("label");
    lab.textContent = spec.label;
    if (spec.tip) lab.title = spec.tip;
    el.appendChild(lab);

    var out = document.createElement("output");
    /* What a move is answered by. The stone's rows repaint the plinth; the glass's
       ask the shipping page for four passes, which is a different and much more
       expensive thing to do — so which one is a property of the row rather than a
       branch in here. */
    var changed = spec.onchange || apply;
    function moved() {
      if (was === undefined) return false;
      if (spec.colour || spec.hex || spec.bool) return String(get()) !== String(was);
      return Math.abs(get() - was) > 1e-9;
    }
    function paint() {
      el.classList.toggle("moved", moved());
      if (!spec.colour && !spec.hex && !spec.bool) out.textContent = fmt(get(), spec.dp);
    }

    if (spec.bool) {
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!get();
      cb.addEventListener("change", function () {
        set(cb.checked);
        paint(); changed(); save();
      });
      el.appendChild(cb);
      out.textContent = "";
      el.appendChild(out);
      paint();
    } else if (spec.hex) {
      var hx = document.createElement("input");
      hx.type = "color";
      hx.value = get();
      hx.addEventListener("input", function () {
        set(hx.value);
        paint(); changed(); save();
      });
      el.appendChild(hx);
      out.textContent = "";
      out.style.fontSize = "10px";
      el.appendChild(out);
      paint();
    } else if (spec.colour) {
      var ci = document.createElement("input");
      ci.type = "color";
      ci.value = linToHex(get());
      ci.addEventListener("input", function () {
        set(hexToLin(ci.value));
        paint(); changed(); save();
      });
      el.appendChild(ci);
      out.textContent = "";
      out.style.fontSize = "10px";
      var v = get();
      out.textContent = fmt(v[0], 3);
      el.appendChild(out);
      paint();
    } else {
      var r = document.createElement("input");
      r.type = "range";
      r.min = spec.min; r.max = spec.max; r.step = spec.step;
      r.value = get();
      r.addEventListener("input", function () {
        set(parseFloat(r.value));
        paint(); changed(); save();
      });
      el.appendChild(r);
      el.appendChild(out);
      paint();
    }
    parent.appendChild(el);
    return el;
  }

  function buildControls() {
    stoneEl.textContent = "";
    if (!live) return;
    var base = stones[pick];
    if (base.photo) { photoControls(base); return; }

    var n = document.createElement("p");
    n.className = "note";
    n.textContent = live.baked
      ? "`" + pick + "` has a plate. Flip to baked plate above to see the real render; " +
        "the previz below is for asking what a change would do."
      : "`" + pick + "` has no plate yet. Everything you see is the previz.";
    stoneEl.appendChild(n);

    group(stoneEl, "ground", "ground", function (b) {
      row(b, { label: "ground colour", colour: true,
               tip: "The rock between the veins, in LINEAR light. Near-black for three of the four:\nthe Panel's own ground is very dark and a plinth lighter than the page it stands\non stops reading as something the Frame rests on." },
          function () { return live.ground; },
          function (v) { live.ground = v; },
          base.ground.join(","));
      row(b, { label: "base roughness", min: 0.01, max: 0.6, step: 0.005, dp: 3,
               tip: "How polished the stone is where there is no vein in it — build-slab.py's\nBASE_ROUGH, which is global rather than per stone. Exported as its own line,\nbecause changing it changes every candidate." },
          function () { return live.baseRough === undefined ? slab.base_rough : live.baseRough; },
          function (v) { live.baseRough = v; },
          slab.base_rough);
    });

    live.veins.forEach(function (v, i) {
      group(stoneEl, "vein set " + (i + 1), "v" + i, function (b) {
        var h = document.createElement("div");
        h.className = "vhead";
        var s = document.createElement("span");
        s.textContent = "set " + (i + 1) + " of " + live.veins.length;
        h.appendChild(s);
        var del = document.createElement("button");
        del.type = "button";
        del.textContent = "remove";
        del.addEventListener("click", function () {
          if (live.veins.length < 2) { warn("a stone needs at least one vein set."); return; }
          live.veins.splice(i, 1);
          buildControls(); apply(); save();
        });
        h.appendChild(del);
        b.appendChild(h);

        VEIN_ROWS.forEach(function (spec, ri) {
          var wasVein = base.veins[i];
          var was = wasVein === undefined ? undefined
                  : (spec.colour ? wasVein[5].join(",") : wasVein[fieldIndex(spec.k)]);
          row(b, spec,
              function () { return v[fieldIndex(spec.k)]; },
              function (x) { v[fieldIndex(spec.k)] = x; },
              was);
        });
      });
    });

    if (live.veins.length < MAX_SETS) {
      var add = document.createElement("button");
      add.className = "ghead";
      add.type = "button";
      add.textContent = "+ add a vein set";
      add.addEventListener("click", function () {
        var last = live.veins[live.veins.length - 1];
        /* Half the width and twice the scale of the finest set there is, which
           is the direction every stone in the table is layered in: a swathe,
           then a vein, then a hairline. */
        live.veins.push([Math.min(60, last[0] * 2), Math.max(1, last[1] - 1), last[2],
                         Math.max(0.002, last[3] / 2), last[4] + 0.4,
                         last[5].slice(), Math.max(0.02, last[6] - 0.06),
                         Math.max(0, last[7] - 0.1)]);
        buildControls(); apply(); save();
      });
      stoneEl.appendChild(add);
    }

    group(stoneEl, "previz calibration", "cal", function (b) {
      var p = document.createElement("p");
      p.className = "note";
      p.style.margin = "0 0 0.3rem";
      p.textContent = "Exposure of this shader, not a property of the stone. Never exported — " +
                      "the lights in build-slab.py are fitted to the design render and are not " +
                      "a preference.";
      b.appendChild(p);
      CAL_ROWS.forEach(function (spec) {
        row(b, spec, function () { return cal[spec.k]; },
            function (v) { cal[spec.k] = v; }, undefined);
      });
    });

    countMoved();
  }

  function fieldIndex(k) { return slab.vein_fields.indexOf(k); }

  function countMoved() {
    var n = stoneEl.querySelectorAll(".row.moved").length;
    var base = stones[pick];
    if (base.photo) { countEl.textContent = "read-only"; countEl.dataset.n = 0; return; }
    if (live.veins.length !== base.veins.length) n += 1;
    countEl.textContent = n + " moved";
    countEl.dataset.n = n;
  }

  /* ---- colour ------------------------------------------------------------
     The table's colours are LINEAR — Cycles is handed them raw and the render's
     view transform is Standard — while <input type="color"> is sRGB. So the two
     transfer functions are applied at the boundary rather than being ignored,
     which is the difference between a swatch that lies by about a factor of two
     in the midtones and one that does not. */
  function s2l(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function l2s(c) { return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
  function linToHex(rgb) {
    return "#" + rgb.map(function (c) {
      var v = Math.round(Math.min(1, Math.max(0, l2s(c))) * 255);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }
  function hexToLin(hex) {
    var m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex);
    if (!m) return [0, 0, 0];
    return [1, 2, 3].map(function (i) { return s2l(parseInt(m[i], 16) / 255); });
  }
  function fmt(v, dp) {
    if (Array.isArray(v)) return v.map(function (x) { return x.toFixed(3); }).join(" ");
    return Number(v).toFixed(dp === undefined ? 3 : dp);
  }

  /* ---- apply -------------------------------------------------------------
     The one line the stylesheet was written for. In baked mode the attribute is
     the whole of it; in live mode the same custom property is pointed at a data
     URL instead, so the box, the stretch, the negative margin and the
     reflection lying in the top face are all still the stylesheet's and none of
     them is restated here. */
  function apply() {
    if (!live) return;
    /* A photo stone can only be shown baked. Guarding here as well as in
       select() because restore() can put a photo stone and a stored mode of
       "live" together on load, and drawLive() would then be handed a stone with
       no vein sets to upload. */
    if (live.photo && mode !== "baked") { mode = "baked"; markMode(); }
    if (mode === "live") drawLive();
    if (!panel) { writeExport(); return; }
    panel.dataset.marble = pick;
    if (mode === "baked") {
      /* SET IT, don't remove it. Removing the inline property falls back to the
         stylesheet, and the stylesheet only carries a
         `.panel[data-marble="..."]` rule for the four procedural stones — so
         every other stone fell through to the default `--panel-plinth-src` and
         the frame showed plinth-nero.webp no matter what was picked. Silently:
         data-marble was set correctly, the strip highlighted the right row, and
         the one thing the page exists to do did not happen.

         A picker cannot require the thing being picked to have already been
         shipped. Pointing the property straight at the plate works for any
         stone with a bake, rule or no rule, and the export box still says which
         rule styles.css will need when one is chosen. */
      panel.style.setProperty("--panel-plinth-src", 'url("' + plateURL(pick) + '")');
    } else {
      panel.style.setProperty("--panel-plinth-src", 'url("' + lastURL + '")');
    }
    countMoved();
    writeExport();
  }

  /* ======================================================================= */
  /*  the wording                                                            */
  /* ======================================================================= */

  function buildSubPicker() {
    subPickEl.textContent = "";
    SUBS.forEach(function (s, i) {
      var o = document.createElement("option");
      o.value = String(i);
      /* Shown as the page draws it, because the page draws it in capitals and
         choosing between five spellings by eye means seeing the spelling. The
         export carries the sentence case that actually gets pasted. */
      o.textContent = (s.a + " " + s.b).toUpperCase();
      subPickEl.appendChild(o);
    });
  }

  /* WHICH WORDING THE PAGE IS CARRYING, matched against the five rather than
     assumed to be one of them. A page that has moved on to a sixth reads back as
     -1 and the picker says `page differs` instead of quietly calling one of these
     five the shipped one — which is the whole value of reading it: this table and
     index.html are two places one decision is written, and only one of them ships.
     NOT A warn(), on purpose. The banner is one line and the previz's staleness
     notice is already competing for it; the readout beside the picker is always
     visible and the export says it at length. */
  function readShippedSub() {
    shippedSub = -1;
    if (!doc) return;
    var spans = doc.querySelectorAll(".panel-sub span");
    if (spans.length < 2) return;
    var a = spans[0].textContent.trim(), b = spans[1].textContent.trim();
    SUBS.forEach(function (s, i) { if (s.a === a && s.b === b) shippedSub = i; });
    /* A TUNER OPENS ON WHAT SHIPS. Without this the first slot in the table wins
       every fresh session, so the page's own wording is replaced by another one
       before anybody has chosen anything — and the first thing you compare against
       is a candidate rather than the thing you are trying to beat. A stored session
       is a choice already made and is left alone. */
    if (!subChosen && shippedSub >= 0) sub = shippedSub;
  }

  function markSub() {
    subPickEl.value = String(sub);
    subPosEl.textContent = (sub + 1) + " / " + SUBS.length +
      (shippedSub < 0 ? " · page differs" : shippedSub === sub ? " · ships" : " · moved");
  }

  /* TWO TEXT NODES AND NOTHING ELSE. Not a stylesheet override, not a class, not
     a second copy of the markup: the same two spans index.html carries, with the
     same two strings that would be pasted into it. So the Frame bites the real
     amount out of the real face at the real size, and the occlusion — which is
     the only reason the split matters — is the page's own arithmetic rather than
     an imitation of it. */
  function applySub() {
    markSub();
    if (doc) {
      var spans = doc.querySelectorAll(".panel-sub span");
      if (spans.length >= 2) {
        spans[0].textContent = SUBS[sub].a;
        spans[1].textContent = SUBS[sub].b;
      }
    }
    writePanel();
  }

  subPickEl.addEventListener("change", function () {
    sub = parseInt(subPickEl.value, 10) || 0;
    subChosen = true;
    applySub();
    save();
  });

  /* ======================================================================= */
  /*  what sits behind the glass, and what the glass is made of              */
  /* ======================================================================= */

  /* The seam at the foot of portfolio/frame-glass.js, or null on a browser that
     never got a shader — in which case there is nothing here to drag and the
     panel below says so rather than pretending. */
  function glassAPI() { return win && win.panelGlass ? win.panelGlass : null; }

  function shippedBehind() {
    var api = glassAPI();
    return api && api.shipped ? api.shipped.backdrop : "dark";
  }

  function buildBehind() {
    behindEl.textContent = "";
    BEHIND.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.behind = t.k;
      b.textContent = t.label;
      b.title = t.tip;
      b.addEventListener("click", function () {
        behind = t.k;
        markBehind();
        applyGlass(true);
        save();
      });
      behindEl.appendChild(b);
    });
    markBehind();
  }

  function markBehind() {
    Array.prototype.forEach.call(behindEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.behind === behind ? "true" : "false");
    });
  }

  /* A MOVING BACKDROP IS THE ONE THING THAT MAKES THE SCENE DIRTY EVERY FRAME,
     and this loop is in the tuner rather than in frame-glass.js because it is the
     COST BEING JUDGED and not a feature being shipped. Selecting `panel ·
     recording` starts it and the per-frame time appears beside the chips, so what
     that treatment would cost is a number read off the real page rather than a
     warning to be taken on trust. Every other treatment is static and the loop
     stops.
     THE rAF IS THE IFRAME'S, so a reload cancels it for free — its callbacks die
     with the document. `clipLoop` is reset on load for that reason: a stale id
     from the last document would otherwise look like a loop that is still going
     and stop a new one being started. */
  function markClipLoop() {
    if (behind === "clip" && glassAPI()) {
      /* Cleared as the loop starts, not when its first frame lands: the readout
         would otherwise go on showing the last one-shot `N ms` until the first
         tick, which is a figure for a different question. */
      if (!clipLoop) { glassMsEl.textContent = ""; clipLoop = win.requestAnimationFrame(tickClip); }
    } else if (clipLoop) {
      if (win && win.cancelAnimationFrame) win.cancelAnimationFrame(clipLoop);
      clipLoop = 0;
      glassMsEl.textContent = "";
    }
  }

  function tickClip() {
    clipLoop = 0;
    var api = glassAPI();
    if (behind !== "clip" || !api) { glassMsEl.textContent = ""; return; }
    var t0 = performance.now();
    api.draw();
    glassMsEl.textContent = (performance.now() - t0).toFixed(1) + " ms/frame";
    clipLoop = win.requestAnimationFrame(tickClip);
  }

  /* What a control is set to: the override if one has been dragged, otherwise what
     the shipping page carries. `glass` is deliberately SPARSE — it holds only what
     has been moved, so a value settled in frame-glass.js and then edited there
     arrives here as the new default instead of being shadowed by a stored copy of
     the old one. Same reason restore() refuses to revive a stone the table no
     longer has. */
  function glassValue(k) {
    if (Object.prototype.hasOwnProperty.call(glass, k)) return glass[k];
    return glassDefaults ? glassDefaults[k] : undefined;
  }

  function buildGlass() {
    if (!glassEl) return;
    glassEl.textContent = "";
    glassDefaults = null;
    var api = glassAPI();
    if (!api) {
      var p = document.createElement("p");
      p.className = "note";
      p.textContent = "No shader on the page, so there is no glass to tune. "
        + "frame-glass.js only exposes its seam once the four passes have compiled and "
        + "drawn — a browser without WebGL2 gets the CSS rung, which has no uniforms. "
        + "The bar in the frame is reporting `"
        + (doc && doc.querySelector(".frame-bar") ? (doc.querySelector(".frame-bar").dataset.glass || "nothing") : "no titlebar")
        + "`. The wording and the stone above are unaffected.";
      glassEl.appendChild(p);
      countGlassMoved();
      return;
    }
    glassDefaults = {};
    Object.keys(api.defaults).forEach(function (k) { glassDefaults[k] = api.defaults[k]; });
    glassDefaults.shapeRoundness = api.shipped.shapeRoundness;

    /* An override for a uniform the page no longer has is dropped rather than
       carried: it would count as `moved` forever and never reach anything. */
    Object.keys(glass).forEach(function (k) {
      if (!(k in glassDefaults)) delete glass[k];
    });

    /* THE DRIFT CHECK, and it is the same instinct as checkShaderCurrent() one
       section up: frame-glass.js can grow a uniform this table has no row for, and
       both halves look right on their own while it does. Reported rather than
       guessed at, because the answer is on the page. */
    var unreachable = Object.keys(glassDefaults).filter(function (k) {
      return !GLASS_ROWS.some(function (r) { return r.k === k; });
    });
    var absent = GLASS_ROWS.filter(function (r) { return !(r.k in glassDefaults); })
                           .map(function (r) { return r.k; });
    if (unreachable.length || absent.length) {
      var d = document.createElement("p");
      d.className = "note";
      d.textContent = (unreachable.length
          ? "frame-glass.js carries " + unreachable.length + " value" + (unreachable.length === 1 ? "" : "s")
            + " this page has no slider for: " + unreachable.join(", ") + ". "
          : "")
        + (absent.length
          ? "And " + absent.length + " slider" + (absent.length === 1 ? " has" : "s have")
            + " no uniform on the page any more: " + absent.join(", ") + ". "
          : "")
        + "GLASS_GROUPS in this file is behind the shipping page.";
      glassEl.appendChild(d);
    }

    GLASS_GROUPS.forEach(function (g) {
      group(glassEl, g.title, g.key, function (b) {
        g.rows.forEach(function (spec) {
          if (!(spec.k in glassDefaults)) return;
          /* A copy, so the shared table is not given a closure over this frame's
             api — the iframe reloads and the table does not. */
          var s = {};
          Object.keys(spec).forEach(function (p) { s[p] = spec[p]; });
          s.onchange = glassChanged;
          row(b, s,
              function () { return glassValue(spec.k); },
              function (v) { glass[spec.k] = v; },
              glassDefaults[spec.k]);
        });
      });
    });
    countGlassMoved();
  }

  function glassChanged() { applyGlass(true); }

  /* THE ONE FUNCTION THAT REACHES THE SHIPPING PAGE'S SHADER. Every value is
     pushed, not only the moved ones: a control dragged and then put back has to be
     put back on the page too, and the page has no idea a tuner exists. */
  function applyGlass(draw) {
    countGlassMoved();
    var api = glassAPI();
    if (api && glassDefaults) {
      var patch = { backdrop: behind };
      Object.keys(glassDefaults).forEach(function (k) { patch[k] = glassValue(k); });
      api.set(patch);
      if (draw) {
        var t0 = performance.now();
        var ok = api.draw();
        var ms = performance.now() - t0;
        if (behind !== "clip") glassMsEl.textContent = ok ? ms.toFixed(1) + " ms" : "shader refused";
      }
    }
    markClipLoop();
    writePanel();
  }

  /* Counted off the VALUES and not off the `.row.moved` classes, unlike the
     stone's badge. Reset empties `glass` without touching a control, and a badge
     that read the DOM would go on reporting the rows as moved until something
     rebuilt them. */
  function countGlassMoved() {
    if (!glassDefaults) {
      glassCountEl.textContent = "no shader";
      glassCountEl.dataset.n = 0;
      return;
    }
    var n = 0;
    Object.keys(glassDefaults).forEach(function (k) {
      if (String(glassValue(k)) !== String(glassDefaults[k])) n += 1;
    });
    if (behind !== shippedBehind()) n += 1;
    glassCountEl.textContent = n + " moved";
    glassCountEl.dataset.n = n;
  }

  document.getElementById("glassreset").addEventListener("click", function () {
    glass = {};
    behind = shippedBehind();
    markBehind();
    buildGlass();
    applyGlass(true);
    save();
  });

  /* ======================================================================= */
  /*  the exit treatments                                                    */
  /* ======================================================================= */

  /* THE PROPERTY A ROW DRIVES, and the one irregularity in the naming: the three
     text-block multipliers belong to blocks rather than to the group, so they
     are --exit-head-k and not --exit-text-head-k. Spelled out here rather than
     derived twice. */
  function exitProp(g, prop) {
    return /-k$/.test(prop) ? "--exit-" + prop : "--exit-" + g + "-" + prop;
  }
  function exitRowsFor(g) {
    return g === "text" ? EXIT_ROWS.concat(EXIT_TEXT_ROWS) : EXIT_ROWS;
  }
  function exitValue(g, k) {
    var id = g + "." + k;
    return exitVals[id] !== undefined ? exitVals[id] : exitDefaults[id];
  }
  function exitGroup(k) {
    var found = null;
    EXIT_GROUPS.forEach(function (g) { if (g.k === k) found = g; });
    return found;
  }

  /* WHAT THE TREATMENT GIVES YOU, read off the real .panel with every inline
     override taken away first — so "moved" means moved from the chip that is
     selected, and changing chip changes what counts as moved. The same
     discipline the glass reads its defaults under, one step further on: there
     the defaults are a constant of the page, here they are a function of the
     attribute, so they are re-read rather than cached. */
  function readExitDefaults() {
    if (!panel || !win) return;
    var cs = win.getComputedStyle(panel);
    EXIT_GROUPS.forEach(function (g) {
      exitRowsFor(g.k).forEach(function (r) {
        var v = parseFloat(cs.getPropertyValue(exitProp(g.k, r.prop)));
        exitDefaults[g.k + "." + r.k] = isNaN(v) ? 0 : v;
      });
    });
  }

  /* One composition, put where a crossing at progress `t` would have it. Called
     twice when the second page is up: the outgoing Panel at t and the incoming
     one at t - 1, which is the whole of why the scrub is signed. */
  function applyExitTo(p, t, isReal) {
    EXIT_GROUPS.forEach(function (g) {
      p.setAttribute(g.attr, exitPick[g.k]);
      exitRowsFor(g.k).forEach(function (r) { p.style.removeProperty(exitProp(g.k, r.prop)); });
    });
    /* Between the clear and the re-apply is the ONE moment the page is showing
       what the treatment alone says, which is the only moment its defaults can
       be read. */
    if (isReal) readExitDefaults();
    EXIT_GROUPS.forEach(function (g) {
      exitRowsFor(g.k).forEach(function (r) {
        var id = g.k + "." + r.k;
        if (exitVals[id] !== undefined) {
          p.style.setProperty(exitProp(g.k, r.prop), String(exitVals[id]));
        }
      });
    });
    p.style.setProperty("--exit", String(t));
  }

  function applyExit() {
    markExit();
    if (!panel) { writeExit(); return; }
    applyExitTo(panel, exitT, true);
    if (ghostPanel) applyExitTo(ghostPanel, exitT - 1, false);
    measurePresence();
    writeExit();
  }

  /* ---- how thin the two compositions ever get, MEASURED ---------------------
     #74's hardest criterion is that the outgoing Panel leaving and the incoming
     one arriving never leave an empty screen, and the treatments are built so
     that they cannot — every ramp is odd in --exit and spans the whole crossing,
     so whatever has left one composition has arrived on the other. This reads
     that back off the page rather than restating it: each group's opacity at t
     plus the same group's opacity at t - 1, swept, and the worst of them.

     1.000 is presence exactly conserved and is what the straight ramp gives.
     Anything below is the rate control being pushed, and the readout goes amber
     rather than the page pretending it is free. Zero would be an empty screen
     and no setting of these sliders can reach it.
     design/tools/check-panel-exit.mjs asserts the same number at 51 samples
     across every treatment; 21 here is enough to drag against. */
  var PRESENCE_FLOOR = 0.995;
  function measurePresence() {
    if (!panel || !win || !doc) { presenceEl.textContent = ""; return; }
    var probes = EXIT_GROUPS.map(function (g) { return doc.querySelector(g.probe); });
    if (probes.some(function (el) { return !el; })) { presenceEl.textContent = ""; return; }
    function opacitiesAt(t) {
      panel.style.setProperty("--exit", String(t));
      return probes.map(function (el) { return parseFloat(win.getComputedStyle(el).opacity); });
    }
    var worst = Infinity, worstAt = 0, worstG = "";
    for (var i = 0; i <= 20; i++) {
      var u = i / 20;
      var a = opacitiesAt(u), b = opacitiesAt(u - 1);
      for (var j = 0; j < probes.length; j++) {
        var s = a[j] + b[j];
        if (s < worst - 1e-9) { worst = s; worstAt = u; worstG = EXIT_GROUPS[j].label; }
      }
    }
    panel.style.setProperty("--exit", String(exitT));
    presenceEl.textContent = "thinnest moment " + worst.toFixed(3) +
      " of one composition — " + worstG + ", t " + worstAt.toFixed(2);
    presenceEl.className = worst < PRESENCE_FLOOR ? "thin" : "";
  }

  /* ---- the chips ---------------------------------------------------------- */
