  function buildExitChips() {
    EXIT_GROUPS.forEach(function (g) {
      var host = document.getElementById("exit-" + g.k);
      host.textContent = "";
      g.names.forEach(function (t) {
        var b = document.createElement("button");
        b.type = "button";
        b.dataset.exit = t.k;
        b.textContent = t.label;
        b.title = t.tip;
        b.addEventListener("click", function () {
          exitPick[g.k] = t.k;
          exitChosen = true;
          /* The treatment changes what the sliders' defaults ARE, so the rows
             are rebuilt rather than repainted — a row holding the old `was`
             would call an untouched value moved.

             A MOVED SLIDER SURVIVES THE CHIP, which is deliberate and is the
             one thing about this control worth knowing: the chips are starting
             points and the sliders are the choice, so a travel dragged under
             `lift` is still there under `dissolve` and that treatment then
             travels. It cannot happen quietly — the row stays amber against its
             new default, the badge counts it, and the export writes the number
             beside what the chip would have given. `reset exit` is the way back
             to the chips alone. */
          applyExit();
          buildExitControls();
          save();
        });
        host.appendChild(b);
      });
      if (!exitPick[g.k]) exitPick[g.k] = g.names[0].k;
    });
    markExit();
  }

  function countExitMoved() {
    var n = Object.keys(exitVals).length;
    EXIT_GROUPS.forEach(function (g) {
      if (exitShipped[g.k] && exitPick[g.k] !== exitShipped[g.k]) n += 1;
    });
    exitCountEl.textContent = n + " moved";
    exitCountEl.dataset.n = n;
  }

  function markExit() {
    EXIT_GROUPS.forEach(function (g) {
      var host = document.getElementById("exit-" + g.k);
      Array.prototype.forEach.call(host.querySelectorAll("button"), function (b) {
        b.setAttribute("aria-pressed", b.dataset.exit === exitPick[g.k] ? "true" : "false");
      });
    });
    scrubEl.value = String(exitT);
    scrubValEl.textContent = (exitT < 0 ? "" : "+") + exitT.toFixed(3);
    countExitMoved();
  }

  /* WHICH MIXTURE THE PAGE ARRIVED CARRYING, read rather than remembered — the
     same reason readShippedSub() reads the subheading off the document. The three
     attributes are in index.html precisely so that this question has an answer;
     a page that has moved on to a treatment this table does not know reads back
     as null and the export says so instead of quietly calling one of ours
     shipped. */
  function readExitShipped() {
    if (!doc || !panel) return;
    EXIT_GROUPS.forEach(function (g) {
      var v = panel.getAttribute(g.attr);
      var known = g.names.some(function (t) { return t.k === v; });
      exitShipped[g.k] = known ? v : null;
      if (!exitChosen && known) exitPick[g.k] = v;
    });
  }

  /* ---- the sliders -------------------------------------------------------- */
  function buildExitControls() {
    /* No page, no defaults — and a row built against an undefined `was` calls
       every slider moved and reads back NaN. The frame's load event and the
       sidecar's promise both come back here once there is one. */
    if (!exitEl || !panel) return;
    exitEl.textContent = "";
    EXIT_GROUPS.forEach(function (g) {
      group(exitEl, "exit — " + g.label, "exit-" + g.k, function (body) {
        exitRowsFor(g.k).forEach(function (r) {
          var id = g.k + "." + r.k;
          row(body, {
            label: r.label, min: r.min, max: r.max, step: r.step, dp: r.dp, tip: r.tip,
            onchange: applyExit
          }, function () { return exitValue(g.k, r.k); },
             function (v) {
               /* Back to exactly the treatment's own number is not an override,
                  it is having changed your mind — so it leaves the sparse set
                  rather than sitting in it as a value that happens to match. */
               if (Math.abs(v - exitDefaults[id]) < 1e-9) delete exitVals[id];
               else exitVals[id] = v;
             },
             exitDefaults[id]);
        });
      });
    });
  }

  /* ---- the scrub, and running it ------------------------------------------
     WHERE YOU ARE STANDING IS NOT WHAT YOU HAVE CHOSEN, and separating the two
     is what keeps `play` smooth. applyExit() re-reads the defaults, re-applies
     every override and sweeps 21 samples to measure the crossing — none of which
     can change while only the scrub moves, and all of which would run sixty
     times a second through a play. This writes the one number that did change,
     to both compositions. */
  function positionExit() {
    markExit();
    if (!panel) return;
    panel.style.setProperty("--exit", String(exitT));
    if (ghostPanel) ghostPanel.style.setProperty("--exit", String(exitT - 1));
  }
  function setExit(t) {
    exitT = Math.max(-1, Math.min(1, t));
    positionExit();
  }
  scrubEl.addEventListener("input", function () {
    stopPlay();
    setExit(parseFloat(scrubEl.value));
  });
  document.getElementById("settle").addEventListener("click", function () {
    stopPlay();
    setExit(0);
  });

  /* A CROSSING, RUN. The scrub answers "what does it look like here"; this
     answers "does it read", which is the question a still cannot be asked. It
     runs -1 to +1 because that is one whole crossing seen from one Panel — the
     composition arrives, settles for no time at all, and leaves. */
  var PLAY_MS = 2000;
  function stopPlay() {
    if (playLoop) { cancelAnimationFrame(playLoop); playLoop = 0; }
    document.getElementById("play").textContent = "play ▶";
  }
  document.getElementById("play").addEventListener("click", function () {
    if (playLoop) { stopPlay(); return; }
    this.textContent = "stop ■";
    var t0 = performance.now();
    (function step() {
      var u = (performance.now() - t0) / PLAY_MS;
      if (u >= 1) { stopPlay(); setExit(1); return; }
      setExit(-1 + 2 * u);
      playLoop = requestAnimationFrame(step);
    })();
  });

  /* ---- the Panel arriving --------------------------------------------------
     A SECOND /portfolio, STOOD ON THE FIRST WITH ITS GROUND TAKEN AWAY, and the
     stripping is the truthful model rather than a cheat: in a real crossing
     there is ONE page and two compositions on it, so a second document keeping
     its own body background would be showing something that never happens. What
     is left of the second page is the section and nothing else.

     IT IS THE SAME PROJECT, BECAUSE THERE IS ONLY ONE. #58 puts the Eater Map
     and the Record Engine out of scope and #72 is where a second Panel arrives,
     so what stands here is this composition arriving — which is exactly the
     right thing to judge a crossing on, and would be even if there were three.
     Its Rail is moved to the second project so the two can be told apart at a
     glance; that is the one thing about it that is a stand-in. */
  /* WHAT IS TAKEN OFF THE SECOND PAGE, AND WHAT IS DELIBERATELY LEFT ON IT.
     Only things that are out of flow are hidden — the effect stack, the three
     corner pictures, the loading line — so the ghost's layout is the real one to
     the pixel and its composition lands exactly where the first page's does.

     .page IS LEFT ALONE, which looks like an omission and is the opposite. It is
     a screen above the Panel and never on the ghost's screen at all; hiding it
     would change where the section begins in the document, and arrival.js
     measures the crossing into dark against exactly that — so a hidden CV gives
     the ghost a different --dark and a different palette from the page under it,
     which is the one difference that would make the two look like two documents.

     .cut-title GOES INVISIBLE RATHER THAN AWAY, for the reason its own block in
     styles.css gives about the masthead it stands in for: cut-morph.js measures
     it on every scroll, and a display:none element measures as nothing and hands
     the script NaN, which it then writes into an SVG path. `visibility: hidden`
     draws nothing and measures the same as ever. There is one PROJECTS on a
     page and this is the second page's copy of it. */
  function styleGhost() {
    if (!ghostDoc) return;
    var s = ghostDoc.createElement("style");
    s.textContent =
      "html, body { background: transparent !important; }" +
      ".fx, .loading, .car, .eye, .fx-ascii { display: none !important; }" +
      "body::after { display: none !important; }" +
      ".cut-title { visibility: hidden !important; }";
    ghostDoc.head.appendChild(s);
    var rail = ghostDoc.querySelectorAll(".panel-rail li");
    if (rail.length > 1) {
      rail[0].classList.remove("is-selected");
      rail[1].classList.add("is-selected");
    }
  }

  ghost.addEventListener("load", function () {
    ghostDoc = ghost.contentDocument;
    ghostPanel = ghostDoc && ghostDoc.getElementById("projects");
    if (!ghostPanel) return;
    styleGhost();
    ghostPanel.scrollIntoView({ block: "end", behavior: "instant" });
    applyExit();
  });

  function markCrossing() {
    crossBtn.setAttribute("aria-pressed", crossing ? "true" : "false");
    ghost.hidden = !crossing;
    if (crossing && !ghost.getAttribute("src")) ghost.setAttribute("src", "/portfolio/");
  }
  crossBtn.addEventListener("click", function () {
    crossing = !crossing;
    markCrossing();
    applyExit();
    save();
  });

  document.getElementById("exitreset").addEventListener("click", function () {
    exitVals = {};
    EXIT_GROUPS.forEach(function (g) {
      if (exitShipped[g.k]) exitPick[g.k] = exitShipped[g.k];
    });
    exitChosen = false;
    exitT = 0;
    /* The full path and not setExit(), because this is the one place the scrub
       moves AND the values behind it do. */
    applyExit();
    buildExitControls();
    save();
  });

  /* ======================================================================= */
  /*  the previz                                                             */
  /* ======================================================================= */

  var gl = null, prog = null, U = {}, glCanvas = null, lastURL = "";
  var PREVIEW_W = 1500;      /* half the plate, which is plenty to judge a vein */

  var VERT =
    "attribute vec2 p; varying vec2 uv;" +
    "void main(){ uv = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5); gl_Position = vec4(p, 0.0, 1.0); }";

  /* The material and the block, in one fragment shader.
     Read it against build-slab.py: vein_mask() is veinMask() here line for line,
     build_material()'s layering is material(), and the projection is the three
     lines under `the camera` inverted. */
  var FRAG = [
    "precision highp float;",
    "varying vec2 uv;",
    /* the block and the camera, all from slab.json */
    "uniform float uNearHalf, uDepth, uHeight, uD, uH, uXHalf, uYTop, uYBot;",
    /* the material */
    "uniform vec3 uGround;",
    "uniform float uBaseRough;",
    "uniform int uN;",
    "uniform float uScale[4], uDetail[4], uDist[4], uWidth[4], uSharp[4], uRough[4], uBump[4];",
    "uniform vec3 uColour[4];",
    "uniform float uBumpStrength, uBumpDist, uBumpClamp, uPx;",
    "uniform vec2 uTexel;",
    /* the light */
    "uniform vec3 uKeyPos, uFillPos;",
    "uniform float uKeyE, uFillE, uKeyExt, uFillExt, uKeyGain, uFillGain;",
    "",
    "const float PI = 3.14159265;",
    "",
    /* Gradient noise. NOT Blender's Perlin — see the header. Same family, same
       feel, different field, which is why a vein lands somewhere else. */
    "vec3 hash3(vec3 p){",
    "  p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),",
    "           dot(p, vec3(269.5, 183.3, 246.1)),",
    "           dot(p, vec3(113.5, 271.9, 124.6)));",
    "  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);",
    "}",
    "float pnoise(vec3 p){",
    "  vec3 i = floor(p), f = fract(p);",
    "  vec3 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(mix(dot(hash3(i + vec3(0,0,0)), f - vec3(0,0,0)),",
    "                     dot(hash3(i + vec3(1,0,0)), f - vec3(1,0,0)), u.x),",
    "                 mix(dot(hash3(i + vec3(0,1,0)), f - vec3(0,1,0)),",
    "                     dot(hash3(i + vec3(1,1,0)), f - vec3(1,1,0)), u.x), u.y),",
    "             mix(mix(dot(hash3(i + vec3(0,0,1)), f - vec3(0,0,1)),",
    "                     dot(hash3(i + vec3(1,0,1)), f - vec3(1,0,1)), u.x),",
    "                 mix(dot(hash3(i + vec3(0,1,1)), f - vec3(0,1,1)),",
    "                     dot(hash3(i + vec3(1,1,1)), f - vec3(1,1,1)), u.x), u.y), u.z);",
    "}",
    /* Detail as a fractional octave count, the last one faded in, which is what
       Blender's Detail input does. Roughness 0.48 is build-slab.py's. */
    "float fbm(vec3 p, float detail){",
    "  float sum = 0.0, amp = 1.0, norm = 0.0, sc = 1.0;",
    "  for (int i = 0; i < 8; i++){",
    "    float w = clamp(detail - float(i), 0.0, 1.0);",
    "    if (w <= 0.0) break;",
    "    sum += w * amp * pnoise(p * sc);",
    "    norm += w * amp;",
    "    amp *= 0.48; sc *= 2.0;",
    "  }",
    "  return sum / max(norm, 1e-5);",
    "}",
    /* Blender's Distortion offsets the (already scaled) input by noise per axis,
       which is what turns a contour map into something that branches. */
    "vec3 warp(vec3 p, float d){",
    "  if (d <= 0.0) return p;",
    "  return p + d * vec3(pnoise(p + vec3(13.5, 0.0, 0.0)),",
    "                      pnoise(p + vec3(0.0, 13.5, 0.0)),",
    "                      pnoise(p + vec3(0.0, 0.0, 13.5)));",
    "}",
    "float nfac(vec3 p, float detail){ return clamp(0.5 + 1.4 * fbm(p, detail), 0.0, 1.0); }",
    /* THE LEVEL SET, and this is vein_mask() from build-slab.py exactly: the
       field minus its own middle, absolute, mapped through `width` and clamped,
       then raised to `sharpness`. A vein is where the field crosses its middle. */
    "float veinMask(vec3 p, float scale, float detail, float dist, float width, float sharp){",
    "  float f = nfac(warp(p * scale, dist), detail);",
    "  float m = clamp(1.0 - abs(f - 0.5) / max(width, 1e-6), 0.0, 1.0);",
    "  return pow(m, sharp);",
    "}",
    /* The bump height field: the first set's mask, with the others added onto it
       weighted by their own `bump` — a Mix RGB set to ADD with Factor = bump is
       A + bump * B, which is what build_material() wires up. */
    "float height(vec3 p){",
    "  float h = 0.0;",
    "  for (int i = 0; i < 4; i++){",
    "    if (i >= uN) break;",
    "    float m = veinMask(p, uScale[i], uDetail[i], uDist[i], uWidth[i], uSharp[i]);",
    "    h += (i == 0) ? m : uBump[i] * m;",
    "  }",
    "  return h;",
    "}",
    /* Colour and roughness, layered in the same order and by the same masks. */
    "void material(vec3 p, out vec3 albedo, out float rough){",
    "  albedo = uGround;",
    "  rough = uBaseRough;",
    "  for (int i = 0; i < 4; i++){",
    "    if (i >= uN) break;",
    "    float m = veinMask(p, uScale[i], uDetail[i], uDist[i], uWidth[i], uSharp[i]);",
    "    albedo = mix(albedo, uColour[i], m);",
    "    rough = mix(rough, uRough[i], m);",
    "  }",
    "}",
    /* One light. Its x extent is 10 against a block 1.19 wide, so it is
       effectively infinite across and its direction has no x component — which
       is why the render is flat across the whole width and a point light here
       would have put a hotspot in the middle of it. `ext` is the light's angular
       half-size, which widens the lobe: the cheap stand-in for integrating over
       an area, and without it a roughness of 0.07 is a mirror and the top face
       comes out as one blown line instead of a sweep.

       IT IS A QUARTER OF THE LIGHT'S EXTENT AND NOT A HALF, which is a factor of
       two that shows up as the whole shape of the top face. The lobe is a
       function of the HALF-VECTOR's angle off the normal, and that angle is half
       the angle between the mirror ray and the light — so a light subtending
       0.031 rad at the surface widens the lobe by 0.0157, not 0.031. At a half
       the top face ramped 39 -> 48 against a render that ramps 38 -> 84: the
       sweep was there and was a third of its depth, which reads as a plinth lit
       from nowhere in particular. At a quarter it is 49 -> 82. */
    "vec3 lamp(vec3 P, vec3 N, vec3 V, vec3 Lp, float energy, float ext, vec3 albedo, float rough){",
    "  vec3 d = Lp - P; d.x = 0.0;",
    "  float dd = max(dot(d, d), 1e-4);",
    "  vec3 L = normalize(d);",
    "  float ndl = dot(N, L);",
    "  if (ndl <= 0.0) return vec3(0.0);",
    "  float a = clamp(rough * rough + ext / sqrt(dd), 1e-3, 1.0);",
    /* THE SPECULAR IS EVALUATED IN THE Y-Z PLANE, and the x components are
       dropped from the VIEW and the NORMAL as well as from the light — which is
       the same approximation applied three times instead of once, and getting
       that wrong is a four-order-of-magnitude bug rather than a slight one.
       Zeroing d.x says the light is a line running across the block: ten units
       against a block of 1.19, so every point sees it in the same direction and
       the render is flat across its whole width. But the camera is a POINT, so
       V keeps a real x component — up to 0.24 at the block's end — and a
       half-vector built from an x-free L and an x-ful V tilts off the normal by
       0.22 rad where the lobe is 0.02 rad wide. Measured, the top face came out
       at 3 of 255 across its whole width while the centreline alone was right.
       Under a line light the reflection genuinely is x-invariant, so the fix is
       the honest one and not a fudge: project the geometry into the plane the
       light varies in. It also means the bump's ACROSS-block relief shows up in
       diffuse only, which is the same statement — a normal knocked sideways
       still points along the light. */
    "  vec3 Np = normalize(vec3(0.0, N.y, N.z));",
    "  vec3 Vp = normalize(vec3(0.0, V.y, V.z));",
    "  vec3 Hv = normalize(L + Vp);",
    "  float ndh = max(dot(Np, Hv), 0.0);",
    "  float dn = ndh * ndh * (a * a - 1.0) + 1.0;",
    "  float D = a * a / max(PI * dn * dn, 1e-8);",
    "  float ndv = max(dot(Np, Vp), 1e-3);",
    "  float ndlp = max(dot(Np, L), 1e-3);",
    "  float k = a * 0.5;",
    "  float G = (ndv / (ndv * (1.0 - k) + k)) * (ndlp / (ndlp * (1.0 - k) + k));",
    "  float spec = D * G * 0.04652 / (4.0 * ndv);",
    /* Diffuse keeps the FULL normal — it is a cosine and has no lobe to miss,
       so there is nothing to approximate away. */
    "  return energy / dd * (albedo * ndl / PI + vec3(spec));",
    "}",
    "float srgb(float c){ return c <= 0.0031308 ? c * 12.92 : 1.055 * pow(c, 1.0 / 2.4) - 0.055; }",
    "",
    /* One sample: the block at one point of the plate, in linear light, with
       coverage in .a — 0 where the ray missed the stone altogether, which is the
       silhouette and is what the plate carries in its alpha channel. */
    "vec4 sample1(vec2 st){",
    /* The plate's own screen space, from slab.json, so this lands on the same
       pixels the render does. */
    "  float sx = mix(-uXHalf, uXHalf, st.x);",
    "  float sy = mix(uYTop, uYBot, st.y);",
    "  float arris = -uH / uD;",
    "  vec3 P, N, T, B;",
    "  if (sy >= arris) {",
    /* The top face: Z = 0, so sy = -h/(Y+d) inverts straight to Y. */
    "    float Y = clamp(-uH / sy - uD, 0.0, uDepth);",
    "    float X = sx * (Y + uD);",
    "    if (abs(X) > uNearHalf) return vec4(0.0);",
    "    P = vec3(X, Y, 0.0); N = vec3(0.0, 0.0, 1.0);",
    "    T = vec3(1.0, 0.0, 0.0); B = vec3(0.0, 1.0, 0.0);",
    "  } else {",
    /* The front face: Y = 0, so sy = (Z - h)/d inverts to Z. Full width, which
       is why the plate is a trapezoid over a rectangle. */
    "    float Z = sy * uD + uH;",
    "    float X = sx * uD;",
    "    if (Z < -uHeight || abs(X) > uNearHalf) return vec4(0.0);",
    "    P = vec3(X, 0.0, Z); N = vec3(0.0, -1.0, 0.0);",
    "    T = vec3(1.0, 0.0, 0.0); B = vec3(0.0, 0.0, 1.0);",
    "  }",
    /* Object space, not world: build-slab.py applies the cube's SCALE but not
       its location, so the material's Object coordinates are measured from the
       block's centre. Getting this wrong moves every vein. */
    "  vec3 pObj = P - vec3(0.0, uDepth * 0.5, -uHeight * 0.5);",
    "  vec3 albedo; float rough;",
    "  material(pObj, albedo, rough);",
    /* THE BUMP, and it is clamped, which is the one place this shader knowingly
       departs from build-slab.py rather than merely approximating it.
       The height field is vein masks, and a mask crosses from 0 to 1 across a
       band a few ten-thousandths of a unit wide — so its world gradient runs
       into the thousands and Strength x Distance x that is a normal tilted by
       twenty degrees. Cycles survives it: it integrates an area light ten units
       wide, so a normal knocked sideways still finds it. This evaluates ONE
       direction, where the top face is a near-mirror off a light subtending two
       hundredths of a radian, and a tilt that size does not scatter the
       reflection so much as delete it — measured, the top face came out flat at
       37 where the plate ramps 39 to 85.
       So the perturbation is capped at a few degrees. The veins keep their
       relief and the mirror keeps the sweep, which is the pair that has to
       survive; what is lost is bump beyond the cap, and the previz says nothing
       useful about that. Read a plate for it. */
    "  float e = uPx;",
    "  float gT = (height(pObj + T * e) - height(pObj - T * e)) / (2.0 * e);",
    "  float gB = (height(pObj + B * e) - height(pObj - B * e)) / (2.0 * e);",
    "  vec3 pert = uBumpStrength * uBumpDist * (gT * T + gB * B);",
    "  float pl = length(pert);",
    "  if (pl > uBumpClamp) pert *= uBumpClamp / pl;",
    "  N = normalize(N - pert);",
    "  vec3 V = normalize(vec3(0.0, -uD, uH) - P);",
    "  vec3 c = lamp(P, N, V, uKeyPos, uKeyE * uKeyGain, uKeyExt, albedo, rough)",
    "         + lamp(P, N, V, uFillPos, uFillE * uFillGain, uFillExt, albedo, rough);",
    "  return vec4(c, 1.0);",
    "}",
    "",
    /* NINE SAMPLES A PIXEL, on a regular grid, and it is not a nicety. At scale
       34 and width 0.012 a hairline is about half a plate pixel across, so it is
       SUB-PIXEL — as it is in the render, which answers that with 1024 Cycles
       samples. One sample per pixel here made a stone that shimmered under the
       sliders and could not be judged: the vein you widened flickered in and out
       instead of getting wider. Nine is enough to make the change monotonic, and
       it also antialiases the silhouette, which the alpha channel needs. */
    "void main(){",
    "  vec4 acc = vec4(0.0);",
    "  for (int j = 0; j < 3; j++){",
    "    for (int i = 0; i < 3; i++){",
    "      vec2 o = ((vec2(float(i), float(j)) + 0.5) / 3.0 - 0.5) * uTexel;",
    "      acc += sample1(uv + o);",
    "    }",
    "  }",
    "  if (acc.a <= 0.0) discard;",
    /* Straight alpha, not premultiplied: the colour is the mean of the samples
       that HIT, and the coverage is how many did. The plate is used as a CSS
       background image, where a premultiplied edge is a dark fringe. */
    "  vec3 c = acc.rgb / acc.a;",
    "  gl_FragColor = vec4(srgb(c.r), srgb(c.g), srgb(c.b), acc.a / 9.0);",
    "}"
  ].join("\n");

  function initGL() {
    glCanvas = document.createElement("canvas");
    glCanvas.width = PREVIEW_W;
    glCanvas.height = Math.max(1, Math.round(PREVIEW_W * slab.plate.h / slab.plate.w));
    gl = glCanvas.getContext("webgl", { alpha: true, premultipliedAlpha: false,
                                        preserveDrawingBuffer: true, antialias: true });
    if (!gl) { warn("no WebGL in this browser — the baked plates still work, the previz does not."); return; }
    var vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return;
    prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      warn("previz shader would not link: " + gl.getProgramInfoLog(prog));
      prog = null; return;
    }
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ["uNearHalf", "uDepth", "uHeight", "uD", "uH", "uXHalf", "uYTop", "uYBot",
     "uGround", "uBaseRough", "uN", "uBumpStrength", "uBumpDist", "uBumpClamp",
     "uPx", "uTexel",
     "uKeyPos", "uFillPos", "uKeyE", "uFillE", "uKeyExt", "uFillExt",
     "uKeyGain", "uFillGain",
     "uScale[0]", "uDetail[0]", "uDist[0]", "uWidth[0]", "uSharp[0]",
     "uRough[0]", "uBump[0]", "uColour[0]"].forEach(function (n) {
      U[n] = gl.getUniformLocation(prog, n);
      if (U[n] === null) warn("previz uniform " + n + " did not resolve — the shader is not being driven.");
    });
  }

  function sh(kind, src) {
    var s = gl.createShader(kind);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      warn("previz shader would not compile: " + gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  function drawLive() {
    if (!prog) return;
    var t0 = performance.now();
    var b = slab.block, c = slab.camera, key = slab.lights.key, fill = slab.lights.fill;
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform1f(U.uNearHalf, b.near_half);
    gl.uniform1f(U.uDepth, b.depth);
    gl.uniform1f(U.uHeight, b.height);
    gl.uniform1f(U.uD, c.d);
    gl.uniform1f(U.uH, c.h);
    gl.uniform1f(U.uXHalf, c.x_half);
    gl.uniform1f(U.uYTop, c.y_top);
    gl.uniform1f(U.uYBot, c.y_bot);

    gl.uniform3fv(U.uGround, new Float32Array(live.ground));
    gl.uniform1f(U.uBaseRough, live.baseRough === undefined ? slab.base_rough : live.baseRough);
    gl.uniform1f(U.uBumpStrength, 0.06);   /* the Bump node's, in build-slab.py */
    gl.uniform1f(U.uBumpDist, 0.004);
    gl.uniform1f(U.uBumpClamp, 0.06);      /* ...and this one is only the previz's */
    /* One output pixel, in world units across the near edge — the step the
       height field's gradient is taken over, so the relief is a per-pixel one
       and the sub-pixel hairlines alias rather than exploding the derivative. */
    gl.uniform1f(U.uPx, 2.0 * b.near_half / glCanvas.width);
    gl.uniform2f(U.uTexel, 1 / glCanvas.width, 1 / glCanvas.height);

    /* Position, energy, and the extent that widens the lobe — the light's own
       depth, which is the axis the reflection actually sweeps along. */
    gl.uniform3fv(U.uKeyPos, new Float32Array(key[0]));
    gl.uniform3fv(U.uFillPos, new Float32Array(fill[0]));
    gl.uniform1f(U.uKeyE, key[3]);
    gl.uniform1f(U.uFillE, fill[3]);
    gl.uniform1f(U.uKeyExt, key[2] * 0.25);
    gl.uniform1f(U.uFillExt, fill[2] * 0.25);
    gl.uniform1f(U.uKeyGain, cal.key);
    gl.uniform1f(U.uFillGain, cal.fill);

    var n = Math.min(MAX_SETS, live.veins.length);
    gl.uniform1i(U.uN, n);
    var f = { scale: [], detail: [], dist: [], width: [], sharp: [], rough: [], bump: [], colour: [] };
    for (var i = 0; i < MAX_SETS; i++) {
      var v = live.veins[Math.min(i, live.veins.length - 1)];
      f.scale.push(v[fieldIndex("scale")]);
      f.detail.push(v[fieldIndex("detail")]);
      f.dist.push(v[fieldIndex("distortion")]);
      f.width.push(v[fieldIndex("width")]);
      f.sharp.push(v[fieldIndex("sharpness")]);
      f.rough.push(v[fieldIndex("rough")]);
      f.bump.push(v[fieldIndex("bump")]);
      var col = v[fieldIndex("colour")];
      f.colour.push(col[0], col[1], col[2]);
    }
    gl.uniform1fv(U["uScale[0]"], new Float32Array(f.scale));
    gl.uniform1fv(U["uDetail[0]"], new Float32Array(f.detail));
    gl.uniform1fv(U["uDist[0]"], new Float32Array(f.dist));
    gl.uniform1fv(U["uWidth[0]"], new Float32Array(f.width));
    gl.uniform1fv(U["uSharp[0]"], new Float32Array(f.sharp));
    gl.uniform1fv(U["uRough[0]"], new Float32Array(f.rough));
    gl.uniform1fv(U["uBump[0]"], new Float32Array(f.bump));
    gl.uniform3fv(U["uColour[0]"], new Float32Array(f.colour));

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    lastURL = glCanvas.toDataURL("image/png");
    msEl.textContent = Math.round(performance.now() - t0) + " ms  " +
                       glCanvas.width + "\u00d7" + glCanvas.height;

    /* The strip's row for an unbaked stone, so the thing being dragged is
       visible at plate width as well as in the composition. */
    var thumb = sheetEl.querySelector('button[data-stone="' + pick + '"] canvas');
    if (thumb) {
      var ctx = thumb.getContext("2d");
      ctx.clearRect(0, 0, thumb.width, thumb.height);
      ctx.drawImage(glCanvas, 0, 0, thumb.width, thumb.height);
    }
  }

  /* ---- the export -------------------------------------------------------- */

  function writeExport() {
    if (!live) return;
    var name = pick;
    var ind = "        ";
    var lines = [];
    var add = live.photo ? addedStone(name) : null;
    if (add) {
      /* An added stone exports as the COMMAND that would make another one,
         because that is the only form of it that works. Pasting its entry into
         PHOTO_CANDIDATES under a new name would give a stone pointing at
         design/plinth/maps/, which is the gemini photograph's maps and not this
         one's — a copy that bakes cleanly and comes out as a different rock. */
      lines.push("# design/plinth/stones/" + name + ".json, added by add-stone.py.");
      lines.push("# Nothing on this stone is tunable from here. For a variant, run");
      lines.push("# this against the same photograph and change what you want:");
      /* --name takes the STEM, not the key: add-stone.py appends the style to
         it, so passing the key back in would ask for `<name>-screen-fine-noir`
         and three others nobody wanted. */
      var stem = add.stem || name;
      var style = name.indexOf(stem + "-") === 0 ? name.slice(stem.length + 1) : null;
      lines.push("python design/plinth/add-stone.py \\");
      lines.push("    --src " + (add.src || "<photo>") + " --name " + stem + "-2"
                 + (style ? " --styles " + style : "") + " \\");
      lines.push("    --grade " + live.photo.grade + " --scale " + live.photo.scale
                 + " --offset " + live.photo.offset + " \\");
      lines.push("    --bump " + live.photo.bump.join(" ")
                 + " --sss " + live.photo.sss + " --coat " + live.photo.coat.join(" ") + " \\");
      lines.push("    --rough " + live.photo.rough + " --room " + (live.photo.room || "flat")
                 + (live.photo.crack ? " --crack" : ""));
      outPy.value = lines.join("\n") + "\n";
      writeCss(name);
      return;
    }
    if (live.photo) {
      /* The PHOTO_CANDIDATES entry as it stands, not as edited — nothing here
         is editable. It is exported anyway because the useful thing to copy off
         a photo stone is a STARTING POINT for the next one: paste it under a new
         name, change the scale or the grade, and bake. */
      lines.push("# design/plinth/build-slab.py - PHOTO_CANDIDATES, as it stands.");
      lines.push("# Nothing on this stone is tunable from here; copy it under a new");
      lines.push("# name, change what you want and re-bake:");
      lines.push("#     blender -b -P design/plinth/build-slab.py -- " + name);
      lines.push('    "' + name + '": {');
      lines.push('        "title": "' + live.title.replace(/"/g, "'") + '",');
      (slab.photo_fields || []).forEach(function (f) {
        var v = live.photo[f];
        if (v === undefined || v === null) return;
        lines.push('        "' + f + '": ' + pyVal(v) + ",");
      });
      lines.push("    },");
      outPy.value = lines.join("\n") + "\n";
      writeCss(name);
      return;
    }
    lines.push("# design/plinth/build-slab.py - into CANDIDATES. The previz this came");
    lines.push("# from is not Cycles: the pattern will differ, so BAKE IT to confirm.");
    lines.push('    "' + name + '": {');
    lines.push('        "title": "' + live.title.replace(/"/g, "'") + '",');
    lines.push("        GROUND: (" + live.ground.map(function (c) { return c.toFixed(3); }).join(", ") + "),");
    lines.push('        "veins": [');
    live.veins.forEach(function (v) {
      var col = v[fieldIndex("colour")];
      lines.push(ind + "    (" + [
        v[fieldIndex("scale")].toFixed(1),
        v[fieldIndex("detail")].toFixed(1),
        v[fieldIndex("distortion")].toFixed(1),
        v[fieldIndex("width")].toFixed(3),
        v[fieldIndex("sharpness")].toFixed(1),
        "(" + col.map(function (c) { return c.toFixed(2); }).join(", ") + ")",
        v[fieldIndex("rough")].toFixed(2),
        v[fieldIndex("bump")].toFixed(2)
      ].join(", ") + "),");
    });
    lines.push("        ],");
    lines.push("    },");
    if (live.baseRough !== undefined && Math.abs(live.baseRough - slab.base_rough) > 1e-9) {
      lines.push("");
      lines.push("# ...and BASE_ROUGH is global, so this moves every candidate:");
      lines.push("BASE_ROUGH = " + live.baseRough.toFixed(3) +
                 "   # was " + slab.base_rough);
    }
    outPy.value = lines.join("\n") + "\n";
    writeCss(name);
  }

  /* The second export box, split out of writeExport() so a photo stone can
     reach it without going through the vein-set serialiser above. It says the
     same thing for both families: which rule the stylesheet needs, and the one
     command that re-bakes and prints a new digest. */
  function writeCss(name) {
    var css = [];
    /* A photo stone HAS a plate but has no rule — the stylesheet only carries
       the four procedural ones — so it needs the same line an unbaked stone
       does. Keying this on `baked` alone sent it to the "already has a rule"
       branch and quietly told you there was nothing to add. */
    if (!stones[name].baked || stones[name].photo) {
      css.push("/* portfolio/styles.css, under the .panel-plinth block. A stone with no");
      css.push("   rule fails as a missing image rather than a missing rule, which is why");
      css.push("   this line and the bake go together. */");
      css.push('.panel[data-marble="' + name + '"] { --panel-plinth-src: url("img/tex/plinth-' +
               name + '.webp?v=' + (slab.version || "XXXXXXXX") + '"); }');
      css.push("");
    } else {
      css.push("/* `" + name + "` already has a rule and a plate. Re-baking it changes the");
      css.push("   digest, so the ?v= on ALL FOUR url()s moves together. */");
      css.push("");
    }
    css.push("# then, from the repo root:");
    css.push('"C:/Program Files/Blender Foundation/Blender 5.2/blender.exe" -b \\');
    css.push("    -P design/plinth/build-slab.py -- " + name);
    css.push("# it prints the new PLINTH_VERSION to paste over every ?v=");
    outCss.value = css.join("\n") + "\n";
  }

  /* ---- the export: the other three decisions -------------------------------
     ONE BLOCK, THREE CHOICES, AND THE GLASS HALF IS WRITTEN IN THE SHAPE
     design/glass-tuner.html's OWN DRAWER EMITS — the same header lines, the same
     "changed from default" table, and the same `glass-state v2:` blob at the foot.
     That is not a courtesy. Pasting this into that page's box and pressing import
     puts the material back exactly, so a number arrived at over the real
     composition can be carried to the page where the four passes can be stepped
     through one at a time, and carried back. It works because the keys are
     frame-glass.js's and frame-glass.js's are that tuner's.

     WITHOUT THE REFERENCE LINE THE NUMBERS MEAN NOTHING. Every length is a CSS px
     at a Frame 1200 wide and the refraction offset is multiplied by the device
     pixel ratio inside the shader, so the same settings on a 2x display bend twice
     as far. Both travel with the export, as they do there.

     WHAT SHIPPING A CHOICE WOULD ACTUALLY TAKE is spelled out per treatment rather
     than left as "set the attribute". Two of the three need a stylesheet change as
     well, because the shader is only the top rung of a three-rung ladder and the
     two below it read the page rather than a uniform — a backdrop switched in
     frame-glass.js alone would be one thing under WebGL2 and another under
     `backdrop-filter`. */
  var BEHIND_SHIP = {
    dark: [
      "This is what ships. Nothing to change."
    ],
    marble: [
      "NOT what ships. To ship it:",
      "  portfolio/frame-glass.js  —  var backdrop = \"marble\";",
      "  portfolio/styles.css      —  .panel-frame's fill has to start BELOW the",
      "    titlebar, or the two lower rungs go on showing the window's body through",
      "    a translucent bar while the shader shows the page. Something like:",
      "      background: linear-gradient(to bottom,",
      "                    transparent 0 var(--frame-bar),",
      "                    var(--panel-frame-fill) var(--frame-bar));",
      "  Worth being sure first: the Panel is flat black behind the Frame today, so",
      "  this moves the glass's body from the render's own (44,38,49) to (27,19,28),",
      "  and only once --dark has crossed. #66 measured it as",
      "  indistinguishable from `dark` in the design render."
    ],
    clip: [
      "NOT what ships, and it is the expensive one. To ship it:",
      "  portfolio/frame-glass.js  —  var backdrop = \"clip\";  ...AND the",
      "    render-once promise in that file's header comes off with it. The backdrop",
      "    moves, so the four passes run every frame for as long as the page is",
      "    open, and the reflection is re-blitted on every one of them. Nothing",
      "    else on this Panel renders per frame; the figure beside the chips is what",
      "    it costs on this display.",
      "  portfolio/styles.css      —  .frame-content { top: 0 }, so the recording's",
      "    box starts at the Frame's top edge rather than below the titlebar. Its",
      "    own corner radius then rounds the recording's two top corners, which the",
      "    scene painter does not draw.",
      "  design/tools/render.mjs   —  the tier probe still reports `webgl` and that",
      "    is no longer the whole truth. Worth a second probe that says how often."
    ]
  };

  /* The titlebar's height at the reference width, and the ratio the shader was
     handed. Both measured off the frame rather than restated: the bar is
     3.4583cqw of a Frame that is nine of twelve fluid columns, so its height in
     CSS px is a different number in every window. */
  function glassReference() {
    var api = glassAPI();
    var refW = api ? api.reference.w : 1200;
    var b = doc && doc.querySelector(".panel-stage > .panel-frame > .frame-bar");
    var r = b && b.getBoundingClientRect();
    return {
      w: refW,
      bar: r && r.width ? r.height * (refW / r.width) : null,
      dpr: win ? Math.min(win.devicePixelRatio || 1, 2) : null
    };
  }

  /* Numbers as numbers, strings quoted, booleans as booleans — the three kinds the
     glass carries, written the way JavaScript would take them back. */
  function jsVal(v) {
    if (typeof v === "string") return '"' + v + '"';
    if (typeof v === "boolean") return v ? "true" : "false";
    return String(v);
  }

  function writePanel() {
    if (!outPanel) return;
    var L = [];
    L.push("panel tuner — the Projects Panel's variants, chosen over the real composition");
    L.push("");

    L.push("SUBHEADING — " + (sub + 1) + " of " + SUBS.length + ", " +
           (shippedSub < 0 ? "and the page is carrying a sixth"
            : shippedSub === sub ? "which is what ships" : "moved from what ships"));
    L.push("portfolio/index.html, in .panel-head. Sentence case, because .panel-sub is");
    L.push("text-transform: uppercase and the markup is written the way it is read:");
    L.push('    <p class="panel-sub"><span>' + SUBS[sub].a + "</span> <span>" + SUBS[sub].b + "</span></p>");
    if (shippedSub < 0) {
      L.push("The page's own wording is not one of #57's five, so nothing above is marked");
      L.push("as shipped. Either index.html has moved on or SUBS in the tuner has.");
    }
    L.push("");

    var spec = null;
    BEHIND.forEach(function (t) { if (t.k === behind) spec = t; });
    L.push("BEHIND THE GLASS — `" + behind + "`, " + (spec ? spec.label : behind));
    (BEHIND_SHIP[behind] || []).forEach(function (s) { L.push(s); });
    L.push("");

    if (!glassDefaults) {
      /* Two different reasons for the same missing half, and they are worth
         telling apart: before the iframe has loaded there is nothing to have
         found yet, and after it there is a browser that got the CSS rung.
         Reported as the second either way, this box said "no shader" for the
         moment before the frame arrived. */
      L.push(doc
        ? "GLASS — no shader on the page, so nothing was tuned and nothing is exported."
        : "GLASS — the frame has not loaded yet, so nothing has been read off it.");
      outPanel.value = L.join("\n") + "\n";
      return;
    }
    var ref = glassReference();
    var moved = Object.keys(glassDefaults).filter(function (k) {
      return String(glassValue(k)) !== String(glassDefaults[k]);
    });
    L.push("GLASS — " + moved.length + " control" + (moved.length === 1 ? "" : "s") +
           " moved from what ships");
    L.push("glass-tuner v2 — liquid-glass-studio settings, the Panel's titlebar");
    L.push("reference: Frame " + ref.w + " CSS px wide, titlebar " +
           (ref.bar === null ? "unmeasured" : ref.bar.toFixed(1)) +
           " — scale every length with the Frame's width");
    L.push("rendering at dpr " + (ref.dpr === null ? "unknown" : ref.dpr.toFixed(2)) +
           " (this display, capped at 2 the way frame-glass.js caps it)");
    if (!moved.length) {
      L.push("every control at what frame-glass.js already carries.");
    } else {
      L.push("changed from default (" + moved.length + "):");
      var wide = 0;
      moved.forEach(function (k) { wide = Math.max(wide, k.length); });
      moved.forEach(function (k) {
        var name = k;
        while (name.length < wide) name += " ";
        var v = String(glassValue(k));
        while (v.length < 9) v += " ";
        L.push("  " + name + "  " + v + "  ships " + glassDefaults[k]);
      });
      L.push("");
      L.push("portfolio/frame-glass.js — the GLASS block, and ROUNDNESS beside it:");
      /* Written as the two declarations it replaces, braces and all, rather than as
         a list of entries. A fragment is a paste that has to be reasoned about at
         the moment it is least likely to be. */
      var entries = [];
      GLASS_ROWS.forEach(function (r) {
        if (r.k === "shapeRoundness" || !(r.k in glassDefaults)) return;
        entries.push("    " + r.k + ": " + jsVal(glassValue(r.k)));
      });
      L.push("  var GLASS = {");
      entries.forEach(function (e, i) { L.push(e + (i < entries.length - 1 ? "," : "")); });
      L.push("  };");
      L.push("  var ROUNDNESS = " + glassValue("shapeRoundness") + ";");
    }
    L.push("");
    /* The blob design/glass-tuner.html's import button reads. `backdrop` is one of
       its own chips and `shapeRoundness` one of its own rows, so the treatment and
       the corner travel with the material rather than being described beside it. */
    var state = { backdrop: behind };
    Object.keys(glassDefaults).forEach(function (k) { state[k] = glassValue(k); });
    L.push("glass-state v2: " + JSON.stringify(state));
    outPanel.value = L.join("\n") + "\n";
  }

  /* ---- the export: the exit -----------------------------------------------
     THE MIXTURE AND THEN THE NUMBERS, in that order, because they are two
     different sizes of decision. Picking three chips is a markup line; dragging
     a slider past one of them is a stylesheet change, and it is written out as
     the declarations it actually is rather than as a table to be transcribed.

     A MOVED SLIDER IS OFFERED TWO WAYS AND BOTH ARE HONEST. Pasted into the
     named rule it redefines that treatment for everything that ever selects it;
     pasted as a new name it becomes a sixth chip. Which one is wanted is a
     question about whether the author has improved `lift` or invented something
     else, and no tuner can answer that — so it says both and names the file.

     THE PRESENCE FIGURE TRAVELS WITH IT, because it is the one number that can
     be pushed into a defect by a slider that looks harmless. 1.000 is presence
     exactly conserved across a crossing; the rate control is the only thing that
     moves it and the export says where it ended up. */
  function writeExit() {
    if (!outExit) return;
    var L = [];
    L.push("panel tuner — the exit treatments, #74");
    L.push("");

    if (!panel) {
      L.push("the frame has not loaded yet, so nothing has been read off the page.");
      outExit.value = L.join("\n") + "\n";
      return;
    }

    var same = EXIT_GROUPS.every(function (g) { return exitPick[g.k] === exitShipped[g.k]; });
    var unknown = EXIT_GROUPS.filter(function (g) { return !exitShipped[g.k]; });
    L.push("THE MIXTURE — " + EXIT_GROUPS.map(function (g) {
      return g.k + " " + exitPick[g.k];
    }).join(", ") + (same ? ", which is what ships" : ", moved from what ships"));
    L.push("portfolio/index.html, on <section class=\"panel\">:");
    L.push("    " + EXIT_GROUPS.map(function (g) {
      return g.attr + '="' + exitPick[g.k] + '"';
    }).join(" "));
    if (unknown.length) {
      L.push("The page is carrying " + unknown.map(function (g) {
        return g.attr + '="' + (panel.getAttribute(g.attr) || "nothing") + '"';
      }).join(" and ") + ", which this table does not know.");
      L.push("Either index.html has moved on or EXIT_GROUPS in the tuner has.");
    }
    L.push("");

    var moved = Object.keys(exitVals);
    L.push("THE NUMBERS — " + moved.length + " slider" + (moved.length === 1 ? "" : "s") +
           " moved off the treatment" + (moved.length ? ":" : ", so the three chips are the whole of it."));
    if (moved.length) {
      EXIT_GROUPS.forEach(function (g) {
        var mine = exitRowsFor(g.k).filter(function (r) {
          return exitVals[g.k + "." + r.k] !== undefined;
        });
        if (!mine.length) return;
        L.push("portfolio/styles.css — into .panel[" + g.attr + '="' + exitPick[g.k] + '"],');
        L.push("  or under a name of its own beside it:");
        mine.forEach(function (r) {
          var id = g.k + "." + r.k;
          L.push("    " + exitProp(g.k, r.prop) + ": " + fmt(exitVals[id], r.dp) + ";" +
                 "    /* " + fmt(exitDefaults[id], r.dp) + " under `" + exitPick[g.k] + "` */");
        });
      });
      L.push("");
      L.push("Every travel is a share of --panel-w, the composition's own width, so a");
      L.push("number here holds its look at every window size. The rate is a SHAPE and");
      L.push("not a speed: the group spans the whole crossing whatever it is set to,");
      L.push("which is what stops a crossing opening a hole. See THE EXIT TREATMENTS.");
      L.push("");
    }

    L.push("THE CROSSING — " + (presenceEl.textContent || "not measured"));
    L.push("Presence is each group's opacity at t plus its own at t - 1, swept: 1.000");
    L.push("is a crossing that conserves it exactly. Nothing here can reach 0.");
    L.push("`node design/tools/check-panel-exit.mjs` asserts the same at 51 samples,");
    L.push("across every treatment and five rates, and checks the rest of #74 with it.");
    L.push("");
    L.push("NOTHING DRIVES --exit ON THE SHIPPING PAGE YET. It is declared 0 in the");
    L.push("sheet and only a crossing between Panels moves it; #72 is that crossing.");
    L.push("So pasting the above changes what a departure LOOKS like and does not");
    L.push("make one happen.");
    L.push("");

    var state = { mixture: {}, values: {} };
    EXIT_GROUPS.forEach(function (g) { state.mixture[g.k] = exitPick[g.k]; });
    Object.keys(exitVals).forEach(function (id) { state.values[id] = exitVals[id]; });
    L.push("exit-state v1: " + JSON.stringify(state));
    outExit.value = L.join("\n") + "\n";
  }

  function copy(el) {
    el.select();
    try { navigator.clipboard.writeText(el.value); } catch (_) { document.execCommand("copy"); }
    document.getElementById("copy-hint").textContent = "copied";
    setTimeout(function () { document.getElementById("copy-hint").textContent = ""; }, 1200);
  }
  document.getElementById("copy-py").addEventListener("click", function (e) { e.stopPropagation(); copy(outPy); });
  document.getElementById("copy-css").addEventListener("click", function (e) { e.stopPropagation(); copy(outCss); });
  document.getElementById("copy-panel").addEventListener("click", function (e) { e.stopPropagation(); copy(outPanel); });
  document.getElementById("copy-exit").addEventListener("click", function (e) { e.stopPropagation(); copy(outExit); });
  document.getElementById("drawer-head").addEventListener("click", function () {
    var body = document.getElementById("drawer-body");
    var hid = !body.hidden;
    body.hidden = hid;
    this.setAttribute("aria-expanded", hid ? "false" : "true");
    this.querySelector(".caret").textContent = hid ? "▸" : "▾";
  });

  /* ---- persistence -------------------------------------------------------
     Nothing is written before restore() has read. save() is reached from
     sizeFrame() and from every slider, and the frame's load event is later than
     this script — so without the guard the first session's sizeFrame() writes
     `{}` over whatever the last one left and the tuner looks like it starts
     clean on purpose. effects-tuner.html says the same at more length; it is
     the same bug and it was found there. */
  function save() {
    if (!ready) return;
    try {
      localStorage.setItem(STORE, JSON.stringify({
        pick: pick, mode: mode, live: live, cal: cal, closed: closed,
        theme: theme, w: fwEl.value, h: fhEl.value, strip: strip,
        /* `glass` is the SPARSE override set and not a snapshot of every uniform,
           which is what lets a value edited in frame-glass.js arrive here as the
           new default rather than being shadowed by a stored copy of the old one.
           Same argument as the stone below.
           `subChosen` TRAVELS WITH `sub` AND HAS TO. save() is reached from
           sizeFrame() at the end of boot, which is before the frame's load event
           has run readShippedSub() — so what gets written on a first visit is the
           table's first slot and not the page's own wording. Stored alone, that
           came back next session looking like a decision, and the tuner opened on
           a candidate and called the shipped wording moved. With the flag beside
           it an unchosen `sub` is re-corrected to whatever index.html says every
           time, and a chosen one is never touched. */
        sub: sub, subChosen: subChosen, behind: behind, glass: glass,
        /* `exitChosen` travels with `exitPick` for exactly the reason
           `subChosen` travels with `sub` — save() is reached before the frame's
           load event has read what the page is wearing, so a first visit would
           otherwise store the table's first chip and call it a decision next
           session. `exitVals` is the sparse moved set and not a snapshot, same
           argument as `glass` above: a number edited in styles.css then arrives
           as the new default instead of being shadowed by a stored copy.
           THE SCRUB IS DELIBERATELY NOT STORED. It is where you are standing,
           not what you have chosen, and a tuner that opened at --exit 0.62 would
           open on a composition half gone with no clue why. */
        exitPick: exitPick, exitChosen: exitChosen, exitVals: exitVals,
        crossing: crossing
      }));
    } catch (_) {}
  }

  function restore() {
    var raw = null;
    try { raw = localStorage.getItem(STORE); } catch (_) {}
    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s.pick && stones[s.pick]) pick = s.pick;
        if (s.mode) mode = s.mode;
        if (s.cal) cal = s.cal;
        if (s.closed) closed = s.closed;
        if (s.w) fwEl.value = s.w;
        if (s.h) fhEl.value = s.h;
        if (typeof s.strip === "boolean") strip = s.strip;
        /* Bounds-checked rather than trusted: SUBS can lose a wording between
           sessions and an index past its end would set the subheading to
           `undefined undefined` on the real page. */
        if (typeof s.sub === "number" && s.sub >= 0 && s.sub < SUBS.length) {
          sub = s.sub;
          subChosen = !!s.subChosen;
        }
        if (s.behind && BEHIND.some(function (t) { return t.k === s.behind; })) behind = s.behind;
        if (s.glass && typeof s.glass === "object") glass = s.glass;
        /* Every stored chip checked against the table it has to be in, for the
           reason the stored wording is bounds-checked: a treatment can leave
           EXIT_GROUPS between sessions, and an attribute the stylesheet has no
           rule for would silently fall back to the base declarations while the
           chips said something else entirely. */
        if (s.exitPick && typeof s.exitPick === "object") {
          EXIT_GROUPS.forEach(function (g) {
            var v = s.exitPick[g.k];
            if (v && g.names.some(function (t) { return t.k === v; })) exitPick[g.k] = v;
          });
          exitChosen = !!s.exitChosen;
        }
        if (s.exitVals && typeof s.exitVals === "object") exitVals = s.exitVals;
        if (typeof s.crossing === "boolean") crossing = s.crossing;
        /* The stored stone is only put back if it is still the SAME stone —
           a re-render that changed the table should win over a session that
           was dragging the old one, and silently reviving numbers the script
           no longer has is exactly the drift slab.json exists to stop. */
        if (s.live && s.pick === pick && s.live.veins) live = s.live;
      } catch (_) {}
    }
    if (!stones[pick]) pick = Object.keys(stones)[0];
    if (!live) live = cloneStone(stones[pick]);
    if (!stones[pick].baked) mode = "live";
    markStrip();     /* before markSheet(), which scrolls a row the fold may have hidden */
    markSheet();
    markMode();
    /* Both were painted at their defaults when the two pickers were built, before
       this had read anything. */
    markSub();
    markBehind();
    markExit();
    markCrossing();
    ready = true;
  }
})();
</script>
</body>
</html>
