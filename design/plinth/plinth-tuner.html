<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marble tuner — the Panel's plinth</title>
  <style>
    :root { color-scheme: light dark; --ui: #1a1917; --ui-bg: #fcfbf8; --ui-panel: #f5f2ea; --ui-line: #d6d0c4; --ui-mut: #6f6a5d; --ui-hit: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --ui: #eaeaea; --ui-bg: #161616; --ui-panel: #1e1e1e; --ui-line: #3a3a3a; --ui-mut: #9a9a9a; --ui-hit: #d8a76a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      background: var(--ui-bg); color: var(--ui);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    /* ---- top bar ---------------------------------------------------------- */
    .top {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--ui-line);
    }
    .top strong { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut); }
    .grow { flex: 1 1 auto; }
    button, select, input[type="text"], input[type="number"], textarea {
      font: inherit; color: var(--ui); background: transparent;
      border: 1px solid var(--ui-line); border-radius: 5px;
    }
    select, input[type="text"], input[type="number"], textarea { background: var(--ui-bg); color-scheme: light dark; }
    input[type="number"] { width: 4.4rem; padding: 0.18rem 0.3rem; }
    button { padding: 0.24rem 0.55rem; cursor: pointer; }
    button:hover { border-color: var(--ui-mut); }
    button[aria-pressed="true"] { background: var(--ui); color: var(--ui-bg); border-color: var(--ui); }
    .badge { padding: 0.1rem 0.4rem; border-radius: 99px; background: var(--ui-hit); color: var(--ui-bg); font-size: 11px; }
    .badge[data-n="0"] { background: transparent; color: var(--ui-mut); }
    .ms { font: 11px/1 ui-monospace, Consolas, monospace; color: var(--ui-mut); min-width: 7rem; }

    /* ---- layout ----------------------------------------------------------- */
    .wrap { flex: 1 1 auto; display: flex; min-height: 0; }
    .side { flex: 0 0 24rem; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--ui-line); background: var(--ui-panel); }
    .controls { flex: 1 1 auto; overflow: auto; padding-bottom: 0.6rem; }
    .stage { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: auto; padding: 0.6rem; gap: 0.6rem; }
    iframe { border: 1px solid var(--ui-line); background: #fff; flex: 0 0 auto; }
    .warn { margin: 0; padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--ui-line); background: rgba(216, 167, 106, 0.16); font-size: 11.5px; }
    .warn:empty { display: none; }

    /* ---- the contact strip ------------------------------------------------
       Every candidate at the same width, stacked, so two stones are compared by
       looking down rather than by remembering. The live one is a canvas in the
       same list and at the same width as the plates, which is what makes the
       preview answerable against a render instead of merely pretty. */
    .sheet { flex: 0 0 auto; border: 1px solid var(--ui-line); background: var(--ui-panel); }
    .sheet ol { list-style: none; margin: 0; padding: 0; }
    .sheet li { border-top: 1px solid var(--ui-line); }
    .sheet li:first-child { border-top: 0; }
    .sheet button {
      display: block; width: 100%; padding: 0.3rem 0.4rem 0.4rem; border: 0; border-radius: 0;
      background: transparent; text-align: left; cursor: pointer;
    }
    .sheet button:hover { background: rgba(138, 90, 43, 0.09); }
    .sheet button[aria-pressed="true"] { background: rgba(138, 90, 43, 0.16); }
    .sheet button[aria-pressed="true"] .nm { color: var(--ui-hit); }
    .sheet .nm { font: 11px/1.5 ui-monospace, Consolas, monospace; letter-spacing: 0.03em; }
    .sheet .ti { color: var(--ui-mut); font-size: 11px; }
    .sheet .un { color: var(--ui-hit); }
    /* The plates are 3000x269 and are drawn here at whatever width is going: a
       plate is stretched to its box on the page too, so this is the same lie the
       stylesheet tells and not a new one. */
    .sheet img, .sheet canvas { display: block; width: 100%; height: auto; margin-top: 0.15rem; background: #0d0d0d; }
    .sheet img { aspect-ratio: 3000 / 269; }

    /* ---- groups + rows ---------------------------------------------------- */
    .ghead {
      width: 100%; display: flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.7rem; border: 0; border-top: 1px solid var(--ui-line);
      border-radius: 0; background: transparent; text-align: left;
      font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ui-mut);
    }
    .ghead:hover { color: var(--ui); }
    .ghead .caret { font-size: 9px; }
    .gbody { padding: 0.1rem 0.7rem 0.5rem; }
    .gbody[hidden] { display: none; }
    .row { display: grid; grid-template-columns: 8.6rem 1fr 4.2rem; align-items: center; gap: 0.35rem; padding: 0.1rem 0; }
    .row > label { font-size: 11.5px; color: var(--ui-mut); cursor: help; }
    .row.moved > label { color: var(--ui-hit); font-weight: 600; }
    .row input[type="range"] { width: 100%; min-width: 0; accent-color: var(--ui-hit); }
    .row output { font: 11px/1 ui-monospace, Consolas, monospace; text-align: right; }
    .row input[type="color"] { width: 100%; height: 1.5rem; padding: 0; border: 1px solid var(--ui-line); background: transparent; }
    .vhead { display: flex; align-items: center; gap: 0.35rem; margin: 0.5rem 0 0.15rem; }
    .vhead span { flex: 1 1 auto; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ui-mut); }
    .vhead button { padding: 0.1rem 0.4rem; font-size: 11px; }
    .note { margin: 0.4rem 0.7rem 0; padding: 0.4rem 0.5rem; border-left: 2px solid var(--ui-line); color: var(--ui-mut); font-size: 11px; }

    /* ---- export drawer ---------------------------------------------------- */
    .drawer { flex: 0 0 auto; border-top: 1px solid var(--ui-line); background: var(--ui-panel); }
    .drawer > .ghead { border-top: 0; }
    .out { padding: 0 0.7rem 0.6rem; }
    .out + .out { padding-top: 0; }
    .out h3 { margin: 0.3rem 0 0.2rem; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ui-mut); }
    textarea { width: 100%; padding: 0.4rem; resize: vertical; font: 11px/1.45 ui-monospace, Consolas, monospace; white-space: pre; }
  </style>
</head>
<body>
  <div class="top">
    <strong>show</strong>
    <button id="mode-baked" aria-pressed="true">baked plate</button>
    <button id="mode-live" aria-pressed="false">live previz</button>
    <span class="grow"></span>
    <strong>frame</strong>
    <input type="number" id="fw" value="1440" min="320" max="3840" step="10" aria-label="frame width">
    <input type="number" id="fh" value="900" min="320" max="2400" step="10" aria-label="frame height">
    <button id="fit">fit</button>
    <button id="theme">theme: light</button>
    <span class="ms" id="ms"></span>
    <span class="badge" id="count" data-n="0">0 moved</span>
    <button id="reset">reset stone</button>
  </div>
  <p class="warn" id="warn"></p>

  <div class="wrap">
    <aside class="side">
      <div class="controls" id="controls"></div>
      <div class="drawer">
        <button class="ghead" id="drawer-head" aria-expanded="true"><span class="caret">▾</span> export <span class="grow"></span><span id="copy-hint" style="text-transform:none;letter-spacing:0"></span></button>
        <div id="drawer-body">
          <div class="out">
            <h3>build-slab.py — a CANDIDATES entry <button id="copy-py">copy</button></h3>
            <textarea id="out-py" spellcheck="false" readonly style="height:11rem"></textarea>
          </div>
          <div class="out">
            <h3>styles.css + the bake <button id="copy-css">copy</button></h3>
            <textarea id="out-css" spellcheck="false" readonly style="height:6.5rem"></textarea>
          </div>
        </div>
      </div>
    </aside>

    <main class="stage">
      <div class="sheet"><ol id="sheet"></ol></div>
      <iframe id="frame" src="/portfolio/" title="/portfolio"></iframe>
    </main>
  </div>

<script>
/* ============================================================================
   Marble tuner — which stone the Projects Panel's plinth is cut from, and what
   that stone is made of.

   TWO HALVES, AND THE FIRST IS EXACT WHILE THE SECOND IS NOT. Knowing which is
   which is the whole of using this page honestly.

   * BAKED PLATE is the real thing. design/plinth/build-slab.py has already put a
     block in front of Cycles for each stone in its CANDIDATES table, and what
     this half does is flip `data-marble` on the real /portfolio in an iframe —
     which is all the stylesheet needs, because `--panel-plinth-src` was written
     to be switched by an attribute and nothing else. So comparing the four is
     free, and what you are looking at IS what ships. Nothing here can change a
     plate; only Blender can.

   * LIVE PREVIZ is an approximation, and it exists because the alternative is a
     minute of Cycles per question. It reproduces build-slab.py's geometry
     exactly — the same camera, the same block, so the same trapezoid over the
     same rectangle — and its material is the same recipe: a level set of warped
     noise driving colour, roughness and bump together. What it does NOT
     reproduce is the noise field itself. Blender's Perlin and a fragment
     shader's are not the same function, and Cycles integrates two area lights
     where this evaluates two directions.

     So the previz answers HOW MUCH GOLD, HOW WIDE, WHAT COLOUR, HOW SHARP —
     the character of the stone, which is the thing that is actually in question
     — and it does not answer where any individual vein lands. Numbers dialled
     here land close and want one confirming bake. The export block says so too,
     because the export is the thing that gets pasted at three in the morning.

   NO SLIDER MOVES THE LIGHT, and that is deliberate rather than unfinished. The
   two lights in build-slab.py are FITTED to the design render's own measured
   profile — mean absolute error 3.2 levels over both faces — so they are a
   constant of the composition, not a preference. Two stones are only comparable
   while they are lit the same way. The two gains under `previz calibration` are
   the exception and they are not part of the export: they line this shader's
   exposure up with the plates so a previz can be judged beside one, which is a
   property of the shader and not of the stone.

   EVERY CONSTANT COMES FROM slab.json, which build-slab.py writes. There is no
   copy of the CANDIDATES table in this file, and there must not be: a tuner
   holding its own literals goes on showing the stone the script used to render,
   and both halves look right on their own while it does. design/plate/
   plate-tuner.html reads plate-source.json for the same reason.
   ========================================================================= */
(function () {
  "use strict";

  var STORE = "portfolio-plinth-tuner";
  var SIDECAR = "slab.json";
  var MAX_SETS = 4;          /* what the shader carries; the table's widest is 3 */

  var frame = document.getElementById("frame");
  var warnEl = document.getElementById("warn");
  var sheetEl = document.getElementById("sheet");
  var controlsEl = document.getElementById("controls");
  var countEl = document.getElementById("count");
  var msEl = document.getElementById("ms");
  var fwEl = document.getElementById("fw");
  var fhEl = document.getElementById("fh");
  var outPy = document.getElementById("out-py");
  var outCss = document.getElementById("out-css");
  var themeBtn = document.getElementById("theme");

  var slab = null;           /* what build-slab.py says */
  var doc = null, win = null, panel = null;
  var mode = "baked";
  var pick = "nero";         /* which stone is selected */
  var theme = "light";
  var stones = {};           /* name -> {title, ground, veins, baked, shipped} */
  var live = null;           /* the working copy the sliders drag */
  var ready = false;
  var closed = {};           /* which control groups are folded */

  function warn(msg) { warnEl.textContent = msg || ""; }

  /* WHAT THIS SHADER IS A TWIN OF, and the whole reason it is a constant here
     rather than something computed. The previz below is a hand-written GLSL
     copy of build_material() in build-slab.py: every constant it needs comes out
     of slab.json, so the two cannot disagree about NUMBERS — but the SHAPE of
     the material is written out twice, once in Blender nodes and once in GLSL,
     and nothing has ever stopped those two from drifting apart. When they do,
     both halves still look right on their own, which is the failure this file's
     own header warns about and then had no defence against.

     So build-slab.py now hashes the material's shaping constants into
     `material_version` and this is the value the shader below was written
     against. They differ whenever the material grows something the GLSL does not
     have, and the banner says so rather than the preview quietly lying.

     THIS ONE IS KNOWN STALE. The material gained a bedding transform, a
     Voronoi fracture network, per-vein width modulation, vein haloes, density
     gating, ground mottle and polish variation; the shader below has none of
     them and still draws the isotropic constant-width level sets that were
     replaced. Until it is ported it is useful for the BLOCK and the CAMERA and
     nothing else. Read a baked plate for the stone. */
  var SHADER_MATERIAL_VERSION = "pre-bedding";

  function checkShaderCurrent() {
    if (!slab || !slab.material_version) return;
    if (slab.material_version === SHADER_MATERIAL_VERSION) return;
    warn("PREVIZ IS OUT OF DATE and is not showing this material. build-slab.py "
         + "is at material " + slab.material_version + "; the shader in this page "
         + "was written against " + SHADER_MATERIAL_VERSION + " and has no bedding, "
         + "fracture network, halo, density gate, mottle or polish variation in it. "
         + "The block and the camera are still right. For the STONE, bake a plate "
         + "and look at that.");
  }

  /* ---- the stone the tuner adds ------------------------------------------
     One preset that is NOT in build-slab.py, and it is here because it is the
     answer to the thing that sent anyone to this page. The baked `portoro` is
     Nero Portoro on paper and reads wrong: its gold is a broad olive wash at
     width 0.105, which covers the ground rather than crossing it, so the black
     the stone is mostly made of is almost gone and the front face comes out a
     uniform brown. Real Portoro is a BLACK rock with a thin branching gold
     network in it and white hairlines through that.

     So this is the same three vein sets with the gold thinned and sharpened and
     the ground let back in — a starting point to drag, not a claim to be right.
     It has no plate, so selecting it forces the previz on; bake it if it wins.
     Anything the author keeps belongs in build-slab.py, at which point it stops
     being a preset here and arrives through slab.json like the rest. */
  var PRESETS = {
    "portoro-fine": {
      title: "Nero Portoro, read again - black kept, gold thinned to a network",
      ground: [0.013, 0.012, 0.013],
      veins: [
        [7.0, 5.0, 1.5, 0.038, 2.6, [0.52, 0.35, 0.10], 0.44, 0.55],
        [15.0, 4.0, 1.2, 0.022, 3.0, [0.72, 0.58, 0.28], 0.34, 0.40],
        [34.0, 3.0, 1.3, 0.012, 3.6, [0.80, 0.79, 0.76], 0.22, 0.25]
      ]
    }
  };

  /* ---- rows ---------------------------------------------------------------
     Bounds and tooltips are this tool's own: they are a question of what is
     worth dragging through, which build-slab.py has no opinion about. `dp` is
     how many decimals the exported Python carries, so the block reads like the
     block it replaces rather than like a float. */
  var VEIN_ROWS = [
    { k: "scale", label: "scale", min: 2, max: 60, step: 0.5, dp: 1,
      tip: "How many features across the block, near enough: the mesh carries its own\ndimensions so scale reads directly, and 12 is about fifteen veins over the slab.\nLow is a swathe; high is a filament." },
    { k: "detail", label: "detail", min: 1, max: 8, step: 0.5, dp: 1,
      tip: "Octaves of noise before the level set is taken.\nMore is a raggeder vein edge, not more veins." },
    { k: "distortion", label: "distortion", min: 0, max: 3, step: 0.05, dp: 2,
      tip: "How far the field is warped before its middle is crossed.\nThis is what makes veins wander, branch and meet instead of running parallel.\nAt 0 they are a contour map." },
    { k: "width", label: "width", min: 0.002, max: 0.18, step: 0.001, dp: 3,
      tip: "How far off the crossing still counts as vein — so how much of the rock this\nset covers. THE KNOB THAT MATTERS MOST for a stone that reads as too much\ngold: 0.105 covers the ground, 0.03 crosses it." },
    { k: "sharpness", label: "sharpness", min: 1, max: 6, step: 0.1, dp: 1,
      tip: "Thins what the width left into a bright core that shades away from itself.\nRead it with width: a support and a falloff. Higher is a harder filament." },
    { k: "colour", label: "vein colour", colour: true,
      tip: "The vein's base colour, in LINEAR light and not sRGB — which is why the swatch\nlooks darker than the number suggests. Cycles is given these values raw." },
    { k: "rough", label: "roughness", min: 0.02, max: 0.9, step: 0.01, dp: 2,
      tip: "How polished the vein is. Above the ground's roughness, always: a calcite seam\nis not as polished as the stone around it, and that difference is most of what\nmakes the surface read as rock rather than as tinted mirror." },
    { k: "bump", label: "bump", min: 0, max: 1, step: 0.01, dp: 2,
      tip: "How much this set adds to the height field, so how much it stands proud.\nThe first set is the height field; the others are added onto it by this." }
  ];

  /* ---- boot -------------------------------------------------------------- */

  fetch(SIDECAR, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    return r.json();
  }).then(function (j) {
    slab = j;
    Object.keys(slab.candidates).forEach(function (k) {
      var c = slab.candidates[k];
      stones[k] = { title: c.title, ground: c.ground.slice(),
                    veins: c.veins.map(cloneVein), baked: true };
    });
    /* The photo-backed stones, which have no ground and no vein sets because
       they are not made of either — see `the stone, photographed` in
       build-slab.py. They are listed here because a picker that silently omits
       two thirds of what build-slab.py can render is worse than useless: you go
       looking for `gemini`, do not find it, and conclude the bake failed.

       THE PREVIZ CANNOT DRAW THEM, and is not asked to. The shader below is a
       hand-written GLSL twin of build_material() — noise fields, thresholds,
       haloes — and a photo stone is four 2814px maps this page does not have
       and could not sample honestly if it did (design/plinth/maps/ is
       gitignored, so on a fresh checkout it is not even on disk). What it shows
       instead is the REAL RENDER, which is better than a preview rather than a
       fallback from one: the plates are committed, so there is always one to
       show, and it is the actual Cycles output rather than an approximation of
       it. Hence `photo: true` pins the mode to baked. */
    Object.keys(slab.photo_candidates || {}).forEach(function (k) {
      var c = slab.photo_candidates[k];
      stones[k] = { title: c.title, photo: c, baked: true, kind: "photograph" };
    });
    /* And the procedural stones re-lit. These are plate-only for a different
       reason from the photo ones: the previz CAN draw their material — it is a
       CANDIDATES entry — but it has no idea about the room, and the room is the
       entire difference. Drawing them live would show the stone in the light
       they were made to get away from and caption it as if it were them. */
    Object.keys(slab.relit_candidates || {}).forEach(function (k) {
      var c = slab.relit_candidates[k];
      stones[k] = { title: c.title, photo: c, baked: true, kind: "re-lit" };
    });
    Object.keys(PRESETS).forEach(function (k) {
      if (stones[k]) return;   /* the script won; a preset never shadows a bake */
      stones[k] = { title: PRESETS[k].title, ground: PRESETS[k].ground.slice(),
                    veins: PRESETS[k].veins.map(cloneVein), baked: false };
    });
    initGL();
    buildSheet();
    restore();
    buildControls();
    apply();
    sizeFrame();
    checkShaderCurrent();
  }).catch(function (e) {
    warn("could not read design/plinth/" + SIDECAR + " (" + e.message + "). " +
         "It is written by build-slab.py — run `blender -b -P design/plinth/build-slab.py -- all`, " +
         "and serve this page over http rather than opening the file directly.");
  });

  function cloneVein(v) { return v.slice(0, 5).concat([v[5].slice()], v.slice(6)); }
  function cloneStone(s) {
    /* A photo stone has neither a ground nor vein sets and there is nothing to
       edit on it, so it is carried through as itself rather than deep-copied
       into a shape it does not have. */
    if (s.photo) return { title: s.title, photo: s.photo, baked: true };
    return { title: s.title, ground: s.ground.slice(), veins: s.veins.map(cloneVein),
             baked: s.baked };
  }

  frame.addEventListener("load", function () {
    doc = frame.contentDocument;
    win = frame.contentWindow;
    panel = doc.getElementById("projects");
    if (!panel) {
      warn("no #projects in the frame — /portfolio has no Panel to stand a plinth under.");
      return;
    }
    theme = doc.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    themeBtn.textContent = "theme: " + theme;
    /* The plinth is at the foot of the page and the page is several screens
       long, so a tuner that did not scroll would open on the masthead every
       time. Instantly, not smoothly: a half-second glide on every reload is a
       half-second of not being able to see the thing being tuned. */
    panel.scrollIntoView({ block: "end", behavior: "instant" });
    apply();
  });

  /* ---- the contact strip ------------------------------------------------- */

  function buildSheet() {
    sheetEl.textContent = "";
    Object.keys(stones).forEach(function (k) {
      var s = stones[k];
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.stone = k;
      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = k;
      if (!s.baked) {
        var u = document.createElement("span");
        u.className = "un";
        u.textContent = "  — no plate, previz only";
        nm.appendChild(u);
      } else if (s.photo) {
        var p = document.createElement("span");
        p.className = "un";
        p.textContent = "  — " + (s.kind || "photograph") + ", plate only";
        nm.appendChild(p);
      }
      var ti = document.createElement("div");
      ti.className = "ti";
      ti.textContent = s.title;
      b.appendChild(nm);
      b.appendChild(ti);
      if (s.baked) {
        var img = document.createElement("img");
        /* `../../portfolio/` and not `../../`: this page is at /design/plinth/,
           so two levels up is the repository root and the plates are a further
           directory in. It read `../../` and every thumbnail in the strip 404'd
           — silently, because a broken <img> in a dark row looks like a stone
           that has not been baked yet, which is a thing the strip is expected to
           contain. */
        img.src = plateURL(k, "../../portfolio/");
        img.alt = "";
        img.loading = "lazy";
        b.appendChild(img);
      } else {
        b.appendChild(placeholder());
      }
      b.addEventListener("click", function () { select(k); });
      li.appendChild(b);
      sheetEl.appendChild(li);
    });
    markSheet();
  }

  /* What a photo stone shows instead of sliders: what it is made of, read-only.
     READ-ONLY IS THE HONEST ANSWER, not a shortcut. Every slider on a
     procedural stone works because this page can redraw the result — move it and
     the previz answers. Nothing here can be answered without Cycles: `scale` and
     `offset` decide which sliver of a 2814px photograph lands on a block whose
     top face is foreshortened eight to one, `sss` is a subsurface radius, and
     `room` is an entire lighting rig. A slider that silently did nothing until
     someone remembered to re-bake would be worse than no slider, so these are
     values to read and then go and change in build-slab.py. */
  /* These are Python values on their way back into a Python file, so they are
     rendered as Python throughout — `False` not `false`, and 1.0 not 1. A whole
     number arriving as `1` is valid Python and would still bake, but it makes a
     copied entry look unlike every other line in PHOTO_CANDIDATES, and the point
     of the export is to be pasted without tidying. */
  function pyVal(v) {
    if (Array.isArray(v)) return "(" + v.map(pyVal).join(", ") + ")";
    if (typeof v === "boolean") return v ? "True" : "False";
    if (typeof v === "number") return Number.isInteger(v) ? v.toFixed(1) : String(v);
    return '"' + v + '"';
  }

  /* Stones that arrived through design/plinth/add-stone.py rather than out of
     the table in build-slab.py. Their values live in design/plinth/stones/, and
     everything this page says about where to go and change them has to say so —
     see photoControls() and writeExport(). */
  function addedStone(k) { return (slab.added_stones || {})[k] || null; }

  var PHOTO_ROWS = [
    ["grade", "which basecolor-*.png, so which of build-portoro-maps.py's GRADES"],
    ["scale", "tiles per model unit, and a unit is a Frame width. 0.84 lays one slab across the plinth; 0.42 crops in and the figure doubles; 1.75 goes fine and jewel-like. The strongest control here, and not a quality setting."],
    ["offset", "where in the slab the block was cut from. Only a sliver is ever seen, so this decides which veins land on the plinth at all."],
    ["bump", "(strength, distance). Tiny, and has to be: the top face is seen at 7.8 degrees where it is nearly a mirror, so bump adds distortion to a reflection rather than texture to a surface."],
    ["sss", "Subsurface Weight through the calcite mask. Calcite is translucent, and that is most of why marble looks deep rather than painted."],
    ["coat", "(weight, roughness). A second specular lobe over the stone. Off in the dark rooms, where it was lifting the black."],
    ["rough", "multiplies the roughness map. 0 pins it flat at BASE_ROUGH — the crippled control, `gemini-plain`."],
    ["crack", "lay the procedural FRACTURE network over the photograph as well"],
    ["room", "which ROOMS surround to render in. `noir` is the one where the black is actually black."]
  ];

  function photoControls(base) {
    var n = document.createElement("p");
    n.className = "note";
    n.textContent = "`" + pick + "` is " + (base.kind === "re-lit"
        ? "a procedural stone rendered in a different room — the previz has no room in it, "
          + "so drawing it live would show this stone in the light it was made to get away from. "
        : "cut from a photograph, not grown from noise. There is no previz for it. ")
      + "The picture above is the real Cycles plate. "
      /* An added stone's values are NOT in build-slab.py — it merges them from
         design/plinth/stones/<name>.json, which design/plinth/add-stone.py
         wrote. Sending you to the table in build-slab.py to change a number it
         does not hold costs a re-bake that appears to do nothing. */
      + (addedStone(pick)
          ? "These are read-only — change them in design/plinth/stones/" + pick
            + ".json and re-bake:"
          : "These are read-only — change them in PHOTO_CANDIDATES in build-slab.py and re-bake:")
      + "\n\n    blender -b -P design/plinth/build-slab.py -- " + pick;
    n.style.whiteSpace = "pre-wrap";
    controlsEl.appendChild(n);

    group("photograph", "photo", function (b) {
      PHOTO_ROWS.forEach(function (r) {
        var v = base.photo[r[0]];
        if (v === undefined || v === null) return;
        var d = document.createElement("div");
        d.className = "row";
        d.title = r[1];
        var lab = document.createElement("label");
        lab.textContent = r[0];
        var val = document.createElement("span");
        val.className = "was";
        val.textContent = pyVal(v);
        d.appendChild(lab);
        d.appendChild(val);
        b.appendChild(d);
      });
    });
  }

  /* An unbaked stone still gets a picture in the strip, drawn by the previz —
     otherwise the one row you are working on is the one row with nothing in it. */
  function placeholder() {
    var c = document.createElement("canvas");
    c.className = "livethumb";
    c.width = 900;
    c.height = Math.round(900 * slab.plate.h / slab.plate.w);
    return c;
  }

  /* Where a stone's baked plate lives, from two different places.
     The strip is at /design/plinth/ and needs `../../portfolio/`; the frame is a document
     at /portfolio/ whose own stylesheet writes `img/tex/...` relative to itself,
     so it needs an absolute path instead. One function so the two can never
     drift onto different files — and the same ?v= the stylesheet asks for, so
     the strip and the frame are never showing two different renders of one
     stone. */
  function plateURL(k, base) {
    return (base || "/portfolio/") + "img/tex/plinth-" + k + ".webp" +
           (slab.version ? "?v=" + slab.version : "");
  }

  function markSheet() {
    Array.prototype.forEach.call(sheetEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.stone === pick ? "true" : "false");
    });
  }

  function select(k) {
    pick = k;
    live = cloneStone(stones[k]);
    /* A stone with no plate cannot be shown baked, so choosing one chooses the
       previz with it rather than showing a broken image and waiting to be
       asked. */
    if (!stones[k].baked) mode = "live";
    /* ...and the converse, for the same reason: a photo stone has no previz to
       flip to, so choosing one chooses the plate with it. */
    if (stones[k].photo) mode = "baked";
    markSheet();
    markMode();
    buildControls();
    apply();
    save();
  }

  /* ---- mode + theme ------------------------------------------------------ */

  function markMode() {
    document.getElementById("mode-baked").setAttribute("aria-pressed", mode === "baked" ? "true" : "false");
    var lv = document.getElementById("mode-live");
    lv.setAttribute("aria-pressed", mode === "live" ? "true" : "false");
    /* Disabled rather than left to warn on click: there is no previz of a
       photograph to switch to, and a button that always refuses is a button
       that should have said so before it was pressed. */
    var isPhoto = !!(stones[pick] && stones[pick].photo);
    lv.disabled = isPhoto;
    lv.title = isPhoto ? "no previz for a photo-backed stone — see the note on the left" : "";
  }
  document.getElementById("mode-baked").addEventListener("click", function () {
    if (!stones[pick].baked) {
      warn("`" + pick + "` has no plate in portfolio/img/tex — bake it before it can be shown baked.");
      return;
    }
    warn("");
    mode = "baked"; markMode(); apply(); save();
  });
  document.getElementById("mode-live").addEventListener("click", function () {
    mode = "live"; markMode(); apply(); save();
  });

  themeBtn.addEventListener("click", function () {
    theme = theme === "light" ? "dark" : "light";
    themeBtn.textContent = "theme: " + theme;
    if (doc) doc.documentElement.setAttribute("data-theme", theme);
    save();
  });

  document.getElementById("reset").addEventListener("click", function () {
    live = cloneStone(stones[pick]);
    buildControls();
    apply();
    save();
  });

  function sizeFrame() {
    frame.style.width = (parseInt(fwEl.value, 10) || 1440) + "px";
    frame.style.height = (parseInt(fhEl.value, 10) || 900) + "px";
    save();
  }
  fwEl.addEventListener("change", sizeFrame);
  fhEl.addEventListener("change", sizeFrame);
  document.getElementById("fit").addEventListener("click", function () {
    var stage = document.querySelector(".stage");
    fwEl.value = Math.round(stage.clientWidth - 26);
    fhEl.value = Math.max(400, Math.round(stage.clientHeight * 0.72));
    sizeFrame();
  });

  /* ---- previz calibration -------------------------------------------------
     Not part of the stone and not exported. Cycles' two area lights are given
     in watts over an area; this shader evaluates two directions with a lobe
     widened by the light's angular size, which is the cheap stand-in for an
     area integral. The two constants that reconciles are exposure, so they live
     here where they can be lined up against a plate rather than being guessed
     at in GLSL. Defaults land the previz on the baked plates' levels. */
  /* Both fitted against plinth-nero.webp, measured down the plate's middle
     third: its top face ramps 38 -> 84 back to front and its front face is a
     flat 21. These land 49 -> 82 and a flat 21, which is the previz agreeing
     with a render about the thing it is not computing. */
  var cal = { key: 0.0093, fill: 0.060 };
  var CAL_ROWS = [
    { k: "key", label: "key gain", min: 0.001, max: 0.05, step: 0.0002, dp: 4,
      tip: "Exposure of the light behind the block, which is the whole of the top face.\nSmall because the reflection it stands in for is a near-mirror: the lobe's peak\nruns into the hundreds before any gain.\nFitted against plinth-nero's measured top face, 38 -> 84; this lands 49 -> 82,\nso the previz is a little flat at the back and right at the arris.\nNot the stone. Line it up against a baked plate in the strip above." },
    { k: "fill", label: "fill gain", min: 0.005, max: 0.4, step: 0.001, dp: 3,
      tip: "Exposure of the wide weak light in front, which is the whole of the front face.\nFitted against the same plate's flat 21. Also not the stone." }
  ];

  /* ---- controls ---------------------------------------------------------- */

  function group(title, key, fill) {
    var head = document.createElement("button");
    head.className = "ghead";
    head.type = "button";
    var caret = document.createElement("span");
    caret.className = "caret";
    var body = document.createElement("div");
    body.className = "gbody";
    function paint() {
      var hid = !!closed[key];
      body.hidden = hid;
      caret.textContent = hid ? "▸" : "▾";
      head.setAttribute("aria-expanded", hid ? "false" : "true");
    }
    head.appendChild(caret);
    head.appendChild(document.createTextNode(" " + title));
    head.addEventListener("click", function () { closed[key] = !closed[key]; paint(); save(); });
    controlsEl.appendChild(head);
    controlsEl.appendChild(body);
    paint();
    fill(body);
    return body;
  }

  /* One slider, its number, and the highlight that says it has been moved off
     what build-slab.py says. `get`/`set` rather than a property name, because
     the same row shape drives the ground colour, a vein's eight values and the
     two calibration gains, which live in three different places. */
  function row(parent, spec, get, set, was) {
    var el = document.createElement("div");
    el.className = "row";
    var lab = document.createElement("label");
    lab.textContent = spec.label;
    if (spec.tip) lab.title = spec.tip;
    el.appendChild(lab);

    var out = document.createElement("output");
    function moved() {
      if (was === undefined) return false;
      if (spec.colour) return String(get()) !== String(was);
      return Math.abs(get() - was) > 1e-9;
    }
    function paint() {
      el.classList.toggle("moved", moved());
      if (!spec.colour) out.textContent = fmt(get(), spec.dp);
    }

    if (spec.colour) {
      var ci = document.createElement("input");
      ci.type = "color";
      ci.value = linToHex(get());
      ci.addEventListener("input", function () {
        set(hexToLin(ci.value));
        paint(); apply(); save();
      });
      el.appendChild(ci);
      out.textContent = "";
      out.style.fontSize = "10px";
      var v = get();
      out.textContent = fmt(v[0], 3);
      el.appendChild(out);
      paint();
    } else {
      var r = document.createElement("input");
      r.type = "range";
      r.min = spec.min; r.max = spec.max; r.step = spec.step;
      r.value = get();
      r.addEventListener("input", function () {
        set(parseFloat(r.value));
        paint(); apply(); save();
      });
      el.appendChild(r);
      el.appendChild(out);
      paint();
    }
    parent.appendChild(el);
    return el;
  }

  function buildControls() {
    controlsEl.textContent = "";
    if (!live) return;
    var base = stones[pick];
    if (base.photo) { photoControls(base); return; }

    var n = document.createElement("p");
    n.className = "note";
    n.textContent = live.baked
      ? "`" + pick + "` has a plate. Flip to baked plate above to see the real render; " +
        "the previz below is for asking what a change would do."
      : "`" + pick + "` has no plate yet. Everything you see is the previz.";
    controlsEl.appendChild(n);

    group("ground", "ground", function (b) {
      row(b, { label: "ground colour", colour: true,
               tip: "The rock between the veins, in LINEAR light. Near-black for three of the four:\nthe Panel's own ground is very dark and a plinth lighter than the page it stands\non stops reading as something the Frame rests on." },
          function () { return live.ground; },
          function (v) { live.ground = v; },
          base.ground.join(","));
      row(b, { label: "base roughness", min: 0.01, max: 0.6, step: 0.005, dp: 3,
               tip: "How polished the stone is where there is no vein in it — build-slab.py's\nBASE_ROUGH, which is global rather than per stone. Exported as its own line,\nbecause changing it changes every candidate." },
          function () { return live.baseRough === undefined ? slab.base_rough : live.baseRough; },
          function (v) { live.baseRough = v; },
          slab.base_rough);
    });

    live.veins.forEach(function (v, i) {
      group("vein set " + (i + 1), "v" + i, function (b) {
        var h = document.createElement("div");
        h.className = "vhead";
        var s = document.createElement("span");
        s.textContent = "set " + (i + 1) + " of " + live.veins.length;
        h.appendChild(s);
        var del = document.createElement("button");
        del.type = "button";
        del.textContent = "remove";
        del.addEventListener("click", function () {
          if (live.veins.length < 2) { warn("a stone needs at least one vein set."); return; }
          live.veins.splice(i, 1);
          buildControls(); apply(); save();
        });
        h.appendChild(del);
        b.appendChild(h);

        VEIN_ROWS.forEach(function (spec, ri) {
          var wasVein = base.veins[i];
          var was = wasVein === undefined ? undefined
                  : (spec.colour ? wasVein[5].join(",") : wasVein[fieldIndex(spec.k)]);
          row(b, spec,
              function () { return v[fieldIndex(spec.k)]; },
              function (x) { v[fieldIndex(spec.k)] = x; },
              was);
        });
      });
    });

    if (live.veins.length < MAX_SETS) {
      var add = document.createElement("button");
      add.className = "ghead";
      add.type = "button";
      add.textContent = "+ add a vein set";
      add.addEventListener("click", function () {
        var last = live.veins[live.veins.length - 1];
        /* Half the width and twice the scale of the finest set there is, which
           is the direction every stone in the table is layered in: a swathe,
           then a vein, then a hairline. */
        live.veins.push([Math.min(60, last[0] * 2), Math.max(1, last[1] - 1), last[2],
                         Math.max(0.002, last[3] / 2), last[4] + 0.4,
                         last[5].slice(), Math.max(0.02, last[6] - 0.06),
                         Math.max(0, last[7] - 0.1)]);
        buildControls(); apply(); save();
      });
      controlsEl.appendChild(add);
    }

    group("previz calibration", "cal", function (b) {
      var p = document.createElement("p");
      p.className = "note";
      p.style.margin = "0 0 0.3rem";
      p.textContent = "Exposure of this shader, not a property of the stone. Never exported — " +
                      "the lights in build-slab.py are fitted to the design render and are not " +
                      "a preference.";
      b.appendChild(p);
      CAL_ROWS.forEach(function (spec) {
        row(b, spec, function () { return cal[spec.k]; },
            function (v) { cal[spec.k] = v; }, undefined);
      });
    });

    countMoved();
  }

  function fieldIndex(k) { return slab.vein_fields.indexOf(k); }

  function countMoved() {
    var n = controlsEl.querySelectorAll(".row.moved").length;
    var base = stones[pick];
    if (base.photo) { countEl.textContent = "read-only"; countEl.dataset.n = 0; return; }
    if (live.veins.length !== base.veins.length) n += 1;
    countEl.textContent = n + " moved";
    countEl.dataset.n = n;
  }

  /* ---- colour ------------------------------------------------------------
     The table's colours are LINEAR — Cycles is handed them raw and the render's
     view transform is Standard — while <input type="color"> is sRGB. So the two
     transfer functions are applied at the boundary rather than being ignored,
     which is the difference between a swatch that lies by about a factor of two
     in the midtones and one that does not. */
  function s2l(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function l2s(c) { return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }
  function linToHex(rgb) {
    return "#" + rgb.map(function (c) {
      var v = Math.round(Math.min(1, Math.max(0, l2s(c))) * 255);
      return (v < 16 ? "0" : "") + v.toString(16);
    }).join("");
  }
  function hexToLin(hex) {
    var m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex);
    if (!m) return [0, 0, 0];
    return [1, 2, 3].map(function (i) { return s2l(parseInt(m[i], 16) / 255); });
  }
  function fmt(v, dp) {
    if (Array.isArray(v)) return v.map(function (x) { return x.toFixed(3); }).join(" ");
    return Number(v).toFixed(dp === undefined ? 3 : dp);
  }

  /* ---- apply -------------------------------------------------------------
     The one line the stylesheet was written for. In baked mode the attribute is
     the whole of it; in live mode the same custom property is pointed at a data
     URL instead, so the box, the stretch, the negative margin and the
     reflection lying in the top face are all still the stylesheet's and none of
     them is restated here. */
  function apply() {
    if (!live) return;
    /* A photo stone can only be shown baked. Guarding here as well as in
       select() because restore() can put a photo stone and a stored mode of
       "live" together on load, and drawLive() would then be handed a stone with
       no vein sets to upload. */
    if (live.photo && mode !== "baked") { mode = "baked"; markMode(); }
    if (mode === "live") drawLive();
    if (!panel) { writeExport(); return; }
    panel.dataset.marble = pick;
    if (mode === "baked") {
      /* SET IT, don't remove it. Removing the inline property falls back to the
         stylesheet, and the stylesheet only carries a
         `.panel[data-marble="..."]` rule for the four procedural stones — so
         every other stone fell through to the default `--panel-plinth-src` and
         the frame showed plinth-nero.webp no matter what was picked. Silently:
         data-marble was set correctly, the strip highlighted the right row, and
         the one thing the page exists to do did not happen.

         A picker cannot require the thing being picked to have already been
         shipped. Pointing the property straight at the plate works for any
         stone with a bake, rule or no rule, and the export box still says which
         rule styles.css will need when one is chosen. */
      panel.style.setProperty("--panel-plinth-src", 'url("' + plateURL(pick) + '")');
    } else {
      panel.style.setProperty("--panel-plinth-src", 'url("' + lastURL + '")');
    }
    countMoved();
    writeExport();
  }

  /* ======================================================================= */
  /*  the previz                                                             */
  /* ======================================================================= */

  var gl = null, prog = null, U = {}, glCanvas = null, lastURL = "";
  var PREVIEW_W = 1500;      /* half the plate, which is plenty to judge a vein */

  var VERT =
    "attribute vec2 p; varying vec2 uv;" +
    "void main(){ uv = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5); gl_Position = vec4(p, 0.0, 1.0); }";

  /* The material and the block, in one fragment shader.
     Read it against build-slab.py: vein_mask() is veinMask() here line for line,
     build_material()'s layering is material(), and the projection is the three
     lines under `the camera` inverted. */
  var FRAG = [
    "precision highp float;",
    "varying vec2 uv;",
    /* the block and the camera, all from slab.json */
    "uniform float uNearHalf, uDepth, uHeight, uD, uH, uXHalf, uYTop, uYBot;",
    /* the material */
    "uniform vec3 uGround;",
    "uniform float uBaseRough;",
    "uniform int uN;",
    "uniform float uScale[4], uDetail[4], uDist[4], uWidth[4], uSharp[4], uRough[4], uBump[4];",
    "uniform vec3 uColour[4];",
    "uniform float uBumpStrength, uBumpDist, uBumpClamp, uPx;",
    "uniform vec2 uTexel;",
    /* the light */
    "uniform vec3 uKeyPos, uFillPos;",
    "uniform float uKeyE, uFillE, uKeyExt, uFillExt, uKeyGain, uFillGain;",
    "",
    "const float PI = 3.14159265;",
    "",
    /* Gradient noise. NOT Blender's Perlin — see the header. Same family, same
       feel, different field, which is why a vein lands somewhere else. */
    "vec3 hash3(vec3 p){",
    "  p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),",
    "           dot(p, vec3(269.5, 183.3, 246.1)),",
    "           dot(p, vec3(113.5, 271.9, 124.6)));",
    "  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);",
    "}",
    "float pnoise(vec3 p){",
    "  vec3 i = floor(p), f = fract(p);",
    "  vec3 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(mix(dot(hash3(i + vec3(0,0,0)), f - vec3(0,0,0)),",
    "                     dot(hash3(i + vec3(1,0,0)), f - vec3(1,0,0)), u.x),",
    "                 mix(dot(hash3(i + vec3(0,1,0)), f - vec3(0,1,0)),",
    "                     dot(hash3(i + vec3(1,1,0)), f - vec3(1,1,0)), u.x), u.y),",
    "             mix(mix(dot(hash3(i + vec3(0,0,1)), f - vec3(0,0,1)),",
    "                     dot(hash3(i + vec3(1,0,1)), f - vec3(1,0,1)), u.x),",
    "                 mix(dot(hash3(i + vec3(0,1,1)), f - vec3(0,1,1)),",
    "                     dot(hash3(i + vec3(1,1,1)), f - vec3(1,1,1)), u.x), u.y), u.z);",
    "}",
    /* Detail as a fractional octave count, the last one faded in, which is what
       Blender's Detail input does. Roughness 0.48 is build-slab.py's. */
    "float fbm(vec3 p, float detail){",
    "  float sum = 0.0, amp = 1.0, norm = 0.0, sc = 1.0;",
    "  for (int i = 0; i < 8; i++){",
    "    float w = clamp(detail - float(i), 0.0, 1.0);",
    "    if (w <= 0.0) break;",
    "    sum += w * amp * pnoise(p * sc);",
    "    norm += w * amp;",
    "    amp *= 0.48; sc *= 2.0;",
    "  }",
    "  return sum / max(norm, 1e-5);",
    "}",
    /* Blender's Distortion offsets the (already scaled) input by noise per axis,
       which is what turns a contour map into something that branches. */
    "vec3 warp(vec3 p, float d){",
    "  if (d <= 0.0) return p;",
    "  return p + d * vec3(pnoise(p + vec3(13.5, 0.0, 0.0)),",
    "                      pnoise(p + vec3(0.0, 13.5, 0.0)),",
    "                      pnoise(p + vec3(0.0, 0.0, 13.5)));",
    "}",
    "float nfac(vec3 p, float detail){ return clamp(0.5 + 1.4 * fbm(p, detail), 0.0, 1.0); }",
    /* THE LEVEL SET, and this is vein_mask() from build-slab.py exactly: the
       field minus its own middle, absolute, mapped through `width` and clamped,
       then raised to `sharpness`. A vein is where the field crosses its middle. */
    "float veinMask(vec3 p, float scale, float detail, float dist, float width, float sharp){",
    "  float f = nfac(warp(p * scale, dist), detail);",
    "  float m = clamp(1.0 - abs(f - 0.5) / max(width, 1e-6), 0.0, 1.0);",
    "  return pow(m, sharp);",
    "}",
    /* The bump height field: the first set's mask, with the others added onto it
       weighted by their own `bump` — a Mix RGB set to ADD with Factor = bump is
       A + bump * B, which is what build_material() wires up. */
    "float height(vec3 p){",
    "  float h = 0.0;",
    "  for (int i = 0; i < 4; i++){",
    "    if (i >= uN) break;",
    "    float m = veinMask(p, uScale[i], uDetail[i], uDist[i], uWidth[i], uSharp[i]);",
    "    h += (i == 0) ? m : uBump[i] * m;",
    "  }",
    "  return h;",
    "}",
    /* Colour and roughness, layered in the same order and by the same masks. */
    "void material(vec3 p, out vec3 albedo, out float rough){",
    "  albedo = uGround;",
    "  rough = uBaseRough;",
    "  for (int i = 0; i < 4; i++){",
    "    if (i >= uN) break;",
    "    float m = veinMask(p, uScale[i], uDetail[i], uDist[i], uWidth[i], uSharp[i]);",
    "    albedo = mix(albedo, uColour[i], m);",
    "    rough = mix(rough, uRough[i], m);",
    "  }",
    "}",
    /* One light. Its x extent is 10 against a block 1.19 wide, so it is
       effectively infinite across and its direction has no x component — which
       is why the render is flat across the whole width and a point light here
       would have put a hotspot in the middle of it. `ext` is the light's angular
       half-size, which widens the lobe: the cheap stand-in for integrating over
       an area, and without it a roughness of 0.07 is a mirror and the top face
       comes out as one blown line instead of a sweep.

       IT IS A QUARTER OF THE LIGHT'S EXTENT AND NOT A HALF, which is a factor of
       two that shows up as the whole shape of the top face. The lobe is a
       function of the HALF-VECTOR's angle off the normal, and that angle is half
       the angle between the mirror ray and the light — so a light subtending
       0.031 rad at the surface widens the lobe by 0.0157, not 0.031. At a half
       the top face ramped 39 -> 48 against a render that ramps 38 -> 84: the
       sweep was there and was a third of its depth, which reads as a plinth lit
       from nowhere in particular. At a quarter it is 49 -> 82. */
    "vec3 lamp(vec3 P, vec3 N, vec3 V, vec3 Lp, float energy, float ext, vec3 albedo, float rough){",
    "  vec3 d = Lp - P; d.x = 0.0;",
    "  float dd = max(dot(d, d), 1e-4);",
    "  vec3 L = normalize(d);",
    "  float ndl = dot(N, L);",
    "  if (ndl <= 0.0) return vec3(0.0);",
    "  float a = clamp(rough * rough + ext / sqrt(dd), 1e-3, 1.0);",
    /* THE SPECULAR IS EVALUATED IN THE Y-Z PLANE, and the x components are
       dropped from the VIEW and the NORMAL as well as from the light — which is
       the same approximation applied three times instead of once, and getting
       that wrong is a four-order-of-magnitude bug rather than a slight one.
       Zeroing d.x says the light is a line running across the block: ten units
       against a block of 1.19, so every point sees it in the same direction and
       the render is flat across its whole width. But the camera is a POINT, so
       V keeps a real x component — up to 0.24 at the block's end — and a
       half-vector built from an x-free L and an x-ful V tilts off the normal by
       0.22 rad where the lobe is 0.02 rad wide. Measured, the top face came out
       at 3 of 255 across its whole width while the centreline alone was right.
       Under a line light the reflection genuinely is x-invariant, so the fix is
       the honest one and not a fudge: project the geometry into the plane the
       light varies in. It also means the bump's ACROSS-block relief shows up in
       diffuse only, which is the same statement — a normal knocked sideways
       still points along the light. */
    "  vec3 Np = normalize(vec3(0.0, N.y, N.z));",
    "  vec3 Vp = normalize(vec3(0.0, V.y, V.z));",
    "  vec3 Hv = normalize(L + Vp);",
    "  float ndh = max(dot(Np, Hv), 0.0);",
    "  float dn = ndh * ndh * (a * a - 1.0) + 1.0;",
    "  float D = a * a / max(PI * dn * dn, 1e-8);",
    "  float ndv = max(dot(Np, Vp), 1e-3);",
    "  float ndlp = max(dot(Np, L), 1e-3);",
    "  float k = a * 0.5;",
    "  float G = (ndv / (ndv * (1.0 - k) + k)) * (ndlp / (ndlp * (1.0 - k) + k));",
    "  float spec = D * G * 0.04652 / (4.0 * ndv);",
    /* Diffuse keeps the FULL normal — it is a cosine and has no lobe to miss,
       so there is nothing to approximate away. */
    "  return energy / dd * (albedo * ndl / PI + vec3(spec));",
    "}",
    "float srgb(float c){ return c <= 0.0031308 ? c * 12.92 : 1.055 * pow(c, 1.0 / 2.4) - 0.055; }",
    "",
    /* One sample: the block at one point of the plate, in linear light, with
       coverage in .a — 0 where the ray missed the stone altogether, which is the
       silhouette and is what the plate carries in its alpha channel. */
    "vec4 sample1(vec2 st){",
    /* The plate's own screen space, from slab.json, so this lands on the same
       pixels the render does. */
    "  float sx = mix(-uXHalf, uXHalf, st.x);",
    "  float sy = mix(uYTop, uYBot, st.y);",
    "  float arris = -uH / uD;",
    "  vec3 P, N, T, B;",
    "  if (sy >= arris) {",
    /* The top face: Z = 0, so sy = -h/(Y+d) inverts straight to Y. */
    "    float Y = clamp(-uH / sy - uD, 0.0, uDepth);",
    "    float X = sx * (Y + uD);",
    "    if (abs(X) > uNearHalf) return vec4(0.0);",
    "    P = vec3(X, Y, 0.0); N = vec3(0.0, 0.0, 1.0);",
    "    T = vec3(1.0, 0.0, 0.0); B = vec3(0.0, 1.0, 0.0);",
    "  } else {",
    /* The front face: Y = 0, so sy = (Z - h)/d inverts to Z. Full width, which
       is why the plate is a trapezoid over a rectangle. */
    "    float Z = sy * uD + uH;",
    "    float X = sx * uD;",
    "    if (Z < -uHeight || abs(X) > uNearHalf) return vec4(0.0);",
    "    P = vec3(X, 0.0, Z); N = vec3(0.0, -1.0, 0.0);",
    "    T = vec3(1.0, 0.0, 0.0); B = vec3(0.0, 0.0, 1.0);",
    "  }",
    /* Object space, not world: build-slab.py applies the cube's SCALE but not
       its location, so the material's Object coordinates are measured from the
       block's centre. Getting this wrong moves every vein. */
    "  vec3 pObj = P - vec3(0.0, uDepth * 0.5, -uHeight * 0.5);",
    "  vec3 albedo; float rough;",
    "  material(pObj, albedo, rough);",
    /* THE BUMP, and it is clamped, which is the one place this shader knowingly
       departs from build-slab.py rather than merely approximating it.
       The height field is vein masks, and a mask crosses from 0 to 1 across a
       band a few ten-thousandths of a unit wide — so its world gradient runs
       into the thousands and Strength x Distance x that is a normal tilted by
       twenty degrees. Cycles survives it: it integrates an area light ten units
       wide, so a normal knocked sideways still finds it. This evaluates ONE
       direction, where the top face is a near-mirror off a light subtending two
       hundredths of a radian, and a tilt that size does not scatter the
       reflection so much as delete it — measured, the top face came out flat at
       37 where the plate ramps 39 to 85.
       So the perturbation is capped at a few degrees. The veins keep their
       relief and the mirror keeps the sweep, which is the pair that has to
       survive; what is lost is bump beyond the cap, and the previz says nothing
       useful about that. Read a plate for it. */
    "  float e = uPx;",
    "  float gT = (height(pObj + T * e) - height(pObj - T * e)) / (2.0 * e);",
    "  float gB = (height(pObj + B * e) - height(pObj - B * e)) / (2.0 * e);",
    "  vec3 pert = uBumpStrength * uBumpDist * (gT * T + gB * B);",
    "  float pl = length(pert);",
    "  if (pl > uBumpClamp) pert *= uBumpClamp / pl;",
    "  N = normalize(N - pert);",
    "  vec3 V = normalize(vec3(0.0, -uD, uH) - P);",
    "  vec3 c = lamp(P, N, V, uKeyPos, uKeyE * uKeyGain, uKeyExt, albedo, rough)",
    "         + lamp(P, N, V, uFillPos, uFillE * uFillGain, uFillExt, albedo, rough);",
    "  return vec4(c, 1.0);",
    "}",
    "",
    /* NINE SAMPLES A PIXEL, on a regular grid, and it is not a nicety. At scale
       34 and width 0.012 a hairline is about half a plate pixel across, so it is
       SUB-PIXEL — as it is in the render, which answers that with 1024 Cycles
       samples. One sample per pixel here made a stone that shimmered under the
       sliders and could not be judged: the vein you widened flickered in and out
       instead of getting wider. Nine is enough to make the change monotonic, and
       it also antialiases the silhouette, which the alpha channel needs. */
    "void main(){",
    "  vec4 acc = vec4(0.0);",
    "  for (int j = 0; j < 3; j++){",
    "    for (int i = 0; i < 3; i++){",
    "      vec2 o = ((vec2(float(i), float(j)) + 0.5) / 3.0 - 0.5) * uTexel;",
    "      acc += sample1(uv + o);",
    "    }",
    "  }",
    "  if (acc.a <= 0.0) discard;",
    /* Straight alpha, not premultiplied: the colour is the mean of the samples
       that HIT, and the coverage is how many did. The plate is used as a CSS
       background image, where a premultiplied edge is a dark fringe. */
    "  vec3 c = acc.rgb / acc.a;",
    "  gl_FragColor = vec4(srgb(c.r), srgb(c.g), srgb(c.b), acc.a / 9.0);",
    "}"
  ].join("\n");

  function initGL() {
    glCanvas = document.createElement("canvas");
    glCanvas.width = PREVIEW_W;
    glCanvas.height = Math.max(1, Math.round(PREVIEW_W * slab.plate.h / slab.plate.w));
    gl = glCanvas.getContext("webgl", { alpha: true, premultipliedAlpha: false,
                                        preserveDrawingBuffer: true, antialias: true });
    if (!gl) { warn("no WebGL in this browser — the baked plates still work, the previz does not."); return; }
    var vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return;
    prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      warn("previz shader would not link: " + gl.getProgramInfoLog(prog));
      prog = null; return;
    }
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ["uNearHalf", "uDepth", "uHeight", "uD", "uH", "uXHalf", "uYTop", "uYBot",
     "uGround", "uBaseRough", "uN", "uBumpStrength", "uBumpDist", "uBumpClamp",
     "uPx", "uTexel",
     "uKeyPos", "uFillPos", "uKeyE", "uFillE", "uKeyExt", "uFillExt",
     "uKeyGain", "uFillGain",
     "uScale[0]", "uDetail[0]", "uDist[0]", "uWidth[0]", "uSharp[0]",
     "uRough[0]", "uBump[0]", "uColour[0]"].forEach(function (n) {
      U[n] = gl.getUniformLocation(prog, n);
      if (U[n] === null) warn("previz uniform " + n + " did not resolve — the shader is not being driven.");
    });
  }

  function sh(kind, src) {
    var s = gl.createShader(kind);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      warn("previz shader would not compile: " + gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  function drawLive() {
    if (!prog) return;
    var t0 = performance.now();
    var b = slab.block, c = slab.camera, key = slab.lights.key, fill = slab.lights.fill;
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform1f(U.uNearHalf, b.near_half);
    gl.uniform1f(U.uDepth, b.depth);
    gl.uniform1f(U.uHeight, b.height);
    gl.uniform1f(U.uD, c.d);
    gl.uniform1f(U.uH, c.h);
    gl.uniform1f(U.uXHalf, c.x_half);
    gl.uniform1f(U.uYTop, c.y_top);
    gl.uniform1f(U.uYBot, c.y_bot);

    gl.uniform3fv(U.uGround, new Float32Array(live.ground));
    gl.uniform1f(U.uBaseRough, live.baseRough === undefined ? slab.base_rough : live.baseRough);
    gl.uniform1f(U.uBumpStrength, 0.06);   /* the Bump node's, in build-slab.py */
    gl.uniform1f(U.uBumpDist, 0.004);
    gl.uniform1f(U.uBumpClamp, 0.06);      /* ...and this one is only the previz's */
    /* One output pixel, in world units across the near edge — the step the
       height field's gradient is taken over, so the relief is a per-pixel one
       and the sub-pixel hairlines alias rather than exploding the derivative. */
    gl.uniform1f(U.uPx, 2.0 * b.near_half / glCanvas.width);
    gl.uniform2f(U.uTexel, 1 / glCanvas.width, 1 / glCanvas.height);

    /* Position, energy, and the extent that widens the lobe — the light's own
       depth, which is the axis the reflection actually sweeps along. */
    gl.uniform3fv(U.uKeyPos, new Float32Array(key[0]));
    gl.uniform3fv(U.uFillPos, new Float32Array(fill[0]));
    gl.uniform1f(U.uKeyE, key[3]);
    gl.uniform1f(U.uFillE, fill[3]);
    gl.uniform1f(U.uKeyExt, key[2] * 0.25);
    gl.uniform1f(U.uFillExt, fill[2] * 0.25);
    gl.uniform1f(U.uKeyGain, cal.key);
    gl.uniform1f(U.uFillGain, cal.fill);

    var n = Math.min(MAX_SETS, live.veins.length);
    gl.uniform1i(U.uN, n);
    var f = { scale: [], detail: [], dist: [], width: [], sharp: [], rough: [], bump: [], colour: [] };
    for (var i = 0; i < MAX_SETS; i++) {
      var v = live.veins[Math.min(i, live.veins.length - 1)];
      f.scale.push(v[fieldIndex("scale")]);
      f.detail.push(v[fieldIndex("detail")]);
      f.dist.push(v[fieldIndex("distortion")]);
      f.width.push(v[fieldIndex("width")]);
      f.sharp.push(v[fieldIndex("sharpness")]);
      f.rough.push(v[fieldIndex("rough")]);
      f.bump.push(v[fieldIndex("bump")]);
      var col = v[fieldIndex("colour")];
      f.colour.push(col[0], col[1], col[2]);
    }
    gl.uniform1fv(U["uScale[0]"], new Float32Array(f.scale));
    gl.uniform1fv(U["uDetail[0]"], new Float32Array(f.detail));
    gl.uniform1fv(U["uDist[0]"], new Float32Array(f.dist));
    gl.uniform1fv(U["uWidth[0]"], new Float32Array(f.width));
    gl.uniform1fv(U["uSharp[0]"], new Float32Array(f.sharp));
    gl.uniform1fv(U["uRough[0]"], new Float32Array(f.rough));
    gl.uniform1fv(U["uBump[0]"], new Float32Array(f.bump));
    gl.uniform3fv(U["uColour[0]"], new Float32Array(f.colour));

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    lastURL = glCanvas.toDataURL("image/png");
    msEl.textContent = Math.round(performance.now() - t0) + " ms  " +
                       glCanvas.width + "\u00d7" + glCanvas.height;

    /* The strip's row for an unbaked stone, so the thing being dragged is
       visible at plate width as well as in the composition. */
    var thumb = sheetEl.querySelector('button[data-stone="' + pick + '"] canvas');
    if (thumb) {
      var ctx = thumb.getContext("2d");
      ctx.clearRect(0, 0, thumb.width, thumb.height);
      ctx.drawImage(glCanvas, 0, 0, thumb.width, thumb.height);
    }
  }

  /* ---- the export -------------------------------------------------------- */

  function writeExport() {
    if (!live) return;
    var name = pick;
    var ind = "        ";
    var lines = [];
    var add = live.photo ? addedStone(name) : null;
    if (add) {
      /* An added stone exports as the COMMAND that would make another one,
         because that is the only form of it that works. Pasting its entry into
         PHOTO_CANDIDATES under a new name would give a stone pointing at
         design/plinth/maps/, which is the gemini photograph's maps and not this
         one's — a copy that bakes cleanly and comes out as a different rock. */
      lines.push("# design/plinth/stones/" + name + ".json, added by add-stone.py.");
      lines.push("# Nothing on this stone is tunable from here. For a variant, run");
      lines.push("# this against the same photograph and change what you want:");
      /* --name takes the STEM, not the key: add-stone.py appends the style to
         it, so passing the key back in would ask for `<name>-screen-fine-noir`
         and three others nobody wanted. */
      var stem = add.stem || name;
      var style = name.indexOf(stem + "-") === 0 ? name.slice(stem.length + 1) : null;
      lines.push("python design/plinth/add-stone.py \\");
      lines.push("    --src " + (add.src || "<photo>") + " --name " + stem + "-2"
                 + (style ? " --styles " + style : "") + " \\");
      lines.push("    --grade " + live.photo.grade + " --scale " + live.photo.scale
                 + " --offset " + live.photo.offset + " \\");
      lines.push("    --bump " + live.photo.bump.join(" ")
                 + " --sss " + live.photo.sss + " --coat " + live.photo.coat.join(" ") + " \\");
      lines.push("    --rough " + live.photo.rough + " --room " + (live.photo.room || "flat")
                 + (live.photo.crack ? " --crack" : ""));
      outPy.value = lines.join("\n") + "\n";
      writeCss(name);
      return;
    }
    if (live.photo) {
      /* The PHOTO_CANDIDATES entry as it stands, not as edited — nothing here
         is editable. It is exported anyway because the useful thing to copy off
         a photo stone is a STARTING POINT for the next one: paste it under a new
         name, change the scale or the grade, and bake. */
      lines.push("# design/plinth/build-slab.py - PHOTO_CANDIDATES, as it stands.");
      lines.push("# Nothing on this stone is tunable from here; copy it under a new");
      lines.push("# name, change what you want and re-bake:");
      lines.push("#     blender -b -P design/plinth/build-slab.py -- " + name);
      lines.push('    "' + name + '": {');
      lines.push('        "title": "' + live.title.replace(/"/g, "'") + '",');
      (slab.photo_fields || []).forEach(function (f) {
        var v = live.photo[f];
        if (v === undefined || v === null) return;
        lines.push('        "' + f + '": ' + pyVal(v) + ",");
      });
      lines.push("    },");
      outPy.value = lines.join("\n") + "\n";
      writeCss(name);
      return;
    }
    lines.push("# design/plinth/build-slab.py - into CANDIDATES. The previz this came");
    lines.push("# from is not Cycles: the pattern will differ, so BAKE IT to confirm.");
    lines.push('    "' + name + '": {');
    lines.push('        "title": "' + live.title.replace(/"/g, "'") + '",');
    lines.push("        GROUND: (" + live.ground.map(function (c) { return c.toFixed(3); }).join(", ") + "),");
    lines.push('        "veins": [');
    live.veins.forEach(function (v) {
      var col = v[fieldIndex("colour")];
      lines.push(ind + "    (" + [
        v[fieldIndex("scale")].toFixed(1),
        v[fieldIndex("detail")].toFixed(1),
        v[fieldIndex("distortion")].toFixed(1),
        v[fieldIndex("width")].toFixed(3),
        v[fieldIndex("sharpness")].toFixed(1),
        "(" + col.map(function (c) { return c.toFixed(2); }).join(", ") + ")",
        v[fieldIndex("rough")].toFixed(2),
        v[fieldIndex("bump")].toFixed(2)
      ].join(", ") + "),");
    });
    lines.push("        ],");
    lines.push("    },");
    if (live.baseRough !== undefined && Math.abs(live.baseRough - slab.base_rough) > 1e-9) {
      lines.push("");
      lines.push("# ...and BASE_ROUGH is global, so this moves every candidate:");
      lines.push("BASE_ROUGH = " + live.baseRough.toFixed(3) +
                 "   # was " + slab.base_rough);
    }
    outPy.value = lines.join("\n") + "\n";
    writeCss(name);
  }

  /* The second export box, split out of writeExport() so a photo stone can
     reach it without going through the vein-set serialiser above. It says the
     same thing for both families: which rule the stylesheet needs, and the one
     command that re-bakes and prints a new digest. */
  function writeCss(name) {
    var css = [];
    /* A photo stone HAS a plate but has no rule — the stylesheet only carries
       the four procedural ones — so it needs the same line an unbaked stone
       does. Keying this on `baked` alone sent it to the "already has a rule"
       branch and quietly told you there was nothing to add. */
    if (!stones[name].baked || stones[name].photo) {
      css.push("/* portfolio/styles.css, under the .panel-plinth block. A stone with no");
      css.push("   rule fails as a missing image rather than a missing rule, which is why");
      css.push("   this line and the bake go together. */");
      css.push('.panel[data-marble="' + name + '"] { --panel-plinth-src: url("img/tex/plinth-' +
               name + '.webp?v=' + (slab.version || "XXXXXXXX") + '"); }');
      css.push("");
    } else {
      css.push("/* `" + name + "` already has a rule and a plate. Re-baking it changes the");
      css.push("   digest, so the ?v= on ALL FOUR url()s moves together. */");
      css.push("");
    }
    css.push("# then, from the repo root:");
    css.push('"C:/Program Files/Blender Foundation/Blender 5.2/blender.exe" -b \\');
    css.push("    -P design/plinth/build-slab.py -- " + name);
    css.push("# it prints the new PLINTH_VERSION to paste over every ?v=");
    outCss.value = css.join("\n") + "\n";
  }

  function copy(el) {
    el.select();
    try { navigator.clipboard.writeText(el.value); } catch (_) { document.execCommand("copy"); }
    document.getElementById("copy-hint").textContent = "copied";
    setTimeout(function () { document.getElementById("copy-hint").textContent = ""; }, 1200);
  }
  document.getElementById("copy-py").addEventListener("click", function (e) { e.stopPropagation(); copy(outPy); });
  document.getElementById("copy-css").addEventListener("click", function (e) { e.stopPropagation(); copy(outCss); });
  document.getElementById("drawer-head").addEventListener("click", function () {
    var body = document.getElementById("drawer-body");
    var hid = !body.hidden;
    body.hidden = hid;
    this.setAttribute("aria-expanded", hid ? "false" : "true");
    this.querySelector(".caret").textContent = hid ? "▸" : "▾";
  });

  /* ---- persistence -------------------------------------------------------
     Nothing is written before restore() has read. save() is reached from
     sizeFrame() and from every slider, and the frame's load event is later than
     this script — so without the guard the first session's sizeFrame() writes
     `{}` over whatever the last one left and the tuner looks like it starts
     clean on purpose. effects-tuner.html says the same at more length; it is
     the same bug and it was found there. */
  function save() {
    if (!ready) return;
    try {
      localStorage.setItem(STORE, JSON.stringify({
        pick: pick, mode: mode, live: live, cal: cal, closed: closed,
        theme: theme, w: fwEl.value, h: fhEl.value
      }));
    } catch (_) {}
  }

  function restore() {
    var raw = null;
    try { raw = localStorage.getItem(STORE); } catch (_) {}
    if (raw) {
      try {
        var s = JSON.parse(raw);
        if (s.pick && stones[s.pick]) pick = s.pick;
        if (s.mode) mode = s.mode;
        if (s.cal) cal = s.cal;
        if (s.closed) closed = s.closed;
        if (s.w) fwEl.value = s.w;
        if (s.h) fhEl.value = s.h;
        /* The stored stone is only put back if it is still the SAME stone —
           a re-render that changed the table should win over a session that
           was dragging the old one, and silently reviving numbers the script
           no longer has is exactly the drift slab.json exists to stop. */
        if (s.live && s.pick === pick && s.live.veins) live = s.live;
      } catch (_) {}
    }
    if (!stones[pick]) pick = Object.keys(stones)[0];
    if (!live) live = cloneStone(stones[pick]);
    if (!stones[pick].baked) mode = "live";
    markSheet();
    markMode();
    ready = true;
  }
})();
</script>
</body>
</html>
