  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ctext%20x='16'%20y='23'%20font-family='Sitka%20Text,Charter,Iowan%20Old%20Style,Georgia,serif'%20font-size='19'%20text-anchor='middle'%20fill='%231a1917'%3Ecj%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      var root = document.documentElement;

      var theme = "light";
      var savedTheme = null;
      try { savedTheme = localStorage.getItem("portfolio-theme"); } catch (_) {}
      if (savedTheme === "dark" || savedTheme === "light") theme = savedTheme;
      else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      root.setAttribute("data-theme", theme);
      root.className += " js";

      /* ---- the corner plate -------------------------------------------------
         The plate runs most of the way across the page and is the one heavy
         thing on it, so it is neither named in the stylesheet nor fetched at one
         size.
         Here, before the stylesheet has even been asked for, we work out how
         many real pixels this display will actually draw it in and fetch only
         that rung of design/plate/build-plate.py's ladder — keep PLATES below
         and OUT_WIDTHS there the same list.

         There is a ladder per THEME as well as per rung, because the grade is
         baked and the plate on black wants different endpoints from the plate on
         white — see ONE LADDER PER THEME in build-plate.py. So this picks one
         file out of a grid, not a list, and it picks again when the theme
         changes under it. A theme that has not been tuned away from light has no
         ladder of its own on purpose; rungUrl's caller falls back to the light
         file, which is the plate this page shipped before the grade had a theme
         axis at all.

         The page then waits for it, briefly, because the plate is part of the
         opening composition rather than decoration laid over it — the type is
         printed ON it — and type arriving first with the picture sliding in
         behind a moment later is worse than either. But it is still only a
         picture: the wait is capped, and past the cap the page opens without it
         rather than holding the words hostage to an ornament. It is dropped
         rather than shown late for the same reason it is waited for at all.

         Nothing here can leave the page invisible. The class this adds only
         SHORTENS a reveal that styles.css already guarantees on its own, so a
         parse error, a dead network or a browser that never fires onload all
         end with the page up. */
      var PLATES = [800, 1300, 2000, 2800];
      var WAIT_MS = 1500;

      /* --plate-w, in CSS pixels. It is a LENGTH and not a share of the window —
         the plate is drawn the same size on every display — so the window's own
         width is not in this sum at all, and the only thing left that decides how
         many real pixels get drawn is the display's density. A narrow phone asks
         for exactly what a 4K desktop asks for, because it is going to be sent
         exactly the same picture and simply cannot see all of it.
         Keep it equal to --plate-w in styles.css; being wrong picks a neighbouring
         rung, which is a slightly soft or slightly heavy plate, not a broken one. */
      var PLATE_W = 1161.6;
      /* The smallest rung that covers what this display will draw, or the top of
         the ladder if nothing does. A function rather than the loop it replaces
         because the answer is now wanted in three places — boot, a theme change,
         and a move onto a denser screen — and they have to agree. */
      var rungFor = function (need) {
        for (var i = 0; i < PLATES.length; i++) {
          if (PLATES[i] >= need) return PLATES[i];
        }
        return PLATES[PLATES.length - 1];
      };
      var pick = rungFor(PLATE_W * (window.devicePixelRatio || 1));

      /* Metered or genuinely slow connections do not get it at all. It is an
         ornament, and this is the one honest way to treat it as optional. */
      var link = navigator.connection || {};
      var thin = link.saveData === true || /^(slow-)?2g$/.test(link.effectiveType || "");

      if (!thin) {
        root.className += " plate-wait";

        /* Both kept per theme, because the two ladders are different pictures
           rather than one at two opacities: `shown` is the widest rung that has
           actually RESOLVED for a theme and `srcs` is the URL it resolved to. So
           flipping back to a theme you have already been in is a repaint and not
           a fetch, and a rung upgrade on one theme does not make the page think
           the other one has been upgraded too. */
        var shown = { light: 0, dark: 0 };
        var srcs = { light: null, dark: null };

        var current = function () {
          return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
        };
        var paint = function () {
          var src = srcs[current()];
          if (src) root.style.setProperty("--plate-src", 'url("' + src + '")');
        };

        /* Light is unsuffixed. Keep this spelling and out_path() in
           design/plate/build-plate.py together — they are the same two names. */
        var rungUrl = function (width, theme) {
          return "img/plate-" + (theme === "dark" ? "dark-" : "") + width + ".webp";
        };

        /* A miss on a dark file is the ordinary untuned state and not an error:
           build-plate.py writes no dark ladder while dark's grade matches
           light's, deliberately, rather than shipping a duplicate. So one retry
           against the light rung of the same width, and only then give up. */
        var fetchRung = function (width, theme, settle) {
          var attempt = function (url, fallback) {
            var img = new Image();
            var land = function (src) { settle(width, theme, src); };
            img.onload = function () { land(url); };
            img.onerror = function () {
              if (fallback) attempt(fallback, null); else land(null);
            };
            img.src = url;
            /* Already in the cache: onload still fires, but this saves the wait
               on browsers that defer it to a later task. */
            if (img.complete && img.naturalWidth > 0) land(url);
          };
          attempt(rungUrl(width, theme),
                  theme === "light" ? null : rungUrl(width, "light"));
        };

        var keep = function (width, theme, src) {
          if (src && width > shown[theme]) {
            shown[theme] = width;
            srcs[theme] = src;
          }
          paint();
        };
        var done = function (width, theme, src) {
          keep(width, theme, src);
          root.classList.remove("plate-wait");
        };

        fetchRung(pick, current(), done);
        setTimeout(function () { done(0, current(), null); }, WAIT_MS);

        /* Every route into a theme change lands on the same attribute of the same
           element — the toggle in app.js, the system preference app.js follows
           until you use that toggle, and the plate tuner priming localStorage —
           so the attribute is what this watches. It is also the only seam
           available: this script runs in <head>, before app.js exists, and
           reaching forward into it would invert that order.

           It never re-enters .plate-wait. The hold is for the opening
           composition, where the type really is waiting on the picture it is
           printed on; a flip mid-visit already has a plate on screen, and
           blanking that to wait for the other one would be worse than the swap
           arriving a moment late. Same reason paint() leaves the outgoing plate
           up until the incoming one has loaded. */
        if (window.MutationObserver) {
          new MutationObserver(function () {
            var theme = current();
            paint();
            /* Measured now rather than reusing the rung picked at boot: the
               display may have been dragged onto a denser screen since, and this
               theme has never been asked for at all. */
            var need = rungFor(PLATE_W * (window.devicePixelRatio || 1));
            if (need > shown[theme]) fetchRung(need, theme, keep);
          }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
        }

        /* Dragged onto a DENSER screen. Pulling the window wider no longer asks
           for anything — the plate is the same size in it either way — so what is
           left to catch is the laptop moved onto a hidpi monitor, which changes
           devicePixelRatio and fires this. Upgrade only — a plate already good
           enough is left alone, so this cannot thrash — and quietly, off the
           critical path: the swap happens when the larger rung has finished
           loading, never by blanking what is already on screen.
           For the theme on screen only. The other one is upgraded if and when it
           is next shown, which is the same "never fetch a plate nobody is looking
           at" the boot path already follows. */
        var timer;
        window.addEventListener("resize", function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            var theme = current();
            var need = rungFor(PLATE_W * (window.devicePixelRatio || 1));
            if (need > shown[theme]) fetchRung(need, theme, keep);
          }, 250);
        });
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <!-- Only ever on screen while the corner plate is genuinely outstanding: it is
       display:none until <html> carries .plate-wait, and it fades in later than
       any plate already in cache takes to arrive, so a fast load never paints
       it. See the loading line in styles.css. -->
  <div class="loading" role="status" aria-label="Loading"></div>
  <div class="page" id="page"></div>
  <!-- The second screen the cut title opens onto. Empty, and sized entirely in
       CSS: see the doorway block in styles.css. -->
  <div class="doorway"></div>
  <noscript><p style="text-align:center;font-family:'Sitka Text',Charter,'Iowan Old Style',Georgia,serif;padding:2rem">This site needs JavaScript enabled.</p></noscript>
  <script src="content.js?v=3"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
